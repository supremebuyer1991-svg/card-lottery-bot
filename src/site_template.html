<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="__DESC__">
__HEADMETA__
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap&text=%E3%83%88%E3%83%AC%E3%82%AB%E6%8A%BD%E9%81%B8%E3%83%8A%E3%83%93">
<style>
/* Layout: 抽選券の半券を縦に積んだリスト。左端に締切カウント、右端に応募ボタン。上部に絞り込みを固定 */
:root {
  --paper: #f3f4f7;      /* 背景：わずかに青みのある紙 */
  --card: #ffffff;
  --ink: #161c2e;        /* 文字：紺がかった墨 */
  --ink-2: #545c73;
  --rule: #dfe2ea;
  --red: #c8102e;        /* 抽選の赤（主役の色） */
  --red-soft: #fbe7ea;
  --amber: #a85d00;      /* 締切が迫っている */
  --amber-soft: #fff1dc;
  --navy-soft: #e6e9f2;
  --done: #2f7a4f;
  --font-display: "Dela Gothic One", "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10131c; --card: #181c28; --ink: #eceef5; --ink-2: #a3aac0; --rule: #2a3043;
    --red: #ff5a6e; --red-soft: #3a1820; --amber: #ffb547; --amber-soft: #3a2a12; --navy-soft: #232a3d; --done: #5cc78a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10131c; --card: #181c28; --ink: #eceef5; --ink-2: #a3aac0; --rule: #2a3043;
  --red: #ff5a6e; --red-soft: #3a1820; --amber: #ffb547; --amber-soft: #3a2a12; --navy-soft: #232a3d; --done: #5cc78a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 4px; }

/* ヘッダー */
header.top { background: var(--card); border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 6px; flex-wrap: wrap; }
.home { text-decoration: none; }
/* ロゴ：「抽選」を赤い半券（左右の切り欠き＋切り取り線）に。字体は Dela Gothic One */
.logo { display: inline-flex; flex-direction: column; gap: 4px; color: var(--ink); }
.logo small { font-family: var(--font-num); font-size: 9px; font-weight: 600; letter-spacing: .22em; color: var(--ink-2); line-height: 1; }
.logo .w { display: flex; align-items: center; font-family: "Dela Gothic One", "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 400; font-size: 24px; letter-spacing: -.01em; line-height: 1; }
.logo .t { position: relative; margin: 0 5px; background: var(--red); color: #fff; padding: 5px 13px 6px 11px; border-radius: 4px;
  -webkit-mask: radial-gradient(circle 5px at 0 50%, #0000 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 5px at 100% 50%, #0000 98%, #000) right / 51% 100% no-repeat;
  mask: radial-gradient(circle 5px at 0 50%, #0000 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 5px at 100% 50%, #0000 98%, #000) right / 51% 100% no-repeat; }
.logo .t::after { content: ""; position: absolute; top: 4px; bottom: 4px; right: 7px; border-right: 1.5px dashed rgb(255 255 255 / .55); }
.lead { margin-block: 18px 0; display: grid; gap: 6px; }
.lead h1 { font-family: var(--font-body); font-weight: 700; letter-spacing: .01em; font-size: 22px; line-height: 1.35; margin: 0; text-wrap: balance; }
.lead p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 65ch; }
.links { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; }
.links a { color: var(--ink-2); }
.links b { font-weight: 700; color: var(--ink); }
.aff { font-size: 13px; }
/* 広告枠（PR）：商品カード */
.ad { margin-top: 10px; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgb(22 28 46 / .05); }
.ad-top { display: flex; align-items: center; gap: 8px; padding: 9px 14px; font-size: 12px; font-weight: 700; color: var(--ink-2); border-bottom: 1px solid var(--rule);
  background: linear-gradient(90deg, var(--red-soft), transparent 70%); }
.ad-pr { font-family: var(--font-num); font-size: 10px; letter-spacing: .08em; color: var(--card); background: var(--ink-2); border-radius: 3px; padding: 1px 5px; }
.ad-main { display: flex; gap: 14px; padding: 14px; align-items: center; }
.ad-img { flex: none; width: 92px; height: 92px; border-radius: 10px; background: #fff; border: 1px solid var(--rule); display: grid; place-items: center; overflow: hidden; }
.ad-img img { width: 100%; height: 100%; object-fit: contain; }
.ad-img .ph { color: var(--ink-2); opacity: .5; }
.ad-info { min-width: 0; flex: 1; display: grid; gap: 2px; }
.ad-info small { font-size: 11px; color: var(--ink-2); }
.ad-info b { font-size: 17px; line-height: 1.3; }
.ad-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.ad-btns a { text-align: center; text-decoration: none; font-size: 13px; font-weight: 700; border-radius: 8px; padding: 9px 4px; white-space: nowrap; }
.b-rak { background: #bf0000; color: #fff; }
.b-amz { background: #ffd814; color: #0f1111; border: 1px solid #fcd200; }
.ad-btns a:only-child { grid-column: 1 / -1; }
.ad-sup { padding: 0 14px 14px; }
.ad-sup p { margin: 0 0 8px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.ad-sup div { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ad-tiles { padding-top: 14px; }
.ad-tiles div { grid-template-columns: repeat(4, 1fr); }
.ad-tiles a span { font-size: 11px; letter-spacing: -.04em; white-space: nowrap; }
.ad-sup a { display: grid; justify-items: center; gap: 4px; padding: 10px 4px 8px; text-decoration: none; color: var(--ink); font-size: 12px; font-weight: 700;
  background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; }
.ad-sup a svg { color: var(--red); }
.ad-sup a:hover, .ad-btns a:hover { filter: brightness(1.05); }
/* 商品が横に流れる広告 */
.flow-wrap { overflow: hidden; padding: 12px 0 14px; -webkit-mask: linear-gradient(90deg, #0000, #000 16px, #000 calc(100% - 16px), #0000); mask: linear-gradient(90deg, #0000, #000 16px, #000 calc(100% - 16px), #0000); }
.flow-track { display: flex; width: max-content; animation: flow var(--sec, 40s) linear infinite; }
.flow-dup { display: contents; }
.flow-wrap:hover .flow-track, .flow-wrap:active .flow-track, .flow-wrap:focus-within .flow-track { animation-play-state: paused; }
@keyframes flow { to { transform: translateX(-50%); } }
.fi { flex: none; width: 128px; margin-left: 10px; display: grid; gap: 3px; text-decoration: none; color: var(--ink); }
.fi-img { width: 128px; height: 128px; border-radius: 10px; background: #fff; border: 1px solid var(--rule); display: grid; place-items: center; overflow: hidden; }
.fi-img img { width: 100%; height: 100%; object-fit: contain; transition: transform .2s; }
.fi:hover .fi-img img { transform: scale(1.04); }
.fi small { font-size: 10px; color: var(--ink-2); margin-top: 3px; }
.fi b { font-size: 13px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 2.6em; }
.fi em { font-style: normal; font-size: 11px; font-weight: 700; color: #bf0000; }
@media (prefers-reduced-motion: reduce) {
  .flow-wrap { overflow-x: auto; -webkit-mask: none; mask: none; }
  .flow-track { animation: none; }
  .flow-dup { display: none; }
}
.ad-sup a small { font-size: 9px; color: var(--ink-2); font-weight: 500; line-height: 1; margin-top: 2px; }
.ad-sup a strong { font-family: var(--font-num); font-size: 13px; color: #bf0000; line-height: 1.1; }
.ad p.ad-note { margin: -6px 14px 10px; font-size: 10px; line-height: 1.4; color: var(--ink-2); }
.ad-amz { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 0 14px 14px; font-size: 12px; }
.ad-amz b { color: var(--ink-2); font-size: 11px; }
.ad-amz a { color: var(--ink); font-weight: 700; text-decoration: underline; text-decoration-color: #f0c14b; text-underline-offset: 3px; }
.ad-more { display: block; text-align: center; font-size: 12px; font-weight: 700; color: #bf0000; text-decoration: none; padding: 0 14px 14px; }
.aff a { color: var(--red); font-weight: 700; }
.pre { display: grid; gap: 6px; }
.pre li { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; list-style: none; }
.brand p { margin: 0; color: var(--ink-2); font-size: 12px; }
.sample { margin: 0 0 8px; font-size: 12px; color: var(--amber); background: var(--amber-soft); padding: 4px 10px; border-radius: 6px; display: inline-block; }
nav.games { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.games button { flex: none; border: 0; background: none; font: inherit; font-weight: 700; color: var(--ink-2); padding: 10px 12px 12px; cursor: pointer; border-bottom: 3px solid transparent; }
nav.games button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--red); }
nav.games .n { font-family: var(--font-num); font-size: 12px; margin-left: 4px; color: var(--ink-2); }

/* サマリー */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; margin-block: 16px 12px; }
.stats div { background: var(--card); padding: 10px 14px; }
.stats b { display: block; font-family: var(--font-num); font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stats .hot b { color: var(--red); }
.stats span { font-size: 12px; color: var(--ink-2); }

/* 絞り込み（固定） */
.filters { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 8px; display: grid; gap: 8px; border-bottom: 1px solid var(--rule); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; background: var(--navy-soft); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; font: inherit; font-size: 14px; font-weight: 700; padding: 6px 14px; border-radius: 999px; color: var(--ink-2); cursor: pointer; }
.seg button small { display: block; font-size: 10px; font-weight: 500; line-height: 1.1; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
select, input[type="search"] { font: inherit; font-size: 14px; color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; min-width: 0; }
input[type="search"] { flex: 1 1 160px; }
.row.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.row.scroll::-webkit-scrollbar { display: none; }
.toggle { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; border: 1px solid var(--rule); background: var(--card); border-radius: 999px; padding: 4px 12px; cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--red); margin: 0; }
.toggle:has(input:checked) { border-color: var(--ink); }
.hint { font-size: 12px; color: var(--ink-2); }

/* 店頭抽選：地方 → 都道府県の2段 */
.region { margin-top: 14px; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 0 12px; }
.region .lbl { font-size: 12px; font-weight: 700; color: var(--ink-2); padding: 0 12px 6px; display: flex; justify-content: space-between; }
.region .lbl small { font-weight: 500; }
.r-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 0 12px; scroll-padding-inline: 12px; }
.r-row::-webkit-scrollbar { display: none; }
.r-row button { flex: none; font: inherit; font-size: 13px; font-weight: 700; border: 1px solid var(--rule); background: var(--paper); color: var(--ink);
  border-radius: 8px; padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.r-row button .c { font-family: var(--font-num); font-size: 11px; color: var(--ink-2); }
.r-row button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.r-row button[aria-pressed="true"] .c { color: inherit; opacity: .7; }
.r-row button:disabled { opacity: .4; cursor: default; }
.r-pref { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--rule); }
.r-row.r-reg { display: grid; grid-template-columns: repeat(4, 1fr); overflow: visible; }
.r-row.r-reg button { justify-content: center; padding: 8px 2px; font-size: 12px; letter-spacing: -.03em; white-space: nowrap; flex-direction: column; gap: 1px; line-height: 1.2; }
.r-row.r-pref { flex-wrap: wrap; overflow: visible; }
.r-pref button { background: var(--card); border-radius: 999px; font-weight: 500; padding: 5px 11px; }
.r-pref button.all { font-weight: 700; }

/* 弾の切り替え（横スワイプ） */
.series { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 14px -16px 2px; padding: 2px 16px 6px; scroll-padding-inline: 16px; scroll-snap-type: x proximity; }
.series::-webkit-scrollbar { display: none; }
.series button { flex: none; scroll-snap-align: start; display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 13px; font-weight: 700;
  border: 1px solid var(--rule); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 8px 7px 14px; cursor: pointer;
  box-shadow: 0 1px 0 rgb(22 28 46 / .04); }
.series button[data-s=""] { padding-right: 14px; }
.series button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.series .c { font-family: var(--font-num); font-size: 11px; font-weight: 600; color: var(--ink-2); background: var(--navy-soft); border-radius: 999px; padding: 1px 7px; min-width: 22px; text-align: center; }
.series button[aria-pressed="true"] .c { background: rgb(255 255 255 / .16); color: inherit; }

/* 一覧：抽選券 */
.list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding-block: 12px 32px; }
.group-h { font-family: var(--font-body); font-weight: 700; font-size: 16px; margin: 14px 0 0; display: flex; align-items: baseline; gap: 8px; }
.group-h small { font-family: var(--font-num); font-size: 12px; color: var(--ink-2); }
.ticket { display: grid; grid-template-columns: 112px 1fr auto; background: var(--card); border: 1px solid var(--rule); border-radius: 10px; position: relative; }
.ticket.applied { opacity: .55; }
.stub { padding: 12px 10px; border-right: 2px dashed var(--rule); display: grid; align-content: center; gap: 2px; text-align: center; position: relative; }
.stub::before, .stub::after { content: ""; position: absolute; right: -9px; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 1px solid var(--rule); }
.stub::before { top: -9px; clip-path: inset(50% 0 0 0); }
.stub::after { bottom: -9px; clip-path: inset(0 0 50% 0); }
.cd { font-family: var(--font-num); font-weight: 600; font-size: 17px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.cd-l { font-size: 11px; color: var(--ink-2); }
.dl { font-family: var(--font-num); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.soon .cd { color: var(--red); }
.near .cd { color: var(--amber); }
.body { padding: 12px 14px; min-width: 0; display: flex; gap: 12px; align-items: flex-start; }
.info { min-width: 0; display: grid; gap: 4px; flex: 1; }
.thumb { flex: none; width: 76px; aspect-ratio: 1; border-radius: 8px; background: var(--navy-soft); overflow: hidden; display: grid; place-items: center; }
.thumb { position: relative; background: #fff; border: 1px solid var(--rule); }
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.thumb .pr { position: absolute; right: 0; bottom: 0; font-size: 9px; font-weight: 700; line-height: 1; color: #fff; background: #bf0000; padding: 2px 4px; border-top-left-radius: 4px; }
.thumb .ph { font-family: var(--font-body); font-weight: 700; font-size: 11px; line-height: 1.25; color: var(--ink-2); text-align: center; padding: 6px; overflow-wrap: anywhere; }
.flow { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.flow i { font-style: normal; opacity: .6; }
.flow span { border-radius: 4px; padding: 1px 6px; background: var(--navy-soft); }
.flow .st { background: var(--ink); color: var(--card); }
.flow .sh { background: var(--done); color: #fff; }
.req { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 9px; border: 1px solid transparent; white-space: nowrap; }
.pill.need { background: var(--amber-soft); color: var(--amber); }
.pill.ok { background: transparent; color: var(--done); border-color: var(--done); }
.pill.unk { background: transparent; color: var(--ink-2); border-color: var(--rule); font-weight: 500; }
.store { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 4px; }
.badge.new { background: var(--red); color: var(--card); }
.ticket.feed .pr-note { font-family: var(--font-num); font-size: 10px; letter-spacing: .06em; color: var(--ink-2); }
.ticket.feed .cd { color: var(--ink-2); font-size: 15px; }
.go.amz { background: #ffd814; color: #0f1111; border: 1px solid #fcd200; }
.badge.pr { background: var(--navy-soft); color: var(--ink-2); font-family: var(--font-num); }
.ticket.invite { grid-template-columns: 112px minmax(0, 1fr); border-color: #f0c14b; background: linear-gradient(180deg, rgb(255 190 20 / .10), var(--card) 140px); }
.ticket.invite .cd { color: #b06d00; }
.inv { list-style: none; margin: 6px 0 2px; padding: 0; display: grid; gap: 6px; }
.inv a { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-decoration: none; color: var(--ink); font-size: 13px; font-weight: 700;
  background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; }
.inv a span { min-width: 0; line-height: 1.35; }
.inv a span b { display: block; font-weight: 700; }
.inv a span small { display: block; font-size: 11px; font-weight: 500; color: var(--ink-2); }
.inv em { flex: none; font-style: normal; font-size: 12px; background: #ffd814; border: 1px solid #fcd200; color: #0f1111; border-radius: 999px; padding: 3px 10px; }
@media (max-width: 560px) { .ticket.invite { grid-template-columns: 92px minmax(0, 1fr); } }
.ticket.invite .info, .ticket.invite .body { min-width: 0; }
.ticket.invite .info, .inv { grid-template-columns: minmax(0, 1fr); }
.inv .more summary { cursor: pointer; list-style: none; text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-2); padding: 6px; border: 1px dashed var(--rule); border-radius: 8px; }
.inv .more summary::-webkit-details-marker { display: none; }
.inv .more details[open] summary { margin-bottom: 6px; }
.badge.area { background: var(--navy-soft); color: var(--ink); }
.product { color: var(--ink-2); font-size: 14px; overflow-wrap: anywhere; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 11px; border: 1px solid var(--rule); border-radius: 4px; padding: 0 6px; color: var(--ink-2); }
.cond { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.acts { padding: 12px 14px 12px 0; display: grid; gap: 6px; align-content: center; justify-items: stretch; }
.go { display: inline-block; text-align: center; text-decoration: none; background: var(--red); color: #fff; font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 8px; white-space: nowrap; }
.go:hover { filter: brightness(1.08); }
.mini { display: flex; gap: 6px; justify-content: center; }
.mini a, .mini button { font: inherit; font-size: 12px; color: var(--ink-2); background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 3px 8px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.mini button[aria-pressed="true"] { color: var(--done); border-color: var(--done); font-weight: 700; }
.empty { text-align: center; color: var(--ink-2); padding: 40px 16px; background: var(--card); border: 1px dashed var(--rule); border-radius: 10px; }

/* メニュー（ページ下部と、ヘッダーのボタンで開くシート） */

<script type="application/json" id="data">/*__DATA__*/</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var GAMES = DATA.games; // [{id, name}]
  var NOW0 = Date.now();
  // サンプル表示では締切を「今からの時間」で持たせ、いつ開いても動いて見えるようにする
  var items = DATA.items.map(function (it) {
    var o = Object.assign({}, it);
    if (DATA.sample) {
      o.end = o.end_h == null ? null : new Date(NOW0 + o.end_h * 3600e3).toISOString();
      o.found_at = new Date(NOW0 - (o.found_h || 48) * 3600e3).toISOString();
    }
    o._end = o.end ? Date.parse(o.end) : null;
    return o;
  });

  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var applied = load("lot_applied", {});
  var LOCK = DATA.lock || {};
  var st = Object.assign({ game: GAMES[0].id, channel: "online", region: "", area: "", q: "", series: "" },
    LOCK.game ? {} : load("lot_view", {}), LOCK);
  if (!LOCK.game && location.hash && GAMES.some(function (g) { return "#" + g.id === location.hash; })) st.game = location.hash.slice(1);

  var $ = function (id) { return document.getElementById(id); };
  var REGIONS = [
    ["北海道・東北", ["北海道", "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県"]],
    ["関東", ["茨城県", "栃木県", "群馬県", "埼玉県", "千葉県", "東京都", "神奈川県"]],
    ["中部", ["新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県", "静岡県", "愛知県"]],
    ["近畿", ["三重県", "滋賀県", "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県"]],
    ["中国・四国", ["鳥取県", "島根県", "岡山県", "広島県", "山口県", "徳島県", "香川県", "愛媛県", "高知県"]],
    ["九州・沖縄", ["福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県"]]];
  var REG = {}, PREF_ORDER = [];
  REGIONS.forEach(function (r) { r[1].forEach(function (p) { REG[p] = r[0]; PREF_ORDER.push(p); }); });
  if (st.area && REG[st.area]) st.region = REG[st.area];
  // 店頭抽選の対象の都道府県（1店舗なら area、複数店舗なら条件の「対象地域：〇〇・〇〇」から）
  function areasOf(i) {
    if (i.area) return [i.area];
    var m = /対象地域[:：]([^／]+)/.exec(i.conditions || "");
    return m ? m[1].split(/[・、,\s]+/).filter(function (p) { return REG[p]; }) : [];
  }
  function isMulti(i) {
    return !i.area && (i.multi || areasOf(i).length > 1 || /各店|ほか|全店|複数|店舗共通|[・、].*店/.test(i.store || ""));
  }
  var WEEK = "日月火水木金土";

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmtDate(t) {
    if (t == null) return "締切 要確認";
    var d = new Date(t);
    return (d.getMonth() + 1) + "/" + d.getDate() + "(" + WEEK[d.getDay()] + ") " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  function countdown(t) {
    if (t == null) return { text: "—", cls: "" };
    var ms = t - Date.now();
    if (ms <= 0) return { text: "受付終了", cls: "" };
    var h = Math.floor(ms / 3600e3), m = Math.floor(ms % 3600e3 / 60e3), s = Math.floor(ms % 60e3 / 1e3);
    if (h < 24) return { text: String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0"), cls: "soon" };
    var d = Math.floor(h / 24);
    return { text: d + "日 " + (h % 24) + "時間", cls: d < 3 ? "near" : "" };
  }
  function gcal(it) {
    if (it._end == null) return null;
    var z = function (t) { return new Date(t).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); };
    var title = "【締切】" + it.store + " " + (it.series || it.product) + " 抽選";
    return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(title) +
      "&dates=" + z(it._end - 3600e3) + "/" + z(it._end) + "&details=" + encodeURIComponent((it.url || "") + "\n" + (it.conditions || ""));
  }
  function isToday(t) { if (t == null) return false; var a = new Date(t), b = new Date(); return a.toDateString() === b.toDateString(); }
  function needs(it, tag) { return (it.tags || []).indexOf(tag) >= 0; }
  function isNew(it) { return it.found_at && Date.now() - Date.parse(it.found_at) < 24 * 3600e3; }

  function inGame() { return items.filter(function (i) { return i.game === st.game && (i._end == null || i._end > Date.now()); }); }

  // Amazonの招待リクエスト（ネット抽選の一番上に固定する券）
  function invites() { return (DATA.amazonInvites || {})[st.game] || []; }
  function inviteTicket() {
    var list = invites(), q = st.q.trim().toLowerCase();
    if (!list.length || !DATA.amazonTag) return "";
    if (st.series) list = list.filter(function (x) { return x.name.indexOf(st.series) >= 0; });
    if (q) list = list.filter(function (x) { return x.name.toLowerCase().indexOf(q) >= 0 || "amazon".indexOf(q) >= 0; });
    if (!list.length) return "";
    var li = function (x) {
      var m = /^(.+?)（(.+)）$/.exec(x.name);  // 「セット名（中身）」は中身を大きく
      var label = m ? '<span><b>' + esc(m[2]) + '</b><small>' + esc(m[1]) + '</small></span>' : '<span>' + esc(x.name) + '</span>';
      return '<li><a href="' + esc(x.url) + '" target="_blank" rel="nofollow sponsored noopener">' + label + '<em>リクエスト</em></a></li>';
    };
    var rows = list.slice(0, 5).map(li).join("") + (list.length > 5
      ? '<li class="more"><details><summary>ほか' + (list.length - 5) + '件を見る</summary><ul class="inv">' + list.slice(5).map(li).join("") + '</ul></details></li>' : "");
    return '<article class="ticket invite">' +
      '<div class="stub"><span class="cd-l">締切</span><span class="cd">随時</span><span class="dl">受付中</span></div>' +
      '<div class="body"><div class="info"><div class="store">Amazon 招待リクエスト<span class="badge pr">PR</span></div>' +
      '<div class="product">Amazonの招待制販売は、商品ページの「招待をリクエスト」から申し込みます。招待が届いた人だけが購入できます。</div>' +
      '<div class="flow"><span>Web応募</span><i aria-hidden="true">→</i><span class="sh">発送</span></div>' +
      '<ul class="inv">' + rows + '</ul></div></div></article>';
  }

  // 抽選5件ごとに1つ、Amazonの紹介（直前5件で一番多い弾）
  var AD_EVERY = 5;
  function feedAd(chunk) {
    if (!DATA.amazonTag) return "";
    var c = {}, best = "", g = (DATA.gameNames || {})[st.game] || "";
    chunk.forEach(function (i) { if (i.series) { c[i.series] = (c[i.series] || 0) + 1; if (!best || c[i.series] > c[best]) best = i.series; } });
    var q = best ? g + " " + best : g + " BOX";
    var url = "https://www.amazon.co.jp/s?k=" + encodeURIComponent(q) + "&tag=" + encodeURIComponent(DATA.amazonTag);
    var g2 = { pokemon: "ポケモンカードゲーム", onepiece: "ONE PIECEカードゲーム", dragonball: "ドラゴンボールスーパーカードゲーム フュージョンワールド" }[st.game] || g;
    return '<article class="ticket feed">' +
      '<div class="stub"><span class="cd-l">在庫</span><span class="cd">通販</span><span class="dl">随時</span></div>' +
      '<div class="body"><div class="info"><div class="store">Amazon</div>' +
      '<div class="product">' + esc(g2) + '「' + esc(best || "最新弾") + '」の通販・予約</div>' +
      '<div class="flow"><span>Web購入</span><i aria-hidden="true">→</i><span class="sh">発送</span></div>' +
      '<div class="pr-note">PR</div></div></div>' +
      '<div class="acts"><a class="go amz" href="' + esc(url) + '" target="_blank" rel="nofollow sponsored noopener">Amazonで見る</a></div>' +
    '</article>';
  }
  function withAds(arr, counter) {
    var out = "";
    arr.forEach(function (i) {
      out += ticket(i);
      counter.recent.push(i); counter.n++;
      if (counter.n % AD_EVERY === 0) { out += feedAd(counter.recent); counter.recent = []; }
    });
    return out;
  }

  function filtered() {
    var q = st.q.trim().toLowerCase();
    var inv = st.channel === "online" && invites().length;
    return inGame().filter(function (i) {
      if (inv && /amazon/i.test((i.store || "") + (i.url || ""))) return false;  // Amazonは一番上の券にまとめる
      if ((i.channel === "store" ? "store" : "online") !== st.channel) return false;
      if (st.channel === "store" && st.area && areasOf(i).indexOf(st.area) < 0) return false;
      if (st.channel === "store" && !st.area && st.region && !areasOf(i).some(function (p) { return REG[p] === st.region; })) return false;
      if (st.series && i.series !== st.series) return false;
      if ($("f-unapplied").checked && applied[i.key]) return false;
      if ($("f-noid").checked && i.id_check !== false) return false;
      if ($("f-nomember").checked && i.member !== "none") return false;
      if ($("f-nocard").checked && i.member === "card") return false;
      if ($("f-noapp").checked && needs(i, "アプリ")) return false;
      if ($("f-today").checked && !isToday(i._end)) return false;
      if (q && (i.store + " " + i.product + " " + (i.series || "")).toLowerCase().indexOf(q) < 0) return false;
      return true;
    }).sort(function (a, b) { return (a._end == null ? 9e15 : a._end) - (b._end == null ? 9e15 : b._end); });
  }

  function thumb(it) {
    var alt = esc(it.series || it.product);
    if (!it.image) return "";
    var img = '<img src="' + esc(it.image) + '" alt="' + alt + '" loading="lazy">';
    return it.img_url ? '<a class="thumb" href="' + esc(it.img_url) + '" target="_blank" rel="nofollow sponsored noopener" title="楽天市場で見る">' + img + '<span class="pr">楽天</span></a>'
      : '<div class="thumb">' + img + '</div>';
  }
  function reqs(it) {
    var id = it.id_check === true ? '<span class="pill need">本人確認 必要</span>'
      : it.id_check === false ? '<span class="pill ok">本人確認 不要</span>' : '<span class="pill unk">本人確認 不明</span>';
    var mem = it.member === "card" ? '<span class="pill need">会員カード 必要</span>'
      : it.member === "account" ? '<span class="pill need">会員登録 必要</span>'
      : it.member === "none" ? '<span class="pill ok">会員 不要</span>' : '<span class="pill unk">会員 不明</span>';
    return '<div class="req">' + id + mem + '</div>';
  }
  // 応募のしかた → 受け取り方（例：Web応募 → 店頭受取）
  function flow(it) {
    var m = it.method || "", tg = (it.tags || []).join(" ");
    var how = /SNS|X抽選|ポスト|リポスト/.test(m + tg) ? "SNS応募" : /アプリ/.test(m) ? "アプリ応募"
      : /店頭|整理券|抽選券/.test(m + tg) ? "店頭応募" : (m || it.channel === "online") ? "Web応募" : "";
    var get = it.channel === "store" ? "店頭受取" : "発送";
    return '<div class="flow">' + (how ? '<span>' + how + '</span><i aria-hidden="true">→</i>' : "") +
      '<span class="' + (it.channel === "store" ? "st" : "sh") + '">' + get + '</span></div>';
  }
  var TAGWORDS = ["会員", "本人確認", "SNS応募", "アプリ", "レシート", "整理券", "購入履歴"];
  function condText(it) {
    return (it.conditions || "").split(" ／ ").filter(function (p) {
      return !p.split("・").every(function (w) { return TAGWORDS.indexOf(w.trim()) >= 0; });
    }).join(" ／ ");
  }
  function otherTags(it) { return (it.tags || []).filter(function (t) { return ["会員", "本人確認"].indexOf(t) < 0; }); }

  function ticket(it) {
    var cd = countdown(it._end), done = !!applied[it.key], cal = gcal(it);
    return '<article class="ticket' + (done ? " applied" : "") + '" data-key="' + esc(it.key) + '">' +
      '<div class="stub ' + cd.cls + '"><span class="cd-l">締切まで</span><span class="cd" data-end="' + (it._end || "") + '">' + cd.text + '</span><span class="dl">' + fmtDate(it._end) + '</span></div>' +
      '<div class="body">' + thumb(it) + '<div class="info"><div class="store">' + esc(it.store) +
        (it.channel === "store" && it.area ? '<span class="badge area">' + esc(it.area) + '</span>' : "") +
        (isNew(it) ? '<span class="badge new">NEW</span>' : "") + '</div>' +
        '<div class="product">' + esc(it.product) + '</div>' + flow(it) + reqs(it) +
        (otherTags(it).length ? '<div class="tags">' + otherTags(it).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join("") + '</div>' : "") +
        (condText(it) ? '<div class="cond">' + esc(condText(it)) + '</div>' : "") +
      '</div></div>' +
      '<div class="acts">' + (it.url ? '<a class="go" href="' + esc(it.url) + '" target="_blank" rel="noopener">応募ページへ</a>' : '<span class="hint">応募先は店舗告知で確認</span>') +
        '<div class="mini"><button type="button" class="ap" aria-pressed="' + done + '">' + (done ? "応募済み ✓" : "応募済みにする") + '</button>' +
        (cal ? '<a href="' + cal + '" target="_blank" rel="noopener">カレンダー</a>' : "") + '</div></div>' +
    '</article>';
  }

  function render() {
    if (!LOCK.game) save("lot_view", { game: st.game, channel: st.channel, region: st.region, area: st.area });
    var g = inGame();
    var gs = st.series ? g.filter(function (i) { return i.series === st.series; }) : g;
    // ゲームタブ
    $("games").innerHTML = GAMES.map(function (x) {
      var n = items.filter(function (i) { return i.game === x.id && (i._end == null || i._end > Date.now()); }).length;
      return '<button role="tab" type="button" data-g="' + x.id + '" aria-selected="' + (x.id === st.game) + '">' + esc(x.name) + '<span class="n">' + n + '</span></button>';
    }).join("");
    // サマリー
    var today = gs.filter(function (i) { return isToday(i._end); }).length;
    var fresh = gs.filter(isNew).length;
    var unapplied = gs.filter(function (i) { return !applied[i.key]; }).length;
    $("stats").innerHTML = '<div><b>' + gs.length + '</b><span>受付中</span></div>' +
      '<div class="hot"><b>' + today + '</b><span>今日締切</span></div>' +
      '<div><b>' + unapplied + '</b><span>あなたが未応募</span></div>';
    void fresh;
    // チャネル
    [].forEach.call($("channel").children, function (b) { b.setAttribute("aria-pressed", String(b.dataset.v === st.channel)); });
    // 店頭抽選：地方 → 都道府県
    var storeItems = g.filter(function (i) { return i.channel === "store" && (!st.series || i.series === st.series); });
    var pc = {}; storeItems.forEach(function (i) { areasOf(i).forEach(function (p) { pc[p] = (pc[p] || 0) + 1; }); });
    var rc = function (r) { return storeItems.filter(function (i) { return areasOf(i).some(function (p) { return REG[p] === r[0]; }); }).length; };
    var cur = REGIONS.filter(function (r) { return r[0] === st.region; })[0];
    var rh = '<div class="lbl">地域でしぼる<small>' + (st.area ? esc(st.area) : st.region ? esc(st.region) + "の全体" : "全国") + "を表示中</small></div>" +
      '<div class="r-row r-reg"><button type="button" data-r="" aria-pressed="' + (!st.region) + '">全国<span class="c">' + storeItems.length + "</span></button>" +
      REGIONS.map(function (r) { var n = rc(r); return '<button type="button" data-r="' + r[0] + '" aria-pressed="' + (r[0] === st.region) + '"' + (n ? "" : " disabled") + ">" + r[0] + '<span class="c">' + n + "</span></button>"; }).join("") + "</div>";
    if (cur) {
      rh += '<div class="r-row r-pref"><button type="button" class="all" data-p="" aria-pressed="' + (!st.area) + '">' + cur[0] + '全体<span class="c">' + rc(cur) + "</span></button>" +
        cur[1].map(function (p) { var n = pc[p] || 0; return '<button type="button" data-p="' + p + '" aria-pressed="' + (p === st.area) + '"' + (n ? "" : " disabled") + ">" + p.replace(/[都府県]$/, "") + '<span class="c">' + n + "</span></button>"; }).join("") + "</div>";
    }
    $("region").innerHTML = rh;
    $("region").hidden = st.channel !== "store";
    // 弾
    var ser = {};
    g.forEach(function (i) { if (i.series) ser[i.series] = (ser[i.series] || 0) + 1; });
    var names = Object.keys(ser).sort(function (a, b) { return ser[b] - ser[a]; });
    if (st.series && !ser[st.series]) st.series = "";
    $("series").innerHTML = names.length ? '<button type="button" data-s="" aria-pressed="' + (!st.series) + '">すべての弾</button>' +
      names.map(function (s) { return '<button type="button" data-s="' + esc(s) + '" aria-pressed="' + (s === st.series) + '">' + esc(s) + '<span class="c">' + ser[s] + '</span></button>'; }).join("") : "";
    // 一覧
    var list = filtered(), html = "";
    if (!list.length) {
      html = '<div class="empty">条件に合う抽選はありません。<br>絞り込みを外すか、別の弾・地域を選んでください。</div>';
    } else if (st.channel === "store" && !st.area) {
      var by = {};
      var MULTI = "複数店舗", UNKNOWN = "地域不明", cnt = { n: 0, recent: [] };
      list.forEach(function (i) { var k = i.area || (isMulti(i) ? MULTI : UNKNOWN); (by[k] = by[k] || []).push(i); });
      var rank = function (a) { var x = PREF_ORDER.indexOf(a); return x >= 0 ? x : a === MULTI ? 98 : 99; };
      Object.keys(by).sort(function (a, b) { return rank(a) - rank(b); }).forEach(function (a) {
        html += '<h2 class="group-h">' + esc(a) + '<small>' + by[a].length + '件</small></h2>' + withAds(by[a], cnt);
      });
    } else {
      html = (st.channel === "online" ? inviteTicket() : "") + withAds(list, { n: 0, recent: [] });
    }
    $("list").innerHTML = html;
  }

  // イベント
  $("games").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-g]"); if (!b) return;
    if (DATA.gameUrls && DATA.gameUrls[b.dataset.g] && LOCK.game) { location.href = DATA.gameUrls[b.dataset.g]; return; }
    st.game = b.dataset.g; st.series = ""; st.area = ""; st.region = ""; render();
  });
  $("channel").addEventListener("click", function (e) { var b = e.target.closest("button[data-v]"); if (!b) return; st.channel = b.dataset.v; render(); });
  $("region").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || b.disabled) return;
    if (b.hasAttribute("data-r")) { st.region = b.dataset.r; st.area = ""; }
    else if (b.hasAttribute("data-p")) { st.area = b.dataset.p; }
    render();
  });
  $("q").addEventListener("input", function () { st.q = this.value; render(); });
  $("series").addEventListener("click", function (e) { var b = e.target.closest("button[data-s]"); if (!b) return; st.series = b.dataset.s; render(); });
  ["f-unapplied", "f-noid", "f-nomember", "f-nocard", "f-noapp", "f-today"].forEach(function (id) { $(id).addEventListener("change", render); });
  $("list").addEventListener("click", function (e) {
    var b = e.target.closest("button.ap"); if (!b) return;
    var k = b.closest(".ticket").dataset.key;
    if (applied[k]) delete applied[k]; else applied[k] = Date.now();
    save("lot_applied", applied); render();
  });

  // 画像が読めなければ弾名の表示に戻す
  document.addEventListener("error", function (e) {
    var img = e.target;
    if (img.tagName === "IMG" && img.parentNode.classList.contains("thumb")) {
      img.parentNode.innerHTML = '<span class="ph">' + esc(img.alt) + '</span>';
    }
  }, true);

  // カウントダウンを1秒ごとに更新
  setInterval(function () {
    document.querySelectorAll(".cd[data-end]").forEach(function (el) {
      var t = Number(el.dataset.end); if (!t) return;
      var c = countdown(t); el.textContent = c.text; el.parentNode.className = "stub " + c.cls;
    });
  }, 1000);

  $("sample").hidden = !DATA.sample;
  (function () {
    var dlg = $("menu-sheet"), src = document.querySelector(".foot-nav .menu"), btn = $("menu-open");
    if (!src || !dlg.showModal) { btn.hidden = true; return; }
    btn.addEventListener("click", function () { if (!$("menu-body").firstChild) $("menu-body").appendChild(src.cloneNode(true)); dlg.showModal(); });
    $("menu-close").addEventListener("click", function () { dlg.close(); });
    dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });
  })();
  $("updated").textContent = "更新 " + fmtDate(DATA.sample ? NOW0 : Date.parse(DATA.updated));
  render();
})();
</script>
