# 動作設定（環境変数で上書き可：AUTO_APPROVE / DRY_RUN）

auto_approve: true        # true=見つけたら即投稿（テスト用捨てアカ向け） / false=GitHubのIssueで承認制
dry_run: false            # true=XにもWPにも投稿せず、ログに出すだけ
min_confidence: 0.7       # AI抽出の自信度がこれ未満は投稿しない（承認待ちに回す）
max_posts_per_run: 0      # 1回の実行で投稿する最大数（0＝自動投稿を停止中。再開するなら 3 に戻す）
remind_hours_before: 24   # 締切の何時間前にリマインド投稿するか

# --- X API の費用対策（従量課金） ---
x_read_budget_per_day: 300  # Xから読む投稿の1日上限（1件 約$0.005 → 300件で約$1.5/日）
post_link: false            # 個別告知にリンクを付けるか（リンク付き投稿は1件 約$0.20と高い）
quote_source: false         # 店舗の告知ポストを引用する（自動化ラベル付きアカウントは引用不可＝403になるのでオフ）
summary_hours: []           # 自動のまとめ投稿（リンク付き・1件約$0.20）。空＝オフ（手動運用：サイトの /x-draft.html からコピペ）。自動にするなら [7, 15, 23] のように時刻を入れる

site_public_url: ""        # 自作サイトのURL（例 https://torecachusen.com）。サイトマップ・正規URLに使う
site_url: ""              # WordPressのURL（例 https://example.com）。空ならWP更新はスキップ

hashtags:
  pokemon: "#ポケカ #ポケカ抽選"
  onepiece: "#ワンピカード #ワンピカード抽選"
  dragonball: "#フュージョンワールド #DBFW"

game_names:
  pokemon: ポケモンカード
  onepiece: ワンピースカード
  dragonball: ドラゴンボール フュージョンワールド

# WPまとめページのスラッグ（ゲームごとに1ページ自動更新）
wp_pages:
  pokemon: pokeca-lottery
  onepiece: onepiece-card-lottery
  dragonball: dbfw-lottery

# Amazonアソシエイトのトラッキングタグ（例 xxxx-22）。入れると弾ごとの記事にAmazon検索リンクを自動で付ける
amazon_tag: "st9994ststst-22"

# 楽天：商品画像と楽天リンク（アプリID・アクセスキーは GitHub Secrets の RAKUTEN_APP_ID / RAKUTEN_ACCESS_KEY）
rakuten_affiliate_id: "0f60e3a0.0ec21e9a.0f60e3a1.23a40abb"  # 楽天アフィリエイトID
rakuten_refresh_days: 3         # 1つの弾の画像を何日ごとに取り直すか
rakuten_max_calls_per_run: 8    # 1回の実行で楽天に問い合わせる最大数

# 弾ごとの記事を入れるWPカテゴリのID（WP管理画面→投稿→カテゴリーで確認。空なら未分類）
wp_categories:
  pokemon: null
  onepiece: null
  dragonball: null

# まとめページ下部に表示するアフィリンク（もしも/Amazon/楽天のリンクを貼る）
affiliate:
  pokemon:
    - label: ポケカ 最新弾をAmazonで見る
      url: ""
    - label: スリーブ・ローダー等のサプライ
      url: ""
  onepiece:
    - label: ワンピカード 最新弾をAmazonで見る
      url: ""
  dragonball:
    - label: フュージョンワールド 最新弾をAmazonで見る
      url: ""
