        - "いちばんの特徴は、名前に「Z」がつくメガシンカexが登場すること。公式サイトでは、メガルカリオZex・メガガブリアスZex・メガアブソルZexが紹介されています。フローゼルexやシンボラーexも収録されます。"
        - "トレーナーズでは、サポート「コルニの本気」「マキシの熱血」が登場します。「マキシの熱血」には、漫画家の原哲夫さんが描きおろしたSAR（スペシャルアートレア）があります。"
        - "1パック5枚入りで200円（税込）。基本エネルギーカードは入っていないので、対戦で使う人は別に用意しましょう。"
      points:
