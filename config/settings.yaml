# 抽選のまとめブログ（お店・公式ではない）。応募ボタンのリンク先がここになっていたら、リンクを外す
# ※アメブロ・はてな・noteなどはお店が自分で告知に使っていることがあるので入れない
blog_domains: [mikeco-room.com, cardchusen.com, nyuka-now.com]

# LivePocket常連店のお店ページを直接見る仕組み（src/lpshops.py）。11/2 試したが、LivePocketはGitHubの実行環境からのアクセスには
# 中身のないページ（ボット対策）を返すため停止中。読める環境に移したら true に
lp_shops_enabled: false

# 11/3 Threadsはお店ごとの速報をやめてまとめだけに（表示が1〜8回しかなかった）
threads_each: false

# 朝の「今日締切の抽選まとめ」をXに画像つきで出す（11/7・サンプルをユーザーに確認してから true にする）
deadline_post: false
deadline_post_hour: 7

# 大手の速報をバリューコマースのアフィリエイトリンクにする（11/7）。
# vc_x_site_id：バリューコマースの「サイト追加」で @pokepi_tcg（X）を登録したときのサイトID（数字）
# vc_programs：提携できたお店ごとの広告主のプログラムID（数字）。空のお店は今まで通りサイトへのリンク
vc_x_site_id: ""
vc_programs:
  sevennet: ""

# 同じお店なのに名前の書き方が違って別ページになっていたもの（11/9 SEO点検。検索の評価が2ページに割れるので1つにまとめる）
store_alias_fix:
  "CARD CREW(カードクルー)通販": "CARD CREW（カードクルー）トレカ通販"


# 11/11：弾ページの「収録カードの相場（RR以上）」。Cloudflare の Worker（rakuten-watch）がスニダンから少しずつ集める
# q：スニダンの商品名にある弾の名前（かっこ「」ごと）。rar：集めるレアリティ
card_sets:
  - {key: "pokemon|ハドウシーカー", q: "「ハドウシーカー」", rar: [RR, AR, SR, SAR, UR, MUR]}
  - {key: "pokemon|30th CELEBRATION", q: "「30th CELEBRATION」", rar: [RR, AR, SR, SAR, UR, MUR, FUR]}
  - {key: "pokemon|ストームエメラルダ", q: "「ストームエメラルダ」", rar: [RR, AR, SR, SAR, UR, MUR]}
  - {key: "pokemon|アビスアイ", q: "「アビスアイ」", rar: [RR, AR, SR, SAR, UR, MUR]}
  - {key: "pokemon|MEGAドリームex", q: "「MEGAドリームex」", rar: [RR, AR, SR, SAR, UR, MUR]}
# 11/11：収録カードの写真。楽天にカードだけの写真がないカードは TCGplayer（日本版）の写真で補う
# TCGplayer のアフィリエイト（Impact）の承認が下りて、写真を使ってよいと確かめてから true にする
tcgplayer_photos: false
tcgplayer_aff: ""  # Impact のリンクの形（{url} のところに商品ページのURLが入る）
