# 動作設定（環境変数で上書き可：AUTO_APPROVE / DRY_RUN）

auto_approve: true        # true=見つけたら即投稿（テスト用捨てアカ向け） / false=GitHubのIssueで承認制
dry_run: false            # true=XにもWPにも投稿せず、ログに出すだけ
min_confidence: 0.7       # AI抽出の自信度がこれ未満は投稿しない（承認待ちに回す）
max_posts_per_run: 0      # 1回の実行で投稿する最大数（0＝自動投稿を停止中。再開するなら 3 に戻す）
big_post: true             # 大手（⭐のチェーン＋通販大手）の新しい抽選を、見つけたら自動でXに速報（リンク付き・1件 約$0.20）
big_start_since: "2026-11-02T12:00+09:00"  # 予告で見つけていた大手の抽選の「受付開始」速報は、これより後に始まるものだけ（11/2のゲオは手動で投稿済み）
big_posts_per_day: 4       # 大手の速報の1日の上限（費用の上限：6件×約$0.20）
remind_hours_before: 24   # 締切の何時間前にリマインド投稿するか
run_hours: [7, 10, 13, 17, 19, 22]   # 自動の実行の時刻（.github/workflows/run.yml の cron と同じにする。GitHubの無料枠に収めるため1日6回。11/8 に12回→6回に合わせた。Xの1日の上限を残りの回数で割るのに使う）
market_hour: 8              # 「今日の相場」でスニダンを見に行く時刻（1日1回だけ）
closed_urls:                # 手動で終了にする抽選（応募先のURLの一部）。終わっているのに出ている時はここに足す
  - 1999.co.jp/11371442     # ホビーサーチ 30th CELEBRATION（抽選ではなく通販・販売終了）
  - 1999.co.jp/11371443     # ホビーサーチ 30th プレミアムデッキセット（同上）
  - batoloco_ashkw/status/2108783615991836891   # TCバトロコ旭川駅前 30周年御三家カードセット（終了）
page_checks_per_run: 20     # 11/10：40→20（1回の実行が長くなりGitHubの使用時間を超えそうなため） 応募ページ（通販・フォーム・LivePocket）を見に行く数（1件につき1日1回）
no_end_post_days: 10       # Xの告知は、投稿から何日たっても締切不明なら終了扱いにするか
no_end_expire_days: 10    # 締切が書かれていない抽選は、見つけてからこの日数で終了にする
no_end_start_days: 14     # 締切不明でも、受付開始からこの日数たったら終了にする
purge_closed_days: 2      # 終了した抽選は、この日数たったらデータから削除する

# --- X API の費用対策（従量課金） ---
x_read_budget_per_day: 150  # Xから読む投稿の1日上限（1件 約$0.005 → 150件で約$0.75/日。11/2 に300→150：LivePocket常連店をお店ページで拾うようにしたので）。上限に届いたらGitHubのIssueでお知らせ→OKなら x_read_budget_by_date にその日だけ増やす数を書く
x_read_budget_peak: 300     # 新弾（拡張パック・ブースターパック）の発売日の x_peak_days_before 日前〜発売日だけ、この上限にする（抽選が多い山場）
x_peak_days_before: 7
x_read_budget_by_date:       # 特定の日だけ上限を変える（締切の調べ直しの分。過ぎた日付は自動で無効）
  "2026-10-27": 700
post_link: false            # 個別告知にリンクを付けるか（リンク付き投稿は1件 約$0.20と高い）
quote_source: false         # 店舗の告知ポストを引用する（自動化ラベル付きアカウントは引用不可＝403になるのでオフ）
buzz_hour:                  # 自動のリンクなし投稿の時刻（空＝オフ。今は下書きページで確認して手動投稿）。自動にするなら 20 のように時刻を入れる
trend_hours: []             # Xで話題のネタを読んで下書きを作る時刻。[]でオフ（今はオフ）。やるなら [19] のように時刻を入れる（1回あたりXを40件読む）
trend_reads: 20             # 1回にポケカ・ワンピそれぞれ何件読むか
trend_drafts: 4             # 1回に作る下書きの本数
summary_hours: []           # 自動のまとめ投稿（リンク付き・1件約$0.20）。空＝オフ（手動運用：サイトの /x-draft.html からコピペ）。自動にするなら [7, 15, 23] のように時刻を入れる

