        html: <ul><li><b>LivePocketの会員登録</b>をして、告知にある抽選ページから申し込みます。応募は無料です。</li><li><b>お一人様1回</b>、一覧の店舗の中から<b>1店舗を選んで</b>応募します。同じ人が重ねて応募すると、すべて無効になります。</li><li>申し込み時の質問にすべて同意・回答した人が対象です。</li></ul>
