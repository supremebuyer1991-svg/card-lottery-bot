# store_re … このお店の抽選を下に並べるための、お店の名前のパターン
guides:
  - slug: amazon-invite
    name: Amazon
    store_re: "Amazon|アマゾン"
    short: Amazonの招待リクエストのやり方・招待の確かめ方
    title: Amazon招待リクエストのやり方｜ポケカ・ワンピースカードの招待制販売・招待メールが来ない時
    h1: Amazon「招待リクエスト」のやり方と、招待の確かめ方
    desc: Amazon.co.jpの招待制販売（招待リクエスト）で、ポケカ・ワンピースカードを買う方法。申し込み方、招待の届き方、招待メールが届かない時の確かめ方、注意点をまとめました。受付中の招待リクエストの一覧つき。
    intro: Amazon.co.jpでは、人気のポケカ・ワンピースカードのBOXが「招待制販売」になることがあります。商品ページで「招待をリクエスト」しておき、Amazonから招待された人だけが購入できるしくみです。
    sections:
      - h: 申し込み方（招待リクエスト）
        html: <ul><li>対象の商品ページにある「<b>招待をリクエストする</b>」ボタンを押すだけで申し込めます。</li><li>対象は、販売元・出荷元がAmazon.co.jpの商品です。</li><li>リクエストは<b>3か月</b>有効です（その間に招待されることがあります）。</li></ul>
      - h: 招待の届き方と確かめ方
        html: <ul><li>招待は<b>メール</b>で届き、Amazonの<b>メッセージセンター</b>でも確認できます。在庫に合わせて、そのつど送られます。</li><li>携帯電話会社のメールの設定（HTMLメールを受け取らない設定など）によっては、<b>招待メールが届かない</b>ことがあります。</li><li>招待メールが来ていなくても招待されている場合があるので、<b>商品ページやメッセージセンターをこまめに確認</b>するのがおすすめです。</li></ul>
      - h: 招待されたら
        html: <ul><li>購入できる期限は短く、招待のお知らせに書かれています。期限を過ぎると買えなくなるので、早めに購入してください。</li><li>招待されても、ほかの制限で購入できないことがあります。</li><li>注文をキャンセルすると、もう一度注文することはできません。</li></ul>
    faq:
      - ["Amazonの招待リクエストはどうやって申し込みますか？", "対象の商品ページの「招待をリクエストする」ボタンを押すと申し込めます。リクエストは3か月有効です。"]
      - ["招待メールが届きません。", "メールの受信設定によっては招待メールが届かないことがあります。招待はAmazonのメッセージセンターでも確認できるので、商品ページとあわせてこまめに確認してください。"]
      - ["招待されたら、いつまでに買えばいいですか？", "購入できる期限は短く、招待のお知らせに書かれています。期限を過ぎると購入できなくなるので、早めに購入してください。"]
    sources:
      - ["ファミ通（Amazon招待制販売）", "https://www.famitsu.com/article/202504/40670"]
      - ["電撃オンライン", "https://dengekionline.com/article/202608/83452"]

  - slug: pokemon-center-online
    name: ポケモンセンターオンライン
    game: pokemon
    store_re: "ポケモンセンター"
    short: ポケモンセンターオンラインの抽選のやり方・結果の確かめ方
    title: ポケモンセンターオンラインの抽選のやり方｜結果はいつ・どこで確認？購入期限まで
    h1: ポケモンセンターオンラインの抽選のやり方と、結果の確かめ方
    desc: ポケモンセンターオンラインのポケカ抽選の応募方法、結果の確認方法（マイページ・メール）、発表の時間帯、当選後の購入期限の目安をまとめました。受付中の抽選の一覧つき。
    intro: ポケモンセンターオンラインでは、新弾のBOXや記念商品が抽選販売になることがよくあります。応募から当選後の購入まで、これまでの抽選でわかっていることをまとめました。
    sections:
      - h: 応募のしかた
        html: <ul><li>ポケモンセンターオンラインの会員として、商品ページから応募します。</li><li>「<b>ひとつの抽選につき、おひとり様1回まで</b>」です。</li><li>30周年の商品では、プレイヤーズクラブの<b>本人認証済み（マイナンバーカード）の枠</b>と、<b>本人未認証（電話番号認証）の枠</b>に分かれ、当選数の大半は本人認証済みの枠でした。</li><li>登録しているメールアドレスが一致しないと、当選の資格がなくなった回があります。</li></ul>
      - h: 結果の確かめ方と発表の時間
        html: <ul><li>結果は<b>マイページの「抽選履歴一覧」</b>か、<b>応募したメールアドレスに届くメール</b>で確認できます。</li><li>これまでの発表は、<b>平日の13時〜17時台</b>が多くなっています。</li></ul>
      - h: 当選したら
        html: <ul><li>購入できる期間は、発表から<b>5〜6日ほど</b>だった回があります（例：9/30発表→10/6 16:59まで）。</li><li>支払いが<b>クレジットカードのみ</b>だった回があります。</li></ul>
    faq:
      - ["ポケモンセンターオンラインの抽選結果はどこで確認できますか？", "マイページの「抽選履歴一覧」か、応募したメールアドレスに届くメールで確認できます。"]
      - ["結果は何時ごろに出ますか？", "これまでの発表は平日の13時〜17時台が多くなっています。抽選ごとに違うので告知も確認してください。"]
      - ["当選したら、いつまでに買えばいいですか？", "発表から5〜6日ほどだった回があります。期限は抽選ごとに違うので、当選のお知らせで確認してください。"]
    sources:
      - ["電撃オンライン（30周年商品の抽選）", "https://dengekionline.com/article/202609/86745"]
      - ["インサイド", "https://www.inside-games.jp/article/2025/09/22/171928.html"]
      - ["ゲームペディア", "https://premium.gamepedia.jp/shopping/?p=49377"]

  - slug: rakuten-books
    name: 楽天ブックス
    store_re: "楽天ブックス"
    short: 楽天ブックスの抽選のやり方・応募の条件
    title: 楽天ブックスの抽選販売のやり方｜ポケカ・ワンピースカードの応募条件・当選後の購入
    h1: 楽天ブックスの抽選のやり方と、応募の条件
    desc: 楽天ブックスのポケカ・ワンピースカード抽選の応募条件（楽天会員・1世帯1名など）、当選の連絡、購入期間と注意点をまとめました。受付中の抽選の一覧つき。
    intro: 楽天ブックスでも、人気のトレカのBOXが抽選販売になることがあります。応募の条件が細かく決められているので、応募前に確認しておきましょう。
    sections:
      - h: 応募の条件
        html: <ul><li><b>住所を登録した楽天会員</b>であることが条件です。</li><li><b>1世帯1名</b>まで、当選は<b>1人1点</b>までです。</li><li>複数のアカウントでの応募、法人名義、転売目的とみられる応募、過去にすでに購入した人の応募は<b>無効</b>になります。</li><li>楽天ブックスでの<b>過去1年の購入実績</b>が条件になった回があります。</li></ul>
      - h: 結果と当選後の購入
        html: <ul><li>結果は<b>メール</b>で知らされます。</li><li>購入できる期間が決められていて（例：9/14 10:00〜9/18 9:59）、支払いが<b>クレジットカードのみ</b>だった回があります。</li><li>注文するときの住所が応募したときと違うと、<b>購入の権利がなくなります</b>。</li></ul>
    faq:
      - ["楽天ブックスの抽選に応募する条件は？", "住所を登録した楽天会員であることが条件で、1世帯1名までです。過去1年の購入実績が条件になった回もあるので、告知を確認してください。"]
      - ["当選はどうやって分かりますか？", "メールで知らされます。購入できる期間が決められているので、期限内に購入してください。"]
    sources:
      - ["ファミ通（楽天ブックスの抽選）", "https://www.famitsu.com/article/202608/85997"]
      - ["電撃オンライン", "https://dengekionline.com/article/202509/52132"]

  - slug: sevennet
    name: セブンネットショッピング
    store_re: "セブンネット|7net|セブン-?イレブン"
    short: セブンネットの抽選のやり方・応募の条件
    title: セブンネットショッピングの抽選のやり方｜ポケカ・ワンピースカードの応募条件（購入実績など）
    h1: セブンネットショッピングの抽選のやり方と、応募の条件
    desc: セブンネットショッピングのポケカ・ワンピースカード抽選の応募条件（購入実績・メルマガなど）と、当選の連絡についてまとめました。受付中の抽選の一覧つき。
    intro: セブンネットショッピングの抽選は、ふだんの購入実績などが条件になることが多いのが特徴です。
    sections:
      - h: 応募の条件
        html: <ul><li>決められた期間の<b>購入実績</b>が条件になることがあります（税抜1円以上、500円以上など、回によって違います）。</li><li><b>メールマガジンを受け取る設定</b>が条件になった回があります。</li></ul>
      - h: 当選の連絡
        html: <ul><li>連絡は<b>当選した人にだけ</b>来ます。連絡がなければ落選です。</li></ul>
    faq:
      - ["セブンネットの抽選に応募する条件は？", "決められた期間の購入実績や、メールマガジンの受け取りが条件になることがあります。回によって違うので告知を確認してください。"]
      - ["落選した時は連絡が来ますか？", "連絡は当選した人にだけ来ます。"]
    sources:
      - ["インサイド", "https://www.inside-games.jp/article/2026/07/04/184020.html"]
      - ["インサイド", "https://www.inside-games.jp/article/2023/06/18/146630.html"]

