  - slug: toysrus
    name: トイザらス
    game: pokemon
    store_re: "トイザらス|トイザラス"
    short: トイザらスの店頭QR抽選のやり方・応募の条件
    title: トイザらスのポケカ抽選のやり方｜店頭QRコードでの応募・会員と購入実績の条件・当選メール
    h1: トイザらスの抽選のやり方と、応募の条件
    desc: トイザらスのポケカ抽選について、店頭に掲示されたQRコードからの応募方法、条件（トイザらス会員・店舗での購入実績）、当選メールの届き方、店舗での受け取り期間と持ち物をまとめました。受付中の抽選の一覧つき。
    intro: トイザらスのポケカ抽選は、<b>お店に行ってQRコードを読み取って応募する</b>のが特徴です。会員登録と、<b>店舗での購入実績</b>が条件になります。
    sections:
      - h: 応募のしかたと条件
        html: <ul><li>対象店舗の<b>店頭に掲示されたQRコード</b>をスマホで読み取り、その場で申し込みます。ネット上のQRコードや営業時間外の読み取りは無効になることがあります。</li><li><b>トイザらスの会員（スターカード）</b>への登録が必要です。無料で登録できます。</li><li><b>店舗での購入実績</b>が条件です。30周年のカードセットでは、店舗で税込1,000円以上を買って通常ポイントを5ポイント以上ためていることが条件でした。オンラインストアでの購入は対象外です。</li><li>受付期間は<b>4日〜2週間ほど</b>だった回があります（例：9/5〜9/8、9/11〜9/27）。</li></ul>
      - h: 当選メールと受け取り
        html: <ul><li>結果は<b>メール</b>で届きます（例：9/24 12:00、10/14 12:00）。迷惑メールフォルダも確かめてください。</li><li>当選したら、応募のときに選んだ店舗で、<b>発売日からの数日間</b>に受け取ります（例：10/16〜10/18）。期限を過ぎると無効で、店舗の変更もできません。</li><li>受け取りのときは、<b>当選メール</b>と<b>トイザらスのポイントカード（カードかスマホ画面）</b>を見せます。</li><li>商品は<b>シュリンクを外した状態</b>で渡されることがあります。</li></ul>
    faq:
      - ["トイザらスのポケカ抽選はネットから応募できますか？", "できません。対象店舗の店頭に掲示されたQRコードを読み取って応募します。トイザらス会員の登録と、店舗での購入実績が条件です。"]
      - ["当選はどうやって分かりますか？", "メールで届きます。迷惑メールフォルダも確かめてください。受け取りには当選メールとポイントカードが必要です。"]
    sources:
      - ["トレカマップ（トイザらスの抽選）", "https://torecamap.co.jp/column/pokemon-toysrus-reservation/"]
      - ["GOAL（ポケカ抽選の店舗別まとめ）", "https://www.goal.com/jp/%E3%83%8B%E3%83%A5%E3%83%BC%E3%82%B9/pokemon-card-lottery-information-2025/blt39288119dc904d8e"]
      - ["スニーカーダンク（ポケカ抽選まとめ・9月）", "https://snkrdunk.com/articles/29945/"]

