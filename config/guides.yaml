  - slug: furuichi
    name: 古本市場・ふるいち
    store_re: "古本市場|ふるいち"
    short: 古本市場・ふるいちの抽選のやり方（ふるいちアプリ・公式通販・店頭受け取り）
    title: 古本市場（ふるいち）のポケカ・ワンピースカード抽選のやり方｜アプリ会員・当選発表・店頭受け取り
    h1: 古本市場・ふるいちの抽選のやり方と、結果の確かめ方
    desc: 古本市場（ふるいち）のポケカ・ワンピースカード抽選の応募方法（ふるいちアプリの会員・公式通販の抽選ページ）、当選発表の時間と確かめ方、店頭での受け取りまでをまとめました。受付中の抽選の一覧つき。
    intro: 古本市場（ふるいち）では、新弾のBOXが<b>ふるいちアプリの会員向けの抽選</b>になることがよくあります。全国の店舗で受け取る<b>公式通販の抽選</b>と、<b>店舗ごとの抽選</b>があります。
    sections:
      - h: 応募のしかた
        html: <ul><li>抽選の告知は<b>ふるいちアプリのお知らせ</b>に出て、案内にそって公式の応募ページから申し込みます。</li><li><b>ふるいちアプリの会員登録が必要</b>で、応募には<b>会員番号（カード番号）</b>を入力します。</li><li>受付期間は<b>6日〜10日ほど</b>だった回が多いですが、一部の店舗の抽選では<b>当日中に締切</b>の回もありました。</li><li>応募時に選んだ受け取り店舗は、あとから確認できなかった回があります。<b>応募画面のスクリーンショットを残しておく</b>と安心です。</li></ul>
      - h: 当選発表と確かめ方
        html: <ul><li>当選発表は<b>夜23時ごろ</b>で、締切の<b>3〜8日後</b>だった回があります（例：9/6締切→9/14発表、5/17締切→5/20発表）。</li><li>当選した人には<b>メール</b>が届き、<b>ふるいちアプリ</b>でも案内されます。<b>迷惑メールフォルダ</b>も確認してください。</li></ul>
      - h: 受け取りと購入
        html: <ul><li>受け取りは<b>店頭</b>です。当選メールのリンクから購入の手続きをして、決められた期間（発売日から<b>3〜5日ほど</b>だった回があります）に店舗で受け取ります。</li><li>受付期間を過ぎてからの応募や、受け取り期間を過ぎてからの購入はできません。</li></ul>
    faq:
      - ["古本市場（ふるいち）の抽選はどこから応募しますか？", "ふるいちアプリのお知らせに出る告知から、公式の応募ページで申し込みます。ふるいちアプリの会員登録と会員番号が必要です。店舗ごとの抽選は、各店舗の告知で方法を確認してください。"]
      - ["ふるいちの抽選の結果はいつわかりますか？", "これまでの抽選では、夜23時ごろに当選者へメールが届き、ふるいちアプリでも案内されました。締切から3〜8日後だった回があります。"]
      - ["当選したら、どこで受け取りますか？", "店頭での受け取りです。当選メールのリンクから購入手続きをして、決められた期間に店舗で受け取ります。"]
    sources:
      - ["トレカの地図（ふるいちの抽選方法）", "https://torecamap.co.jp/column/furuichi/"]
