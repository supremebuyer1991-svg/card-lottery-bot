  - name: 駿河屋
    slug: surugaya
    store_re: 駿河屋
    title: 駿河屋のポケカ・ワンピースカード抽選の応募方法｜X応募・当選DM・通販と店舗の受け取り方
    desc: 駿河屋のポケカなどの抽選販売について、通販の抽選（公式Xのフォローとリポスト・当選DM・マイページ登録・購入期間）と、各店舗がXで告知する店舗抽選の応募方法、注意点をまとめました。受付中の抽選の一覧つき。
    h1: 駿河屋の抽選の応募方法
    intro: 駿河屋の抽選販売には、<b>通販の抽選</b>と<b>店舗ごとの抽選</b>があります。どちらも<b>X（旧Twitter）</b>の告知が入り口で、通販の抽選は当選するとDMで連絡が来る形でした。
    short: 駿河屋の抽選の応募方法（Xで応募・当選DM・通販／店舗）
    sections:
    - h: 通販の抽選の応募のしかた
      html: <ul><li>公式Xの「<b>駿河屋通販トレカ情報【公式】</b>」（@surugaya_toreka）を<b>フォロー</b>して、対象の投稿を<b>リポスト（リツイート）</b>すると応募できた回があります。</li><li>受付期間は<b>1週間ほど</b>だった回があります（例：7/10 17:00〜7/17 7:59）。</li><li>期間中の応募はすべて抽選の対象で、<b>申し込みの早さは結果に関係しない</b>とされています。</li></ul>
    - h: 店舗の抽選の応募のしかた
      html: <ul><li>店舗の抽選は、<b>各店舗の公式X</b>に告知が出ます（例：高槻店・小山店・大宮マルイ店・マルイシティ横浜店）。</li><li>受付期間は<b>4日〜1週間ほど</b>、当選発表は<b>締め切りの次の日</b>だった回があります（例：11/19〜11/26受付→11/27発表）。</li><li>応募の方法、必要なもの、受け取りのルールは店舗によってちがいます。応募前に各店舗の告知を確認してください。</li></ul>
    - h: 当選の発表と購入（通販の抽選）
      html: <ul><li>当選した人には、Xの<b>DM（ダイレクトメッセージ）</b>で連絡が来ます。発表の期間内に連絡がなければ<b>落選</b>です。</li><li>当選して買うには、駿河屋の<b>マイページ登録（会員登録）</b>が必要でした。</li><li>購入できる期間は<b>9日間ほど</b>で、過ぎると<b>キャンセル</b>になった回があります（例：7/17〜7/26 14:59）。</li><li>手数料は、住んでいる地域や支払い方法によって変わります。</li></ul>
    - h: 注意すること
      html: <ul><li>応募は<b>1人1回</b>、買えるのは<b>1人1BOXまで</b>だった回があります。</li><li>DMで連絡が来るので、<b>DMを受け取れる設定</b>にして、通知を見のがさないようにしましょう。</li><li>駿河屋の公式アカウントは、通販用と店舗用で別です。どのアカウントの抽選かを確かめてから応募してください。</li></ul>
    faq:
    - - 駿河屋の抽選はどこから応募しますか？
      - 通販の抽選は、公式X「駿河屋通販トレカ情報【公式】」をフォローして対象の投稿をリポストする形だった回があります。店舗の抽選は、各店舗の公式Xの告知から応募します。
    - - 当選はどうやってわかりますか？
      - 通販の抽選は、当選した人にXのDMで連絡が来ます。発表の期間内に連絡がなければ落選です。
    - - 当選したあと、いつまでに買えばいいですか？
      - 通販の抽選は、購入期間が9日間ほどで、過ぎるとキャンセルになった回があります。当選の連絡に書かれた期限を確かめて、早めに購入してください。
    sources:
    - - インサイド（駿河屋のポケカ抽選・2023年7月）
      - https://www.inside-games.jp/article/2023/07/11/147131.html
    - - スニーカーダンク（ポケカ抽選まとめ）
      - https://snkrdunk.com/articles/30468/

  # 11/14 初心者向けのやり方ガイド（kind: howto。お店ではないので store_re は何にも当たらない形。下の一覧は filter で選ぶ）
  - slug: howto-apply
    kind: howto
    filter: ''
    list_label: トレカの抽選
    name: 抽選の応募のしかた
    store_re: (?!x)x
    short: トレカ抽選の応募のしかた（はじめての人向け・5つの手順）
    title: トレカ抽選の応募のしかた｜ポケカ・ワンピースカードの抽選販売を初めての人向けに5つの手順で解説
    h1: トレカ（ポケカ・ワンピースカード）抽選の応募のしかた
    desc: ポケカ・ワンピースカードの抽選販売に初めて応募する人向けのガイド。抽選を探す、条件を確かめる、応募する、当選発表を見る、購入・受け取りまでの5つの手順と、無効にならないための注意点をまとめました。受付中の抽選の一覧つき。
    intro: 人気のポケカ・ワンピースカードは、発売日にお店に並ばず、<b>抽選で当たった人だけが買える</b>形で売られることが多くなっています。このページでは、初めての人が迷わないように、抽選を探すところから商品を受け取るところまでを順番に説明します。こまかい決まりはお店ごとにちがうので、最後は必ずそのお店の告知を読んでください。
    sections:
    - h: まず知っておきたい、抽選販売の流れ
      html: <ul><li><b>手順1</b>：受付中の抽選を探す</li><li><b>手順2</b>：応募の条件と、受け取り方を確かめる</li><li><b>手順3</b>：締切までに応募する</li><li><b>手順4</b>：当選発表を確かめる</li><li><b>手順5</b>：期限までに購入する・受け取る</li></ul><p>抽選は<b>先着順ではありません</b>。受付期間のあいだなら、早く応募しても遅く応募しても当たりやすさは同じだと案内しているお店があります。あわてずに、条件を読んでから応募しましょう。</p>
    - h: 手順1：受付中の抽選を探す
      html: <ul><li>抽選の告知は、お店の<b>公式サイト・公式アプリ・公式X</b>に出ます。</li><li>トレカ抽選ナビでは、これまでに<b>1,087店・2,358件</b>の抽選を掲載してきました（2026年11月13日時点の集計）。下の一覧から、いま受付中の抽選をまとめて見られます。</li><li>気になる抽選を見つけたら、必ず<b>お店の告知ページそのもの</b>を開いて読んでください。条件や日時が変わることがあります。</li></ul>
    - h: 手順2：応募の条件と受け取り方を確かめる
      html: <ul><li><b>受け取り方</b>：トレカ抽選ナビの集計では、受付中の抽選のうち<b>店頭受け取りが89%</b>、ネット（発送）が11%です。店頭受け取りの抽選は、<b>自分でそのお店に行ける場合だけ</b>応募しましょう。</li><li><b>会員登録・本人確認</b>：会員登録がいらない抽選は45%、本人確認がいらない抽選は40%です。つまり半分以上の抽選で、会員登録や本人確認書類が必要になります。</li><li><b>回数</b>：「お一人様1回まで」の抽選が多く、同じ人が重ねて応募すると、すべて無効になるお店があります。</li><li><b>購入できる期間</b>：当選したあとに買える日が決まっています。その日に行けるか、支払えるかを先に確かめます。</li></ul><p>条件は抽選ごとにちがうので、応募前に必ず告知を確認してください。</p>
    - h: 手順3：締切までに応募する
      html: <ul><li>応募の方法は、お店の<b>Webサイトの応募フォーム</b>、<b>公式アプリ</b>、<b>LivePocketなどの抽選サービス</b>、<b>店頭</b>、<b>公式X</b>などがあります。</li><li>名前・住所・電話番号は、<b>本人確認書類と同じ書き方</b>で正しく入れます。記号を入れた名前や、ほかの人の名義での応募を無効にするお店があります。</li><li>応募が終わったら、<b>受付完了の画面やメール</b>を確かめます。会員登録をしただけでは応募になっていないことがあります。</li><li>トレカ抽選ナビの集計では、締切は<b>日曜が42%</b>、時間は<b>21〜23時台が80%</b>です。週末の夜にまとめて締め切られることが多いので、早めにすませておくと安心です。</li></ul>
    - h: 手順4：当選発表を確かめる
      html: <ul><li>結果の知らせ方は、<b>メール</b>、<b>マイページ・アプリの履歴</b>、<b>店頭や公式Xでの番号発表</b>などです。</li><li><b>当選した人にしか連絡しない</b>お店もあります。発表の日を過ぎたら、自分でマイページやメールを確かめましょう。</li><li>トレカ抽選ナビの集計では、締切から当選発表までは、お店によって<b>だいたい3〜7日</b>です。</li><li>メールが<b>迷惑メールフォルダ</b>に入っていないかも確かめます。</li></ul>
    - h: 手順5：期限までに購入する・受け取る
      html: <ul><li>当選しただけでは、まだ買えていません。<b>決められた期限までに</b>、注文の手続きや店頭での購入をします。</li><li>期限を過ぎると、当選は無効になります。</li><li>店頭では、<b>当選の画面（QRコードなど）と本人確認書類</b>を見せるお店が多いです。</li><li>くわしくは「当選したあとの購入・受け取りのしかた」のガイドで説明しています。</li></ul>
    faq:
    - - トレカの抽選は、早く応募したほうが当たりやすいですか？
      - 抽選は先着順ではなく、受付期間のあいだならいつ応募しても当たりやすさは同じだと案内しているお店があります。あわてずに、条件を読んでから締切までに応募してください。
    - - 応募にお金はかかりますか？
      - 応募にお金がかかるかどうかは抽選ごとにちがいます。お金を払うのは、当選して商品を買うときです。手数料や送料がかかるかどうかは抽選ごとにちがうので、応募前に必ず告知を確認してください。
    - - いくつものお店の抽選に応募してもいいですか？
      - ちがうお店の抽選にそれぞれ応募することはできます。ただし、同じ抽選に同じ人が重ねて応募すると、すべて無効になるお店があります。また、当選したら期限までに買いに行ける抽選だけに応募しましょう。
    - - 当選発表はいつごろですか？
      - トレカ抽選ナビの集計では、締切から当選発表まではお店によってだいたい3〜7日です。発表の日時は告知に書かれているので、応募したときにメモしておくと安心です。
    sources:
    - - ポケモンセンターオンライン ご利用ガイド「抽選販売について」
      - https://www.pokemoncenter-online.com/guide/guide-lottery.html
    - - LivePocketの使い方（公式ヘルプ）
      - https://livepocket.jp/help/about
    - - TSUTAYA鳥栖店の抽選販売の告知（LivePocket）
      - https://livepocket.jp/e/yfp7d
    - - トレカ抽選ナビの集計
      - https://tcg-chusen.com/stats/
  - slug: livepocket
    kind: howto
    filter: livepocket
    list_label: LivePocketで応募するトレカの抽選
    name: LivePocket
    store_re: (?!x)x
    short: LivePocket（ライヴポケット）でのトレカ抽選の応募のしかた
    title: LivePocket（ライヴポケット）のトレカ抽選のやり方｜会員登録・応募・当選の確認・QRチケット・店頭受け取り
    h1: LivePocket（ライヴポケット）でのトレカ抽選の応募のしかた
    desc: カードショップのポケカ・ワンピースカード抽選でよく使われるLivePocket（ライヴポケット）の使い方。会員登録と電話番号の認証、応募の手順、当選の確かめ方、QRコードのチケットの出し方、店頭での受け取りまでを順番にまとめました。
    intro: <b>LivePocket（ライヴポケット）</b>は、もともとライブやイベントのチケットを売るサービスです。カードショップがこのしくみを使って、ポケカ・ワンピースカードの<b>「買う権利」の抽選</b>を行うことがよくあります。応募から受け取りまでスマホ1台でできますが、最初の登録に少し時間がかかるので、締切の前に準備しておきましょう。
    sections:
    - h: 応募の前にすること（会員登録と電話番号の認証）
      html: <ul><li><b>手順1</b>：LivePocketの新規会員登録の画面で、名前・メールアドレスなどを入力します。</li><li><b>手順2</b>：入力したアドレスに確認のメールが届きます。メールの中のURLを開くと、登録が終わります。「@livepocket.jp」からのメールを受け取れるようにしておきます。届かないときは迷惑メールフォルダも見てください。</li><li><b>手順3</b>：<b>携帯電話番号の認証</b>をします。SMSで届く4けたの番号を入力する方法と、電話をかけて認証する方法があります。</li></ul><p>電話番号の認証は<b>1つのアカウントに1つの番号</b>で、同じ番号をほかのアカウントでは使えません。認証は終わってから<b>1年間</b>有効です。名前や住所は、<b>本人確認書類と同じ書き方</b>で登録しておきましょう。</p>
    - h: 応募のしかた
      html: <ul><li><b>手順1</b>：お店の告知（公式Xなど）にあるリンクから、その抽選のページを開きます。</li><li><b>手順2</b>：「申込む」のボタンを押します。こみ合っているときは、順番待ちの画面が出ることがあります。</li><li><b>手順3</b>：ほしい商品（チケット）と数を選んで、次へ進みます。お店からの質問があれば答えます。</li><li><b>手順4</b>：注意事項を読み、同意してから申込みを確定します。</li><li><b>手順5</b>：「<b>申込状況・履歴</b>」のページで、申込みができているかを確かめます。</li></ul><p>トレカの抽選では、応募のときは無料で、<b>当選してからお店で代金を払う</b>形が多いです。支払い方法は抽選ごとにちがうので、応募前に必ず告知を確認してください。</p>
    - h: 応募の内容を変えたい・取り消したいとき
      html: <ul><li>申込みの<b>締切の日まで</b>なら、取り消しができます。</li><li>「申込状況・履歴」でその申込みを選び、「申し込みを取消す」を押して、パスワードを入力します。</li><li>内容を変えたいときは、いちど取り消してから、もう一度申込みます。</li><li><b>締切を過ぎると、変更も取り消しもできません。</b></li></ul>
    - h: 当選の確かめ方
      html: <ul><li>結果は、LivePocketの「<b>申込状況・履歴</b>」で確かめられます。</li><li>メールで結果を知らせるお店もあります。ただ、メールが届かないこともあるので、発表の日になったら自分で「申込状況・履歴」を開くのが確実です。</li><li>発表の日時は、抽選のページに書かれています。トレカ抽選ナビの集計では、締切から発表まではお店によってだいたい3〜7日です。</li><li>当選発表のあとに登録した名前や住所を書きかえると、買えなくなるお店があります。</li></ul>
    - h: 当選チケット（QRコード）の出し方
      html: <ul><li><b>手順1</b>：LivePocketにログインして、「<b>マイチケット</b>」を開きます。</li><li><b>手順2</b>：当選した抽選の「<b>チケットを表示</b>」を押します。</li><li><b>手順3</b>：<b>QRコード</b>が出るので、お店でこの画面を見せます。</li></ul><p>お店に行く前に、自分のスマホでQRコードが出せるかを一度ためしておきましょう。スクリーンショットや印刷したものは使えないとするお店があります。QRコードは<b>1回しか使えない</b>、なくしても出し直しはしない、と案内しているお店もあります。</p>
    - h: 店頭での受け取り
      html: <ul><li>告知に書かれた<b>期間のうちに</b>、応募のときに選んだお店へ行きます。期限を過ぎると無効です。</li><li><b>当選チケットのQRコード</b>と<b>本人確認書類</b>を見せて、レジで代金を払います。</li><li><b>当選した本人だけ</b>が買えます。家族や友だちが代わりに行くことや、チケットをゆずることを認めていないお店が多いです。</li><li>持ち物や支払い方法は抽選ごとにちがうので、応募前に必ず告知を確認してください。</li></ul>
    faq:
    - - LivePocketの会員登録にお金はかかりますか？
      - 会員登録は無料です。登録にはメールアドレスの確認が必要で、チケットの申込みや受け取りには携帯電話番号の認証も必要です。
    - - 当選したかどうかは、どこで分かりますか？
      - LivePocketの「申込状況・履歴」で確かめられます。メールで知らせるお店もありますが、発表の日になったら自分で「申込状況・履歴」を開いて確かめるのが確実です。
    - - 応募を取り消すことはできますか？
      - 申込みの締切の日までなら、「申込状況・履歴」から取り消せます。締切を過ぎると、変更も取り消しもできません。
    - - SMSが届かなくて、電話番号の認証ができません。
      - LivePocketのヘルプでは、Wi-Fiを切ってモバイル通信にする、SMSのかわりに電話をかける方法で認証する、といった方法が案内されています。同じ電話番号は1つのアカウントでしか使えません。
    sources:
    - - LivePocketの使い方（公式ヘルプ）
      - https://livepocket.jp/help/about
    - - LivePocket FAQ「抽選申込内容の変更をしたい／抽選申込をキャンセルしたい」
      - https://faq.livepocket.jp/livepocket-ticket-user/detail?site=49XFKFIO&category=6&id=502
    - - TSUTAYA鳥栖店の抽選販売の告知（LivePocket）
      - https://livepocket.jp/e/yfp7d
  - slug: id-check
    kind: howto
    filter: no_id
    list_label: 本人確認なしで応募できる抽選
    name: 本人確認・会員登録
    store_re: (?!x)x
    short: 本人確認・会員登録・購入履歴がいる抽選とは（用意するもの）
    title: トレカ抽選の本人確認・会員登録・購入履歴とは｜用意するものと、本人確認なしで応募できる抽選の探し方
    h1: 本人確認・会員登録・購入履歴がいる抽選とは
    desc: ポケカ・ワンピースカードの抽選で求められる「本人確認」「会員登録」「購入履歴」の意味と、用意するものをやさしく説明します。本人確認書類の例、電話番号の認証、応募が無効になる例、本人確認なしで応募できる抽選の探し方もまとめました。
    intro: トレカの抽選には、「会員の人だけ」「本人確認書類がいる」「これまでに買い物をした人だけ」といった条件がつくことがあります。これは、<b>1人で何回も応募すること</b>や<b>転売目的の応募</b>を防いで、ほしい人に行きわたるようにするためです。何を用意すればよいかを、種類ごとに説明します。
    sections:
    - h: 抽選の条件は、大きく分けて3つ
      html: <ul><li><b>会員登録</b>：お店のサイト・アプリ・抽選サービスの会員になること。</li><li><b>本人確認</b>：応募した人と、買いに来た人が同じかを確かめること。店頭で書類を見せる形と、応募の前に電話番号などで認証する形があります。</li><li><b>購入履歴</b>：そのお店で、決められた期間に買い物をしたことがあること。</li></ul><p>トレカ抽選ナビの集計（2026年11月13日時点）では、受付中の抽選のうち、<b>本人確認がいらない抽選は40%</b>、<b>会員登録がいらない抽選は45%</b>です。半分以上の抽選で、なにかの準備が必要になります。</p>
    - h: 会員登録がいる抽選
      html: <ul><li><b>ポケモンセンターオンライン</b>の抽選は、会員登録（無料）が必要です。一部の抽選では<b>電話番号の認証</b>も必要で、まだの人は応募の前にすませます。</li><li><b>LivePocket</b>を使うお店の抽選は、LivePocketの会員登録と携帯電話番号の認証が必要です。</li><li>お店の<b>公式アプリ</b>や<b>ポイントカード</b>の会員であることが条件の抽選もあります。</li></ul><p>会員登録や認証は、メールが届かないなどで時間がかかることがあります。<b>締切の当日ではなく、前の日までに</b>すませておきましょう。</p>
    - h: 本人確認がいる抽選と、用意するもの
      html: <ul><li>店頭で受け取る抽選では、<b>当選の画面と本人確認書類</b>を見せて、応募した本人かどうかを確かめるお店が多いです。</li><li>本人確認書類の例：<b>運転免許証、マイナンバーカード、健康保険証（資格確認書）、在留カード、学生証、パスポート</b>など。どれが使えるかはお店によってちがいます。</li><li><b>名前・生年月日・住所</b>がのっている書類を求めるお店や、<b>顔写真つき</b>の書類だけを認めるお店があります。</li><li>応募のときの名前・住所は、<b>書類と同じ書き方</b>で入れます。ちがっていると買えないことがあります。</li><li>学生証しか持っていない人、住所が変わったばかりの人は、使える書類を先に確かめておくと安心です。</li></ul><p>使える書類は抽選ごとにちがうので、応募前に必ず告知を確認してください。</p>
    - h: 購入履歴がいる抽選
      html: <ul><li>「この期間に、このお店で買い物をした会員だけ」という条件がつく抽選があります。</li><li>「条件に合う会員にだけ、案内のメールが届く」という形のお店もあります（Joshin webショップなど）。この場合、<b>メールマガジンを受け取る設定</b>にしておくことが必要です。</li><li>購入履歴は、あとから急いで作れないことがあります。条件に合わない抽選は見送って、ほかの抽選を探しましょう。</li></ul>
    - h: 応募が無効になる例
      html: <ul><li>同じ人が<b>2回以上</b>応募した（すべて無効になるお店があります）</li><li><b>家族や友だちの名前を借りて</b>応募した</li><li>名前に記号を入れた、住所や電話番号がまちがっている</li><li>当選発表のあとに、登録した名前や住所を書きかえた</li><li>転売が目的だとお店に判断された</li></ul><p>当選の権利を人にゆずることも、禁止しているお店があります。自分が使う分だけ、自分の名前で1回応募するのが基本です。</p>
    - h: 本人確認なしで応募できる抽選の探し方
      html: <ul><li>このページの下に、<b>本人確認なしで応募できる受付中の抽選</b>をまとめています。</li><li>「本人確認なし」は、<b>告知に本人確認の説明がない</b>という意味です。受け取りのときに確認されることもあるので、応募前に必ず告知を確認してください。</li><li>本人確認がなくても、<b>1人1回まで</b>などの決まりはあります。</li><li>ネット（発送）の抽選は、店頭で書類を見せることはありませんが、会員登録と、登録した住所への発送が条件になることが多いです。</li></ul>
    faq:
    - - 本人確認書類は、何を持っていけばいいですか？
      - 運転免許証・マイナンバーカード・健康保険証・在留カードなどを例にあげるお店が多いです。顔写真つきの書類だけを認めるお店もあります。使える書類は抽選ごとにちがうので、応募前に必ず告知を確認してください。
    - - 家族の名前で応募してもいいですか？
      - 家族本人が自分で応募して、自分で買いに行くなら問題ありません。ほかの人の名前を借りて応募することや、代わりに受け取りに行くことは、無効にするお店が多いです。
    - - 購入履歴がないと、抽選に応募できませんか？
      - 購入履歴が条件の抽選には応募できませんが、条件のない抽選もたくさんあります。トレカ抽選ナビの集計では、受付中の抽選の40%は本人確認がいらず、45%は会員登録もいりません。
    - - 未成年でも応募できますか？
      - お店によってちがいます。年齢の決まりや、保護者の同意が必要かどうかは、応募前に必ず告知を確認してください。学生証が本人確認書類として使えるかどうかも、お店ごとに決まっています。
    sources:
    - - ポケモンセンターオンライン 抽選応募方法紹介
      - https://www.pokemoncenter-online.com/lottery/landing-page.html
    - - LivePocketの使い方（公式ヘルプ）
      - https://livepocket.jp/help/about
    - - Joshin webショップ 抽選販売について
      - https://joshinweb.jp/toy/c_chusen.html
    - - TSUTAYA鳥栖店の抽選販売の告知（LivePocket）
      - https://livepocket.jp/e/yfp7d
  - slug: after-win
    kind: howto
    filter: store
    list_label: 店頭で受け取る抽選
    name: 当選後の購入・受け取り
    store_re: (?!x)x
    short: 抽選に当選したあとの購入・受け取りのしかた
    title: トレカ抽選に当選したら｜購入・受け取りのしかた（店頭受け取り・発送・支払い・期限・キャンセル）
    h1: 抽選に当選したあとの購入・受け取りのしかた
    desc: ポケカ・ワンピースカードの抽選に当選したあと、何をすればよいかをまとめました。店頭受け取りと発送の手順、持ち物、支払い方法、購入の期限、箱を開けて渡される場合、買えなくなったときの考え方まで、初めての人向けに説明します。
    intro: 抽選は、<b>当選しただけではまだ買えていません</b>。決められた期限までに、お店で買うか、ネットで注文の手続きをする必要があります。期限が短いこともあるので、当選が分かったらすぐに、このページの順番で確かめてください。
    sections:
    - h: 当選が分かったら、最初に確かめること
      html: <ul><li><b>いつからいつまで</b>買えるか（購入・受け取りの期間）</li><li><b>どこで</b>買うか（応募のときに選んだお店か、ネットの注文ページか）</li><li><b>何を持っていくか</b>（当選の画面、本人確認書類、会員証など）</li><li><b>どうやって払うか</b>（現金が使えるか、クレジットカードだけか）</li></ul><p>当選のメールや画面は、消さずに残しておきます。当選発表のあとに登録した名前や住所を書きかえると、買えなくなるお店があるので、そのままにしておきましょう。</p>
    - h: 店頭で受け取る場合の手順
      html: <ul><li><b>手順1</b>：購入できる期間と、お店の営業時間を確かめます。</li><li><b>手順2</b>：持ち物をそろえます。<b>当選の画面（QRコードやアプリの当選画面）</b>と<b>本人確認書類</b>が基本です。</li><li><b>手順3</b>：応募のときに選んだお店に、<b>当選した本人が</b>行きます。</li><li><b>手順4</b>：レジや受付で、当選の画面と本人確認書類を見せます。</li><li><b>手順5</b>：代金を払って、商品を受け取ります。</li></ul><p>トレカ抽選ナビの集計では、受付中の抽選の<b>89%が店頭受け取り</b>です。当選の画面は、スクリーンショットや印刷ではなく、<b>その場で自分のスマホに出す</b>ことを求めるお店があります。電池切れや通信の不調にそなえて、お店に入る前に画面を開いておくと安心です。</p>
    - h: ネット（発送）の場合の手順
      html: <ul><li><b>手順1</b>：当選のメールか、マイページの抽選の履歴を開きます。</li><li><b>手順2</b>：そこにある専用のリンクから、商品の<b>注文の手続き</b>をします。</li><li><b>手順3</b>：支払い方法と届け先を確かめて、注文を確定します。</li><li><b>手順4</b>：注文完了のメールが届いたか確かめます。</li></ul><p>ポケモンセンターオンラインでは、結果は当選・落選にかかわらずメールで届き、マイページの「抽選申込み履歴」でも確かめられます。<b>期限内に注文の手続きをしないと、当選は無効</b>になります。届け先を、会員として登録した住所だけに限るお店もあります。</p>
    - h: 支払いと期限
      html: <ul><li>購入できる期間は、<b>数日だけ</b>のことが多く、過ぎると無効になります。延ばしてもらうことは、ふつうできません。</li><li>店頭では、ほかの商品と同じようにレジで払うお店が多いですが、<b>支払い方法を限る</b>抽選もあります。</li><li>ネットの抽選では、<b>クレジットカードだけ</b>などの決まりがあることがあります。</li><li>LivePocketで代金を先に払う形の抽選では、クレジットカードを選ぶと<b>当選したときに自動で支払い</b>になります。コンビニ払いなどは、期日までに払わないと申込みが取り消されます。</li></ul><p>期限と支払い方法は抽選ごとにちがうので、応募前に必ず告知を確認してください。</p>
    - h: 箱を開けて渡される場合
      html: <ul><li>転売を防ぐために、BOXの外のフィルム（シュリンク）を<b>お店の人が外してから渡す</b>お店があります。</li><li>外箱を回収して、中のパックだけを渡す形のお店もあります。</li><li>中のカードやパックの数は変わりません。自分で開けて遊ぶ人には、こまることはありません。</li><li>開けて渡すかどうかは、告知の注意書きに書かれています。未開封のまま持ち帰りたい人は、応募の前に確かめておきましょう。</li></ul>
    - h: 行けなくなった・買えなくなったとき
      html: <ul><li>期限までに買わなければ、当選は無効になります。<b>代わりの人が受け取ること</b>や、<b>当選の権利を人にゆずること</b>は、認めていないお店があります。</li><li>行けないと分かったときにどうすればよいかは、お店ごとにちがいます。告知の注意書きを読み、書かれていなければお店に問い合わせましょう。</li><li>応募を取り消せるのは、<b>受付期間のあいだだけ</b>というサービスが多いです（LivePocket、ポケモンセンターオンラインなど）。</li><li>Amazonの招待販売では、注文をキャンセルすると、もう一度注文することはできません。</li></ul><p>買ったあとの転売を禁止しているお店があります。自分で遊ぶ分・集める分として買いましょう。</p>
    faq:
    - - 当選したら、いつまでに買えばいいですか？
      - 購入できる期間は抽選ごとに決まっていて、数日だけのこともあります。期限を過ぎると当選は無効になるので、当選が分かったらすぐに期間を確かめてください。
    - - 当選した本人のかわりに、家族が受け取りに行けますか？
      - 当選した本人だけが買える、としているお店が多いです。店頭で、当選の画面と本人確認書類を照らし合わせて確かめます。本人が期間内に行ける抽選だけに応募しましょう。
    - - 当選したのに、買うのをやめることはできますか？
      - 期限までに買わなければ、当選は無効になります。買わなかったときのあつかいはお店ごとにちがうので、告知を確認してください。応募の取り消しは、受付期間のあいだにしておくのが安全です。
    - - BOXを開けて渡されるのはなぜですか？
      - 転売を防いで、遊ぶ人・集める人に商品を届けるためです。外のフィルムを外すだけで、中のパックやカードはそのままです。開けて渡すかどうかは抽選ごとにちがうので、応募前に必ず告知を確認してください。
    sources:
    - - ポケモンセンターオンライン ご利用ガイド「抽選販売について」
      - https://www.pokemoncenter-online.com/guide/guide-lottery.html
    - - LivePocketの使い方（公式ヘルプ）
      - https://livepocket.jp/help/about
    - - TSUTAYA鳥栖店の抽選販売の告知（LivePocket）
      - https://livepocket.jp/e/yfp7d
    - - Joshin webショップ 抽選販売について
      - https://joshinweb.jp/toy/c_chusen.html
  - slug: lottery-invite-firstcome
    kind: howto
    filter: online
    list_label: ネットの抽選（発送）
    name: 抽選・先着・招待・予約のちがい
    store_re: (?!x)x
    short: 抽選販売・先着販売・招待販売・予約のちがいとコツ
    title: 抽選販売・先着販売・招待販売・予約のちがい｜ポケカ・ワンピースカードの買い方4種類とそれぞれのコツ
    h1: 抽選販売・先着販売・招待販売・予約のちがいと、それぞれのコツ
    desc: ポケカ・ワンピースカードの売り方には、抽選販売・先着販売・招待販売（Amazonの招待リクエストなど）・予約の4種類があります。それぞれのしくみと向いている人、応募や購入のときに気をつけることを、初めての人向けにやさしくまとめました。
    intro: 人気のトレカは、お店によって売り方がちがいます。同じ商品でも、あるお店は<b>抽選</b>、別のお店は<b>先着</b>、Amazonは<b>招待</b>、ということがあります。しくみを知っておくと、自分に合った買い方を選びやすくなります。
    sections:
    - h: 4つの売り方を、ひとことで言うと
      html: <ul><li><b>抽選販売</b>：受付期間に応募して、<b>当たった人だけ</b>が買える。早い・遅いは関係ない。</li><li><b>先着販売</b>：売り出した時間から、<b>早く買った人の順</b>に売り切れるまで。</li><li><b>招待販売</b>：先に「買いたい」と申し込んでおき、<b>お店から招待された人だけ</b>が買える。</li><li><b>予約</b>：発売の前に注文しておき、<b>発売日に受け取る・届く</b>。人気の商品では、予約そのものが抽選や先着になる。</li></ul><p>どの売り方になるかは、お店と商品ごとにちがうので、必ず告知を確認してください。</p>
    - h: 抽選販売のしくみとコツ
      html: <ul><li>受付期間のあいだに応募し、締切のあとでお店が当選者を決めます。</li><li><b>先着順ではない</b>ので、開始すぐに急ぐ必要はありません。条件を読んでから応募できます。</li><li>トレカ抽選ナビの集計では、締切は<b>日曜が42%</b>、<b>21〜23時台が80%</b>です。週末の夜に締切が重なるので、平日のうちに応募しておくと忘れにくくなります。</li><li>受付中の抽選のうち、店頭受け取りが89%、ネット（発送）が11%です。近くにお店がない人は、下の「ネットの抽選（発送）」の一覧が役に立ちます。</li><li>コツは、<b>正しい情報で1人1回応募すること</b>と、<b>発表の日と購入の期限を忘れないこと</b>の2つです。</li></ul>
    - h: 先着販売のしくみとコツ
      html: <ul><li>売り出しの時間になったら、買えた人から順に売れていき、なくなったら終わりです。</li><li>ネットの先着販売は、アクセスが集まって、つながりにくくなることがあります。</li><li>前もって<b>会員登録・ログイン・住所と支払い方法の登録</b>をすませておくと、手続きが短くなります。</li><li>店頭の先着販売は、並び方や整理券の決まりがお店ごとにあります。お店の人の案内に従いましょう。</li><li>「かならず買える方法」はありません。買えなかったときのために、抽選や招待にも申し込んでおくのが現実的です。</li></ul>
    - h: 招待販売（Amazonの招待リクエストなど）のしくみとコツ
      html: <ul><li><b>手順1</b>：対象の商品ページで、招待のリクエストのボタンを押します。対象は、Amazon.co.jpが販売・発送する商品です。</li><li><b>手順2</b>：リクエストは<b>3か月</b>有効です。そのあいだ、入荷に合わせて少しずつ招待が送られます。</li><li><b>手順3</b>：招待されると、メールとAmazonのメッセージセンターに知らせが届きます。</li><li><b>手順4</b>：知らせに書かれた<b>期限までに</b>購入します。期限は短いので、早めに手続きします。</li></ul><p>リクエストした全員が招待されるわけではありません。招待されても、ほかの制限で買えないことがあります。注文をキャンセルすると、もう一度注文することはできません。メールが届かない設定になっていないか、ときどきメッセージセンターを見ておきましょう。</p>
    - h: 予約のしくみとコツ
      html: <ul><li>発売日より前に注文を受け付けて、発売日（またはそのあと）に受け取る・届く売り方です。</li><li>人気のBOXでは、ふつうの予約ではなく、<b>「予約の権利」の抽選</b>や<b>先着の予約</b>になることが多いです。</li><li>予約できても、<b>受け取りの期限</b>や<b>支払いの期限</b>があります。過ぎると取り消されることがあります。</li><li>キャンセルできるかどうかは、お店ごとにちがいます。必ず告知を確認してください。</li></ul>
    - h: 自分に合った買い方の選び方
      html: <ul><li><b>近くにお店がある人</b>：店頭受け取りの抽選が中心になります。数がいちばん多い売り方です。</li><li><b>近くにお店がない人</b>：ネット（発送）の抽選と、Amazonなどの招待販売を組み合わせます。</li><li><b>決まった時間にスマホを見られない人</b>：先着より、期間の長い抽選や招待が向いています。</li><li>どの売り方でも、<b>自分の名前で、決まりを守って申し込む</b>ことが大切です。同じ人が重ねて申し込むと、無効になることがあります。</li></ul>
    faq:
    - - 抽選販売と先着販売は、何がちがいますか？
      - 抽選販売は、受付期間に応募した人の中から当選者が選ばれます。早く応募しても有利にはなりません。先着販売は、売り出しの時間から早く買った人の順に売れて、なくなったら終わりです。
    - - Amazonの招待リクエストは抽選ですか？
      - 商品ページでリクエストをしておき、Amazonから招待された人だけが買えるしくみです。招待は入荷に合わせて送られ、リクエストした全員が招待されるとはかぎりません。
    - - 抽選と招待リクエストの両方に申し込んでもいいですか？
      - ちがうお店の抽選や招待に、それぞれ申し込むことはできます。両方で買えることになった場合は、どちらも期限までに購入が必要です。自分が買える分だけ申し込みましょう。
    - - 近くにお店がなくても、買えますか？
      - ネットで応募して商品を送ってもらえる抽選や、Amazonなどの招待販売があります。トレカ抽選ナビの集計では、受付中の抽選の11%がネット（発送）です。下の一覧から探せます。
