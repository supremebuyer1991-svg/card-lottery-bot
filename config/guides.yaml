        html: <ul><li>当選発表は締切の<b>1〜2日後</b>だった回があります（例：11/15締切→11/16〜17発表）。</li><li>購入は<b>選んだ店舗で、当選した本人だけ</b>です。決められた期間（発売日から3日ほどだった回があります）に来店し、<b>LivePocketの当選チケットのQRコード</b>と<b>身分証明書</b>を見せて、店頭で代金を払います。</li><li>郵送はできません。期間内に来店できないと購入できません。</li></ul>
    faq:
      - ["トレカステーションの抽選はどこから応募しますか？", "LivePocketの抽選ページから、店舗を1つ選んで応募します。LivePocketの会員登録が必要です。店舗ごとに公式Xで告知する抽選もあります。"]
      - ["当選したら何を持っていけばいいですか？", "LivePocketの当選チケットのQRコードと、本人確認のための身分証明書です。選んだ店舗で、決められた期間に購入します。"]
      - ["結果はいつわかりますか？", "締切の1〜2日後に発表だった回があります。抽選ごとの告知を確認してください。"]
