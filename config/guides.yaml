  - slug: geo
    name: ゲオ
    game: pokemon
    store_re: "ゲオ|GEO"
    short: ゲオの抽選のやり方・応募の条件（Ponta連携）
    title: ゲオのポケカ抽選のやり方｜応募条件（ゲオアプリ・Pontaカード）・当選メール・店舗での購入と本人確認
    h1: ゲオ（ゲオアプリ・抽選専用サイト）の抽選のやり方と、応募の条件
    desc: ゲオのポケカ抽選の応募条件（店舗レンタル会員機能つきPontaカードとGEO IDの連携）、応募方法、当選メールの届き方、店舗での購入に必要なもの（本人確認書類・会員証）、転売禁止のルールをまとめました。受付中の抽選の一覧つき。
    intro: ゲオのポケカ抽選は、<b>ゲオアプリ（抽選専用サイト）</b>から応募して、当選したら店舗で買う形です。<b>Pontaカードとの連携</b>や、購入のときの<b>本人確認</b>など、条件がはっきり決まっています。
    sections:
      - h: 応募の条件と応募のしかた
        html: <ul><li>応募は、<b>ゲオの抽選専用サイト（ゲオアプリ）</b>からだけできます。</li><li><b>店舗レンタル会員機能つきのPontaカード</b>を持っていて、<b>GEO IDとPonta会員IDを連携</b>していることが条件です。レンタル機能は店頭で追加できます。</li><li><b>1人1回</b>（商品ごとに1回）までです。1BOX単位の抽選では、パック単位や複数BOXの応募はできません。</li><li>受付期間は<b>3〜4日ほど</b>の回が多いです（例：9/28 11:00〜10/1 17:59）。締切が<b>17:59</b>の回が多いです。</li></ul>
      - h: 当選メールと購入
        html: <ul><li>結果は、応募のときに登録した<b>メールアドレス</b>に届きます。当選メールが来なければ落選です（例：10/1締切→10/14連絡）。</li><li>当選したら、指定した店舗で<b>2〜3日の購入期間</b>内に購入します（例：10/16〜10/18、10/24〜10/25）。郵送はありません。</li><li>購入のときは、<b>本人確認書類</b>と、<b>店舗レンタル会員証（Pontaカードかゲオアプリの会員証）</b>を見せます。さらに、自分のスマホで「<b>店舗購入</b>」の画面を見せる必要があった回があります。印刷やPC画面のスクリーンショットは使えません。</li><li>BOXは<b>レジでシュリンクを開けて外箱を回収</b>し、パックだけを渡す形だった回があります。</li><li>当選者は<b>1年間は転売禁止</b>です。オークション出品などが見つかると、以後の抽選に応募できなくなることがあります。</li></ul>
    faq:
      - ["ゲオのポケカ抽選に応募する条件は？", "店舗レンタル会員機能つきのPontaカードを持ち、GEO IDとPonta会員IDを連携していることが条件です。応募はゲオの抽選専用サイト（ゲオアプリ）からだけできます。"]
      - ["当選はどうやって分かりますか？", "応募のときに登録したメールアドレスに当選メールが届きます。届かなければ落選です。"]
      - ["当選したら何を持っていけばいいですか？", "本人確認書類と、店舗レンタル会員証（Pontaカードかゲオアプリの会員証）です。自分のスマホで「店舗購入」の画面を見せる必要があった回もあります。購入期間は2〜3日と短いので注意してください。"]
    sources:
      - ["インサイド（ゲオの30周年カードセット抽選）", "https://www.inside-games.jp/article/2026/09/28/188412.html"]
      - ["インサイド（ゲオの30th CELEBRATION抽選）", "https://www.inside-games.jp/article/2026/09/28/188420.html"]
      - ["ファミ通（ゲオの再販抽選）", "https://www.famitsu.com/article/202608/83358"]
      - ["usedoor（ゲオのポケカ抽選）", "https://usedoor.jp/news/2024-05-21-geo-pokemon-card-game-sv-night-wanderer-chuusen"]

  - slug: tsutaya
