  - slug: yamada-denki
    name: ヤマダデンキ
    game: pokemon
    store_re: "ヤマダ"
    short: ヤマダデンキ（アプリ）の抽選のやり方・当選の確かめ方
    title: ヤマダデンキのポケカ抽選のやり方｜ヤマダデジタル会員アプリでの応募・当選の確かめ方・受け取り期間
    h1: ヤマダデンキ（ヤマダデジタル会員アプリ）の抽選のやり方
    desc: ヤマダデンキのポケカ抽選の応募方法（ヤマダデジタル会員アプリ）、受け取り店舗の選び方、当選の確かめ方（メール・アプリ通知）、購入できる期間をまとめました。受付中の抽選の一覧つき。
    intro: ヤマダデンキのポケカ抽選は、<b>ヤマダデジタル会員アプリ</b>から応募して、当選したら選んだ店舗で買う形です。新弾のたびに実施されることが多く、応募しやすい抽選のひとつです。
    sections:
      - h: 応募のしかた
        html: <ul><li>応募は<b>ヤマダデジタル会員アプリ</b>から行います。抽選のバナーは期間限定で表示されます。</li><li>応募のときに、<b>受け取りに行く店舗</b>と、氏名・住所・メールアドレス・電話番号を入力します。</li><li><b>1商品につき応募は1回</b>までです。</li><li>受付期間は<b>2〜3日ほど</b>と短い回が多いです（例：12/26 9:00〜12/28 23:59）。</li><li>おもちゃ取扱店舗限定で、<b>決められた期間の店舗での購入履歴</b>が条件になった回があります（30周年のプレミアムデッキセット）。</li></ul>
      - h: 当選の確かめ方と購入
        html: <ul><li>当選の連絡は、アプリに登録した<b>メールアドレスへのメール</b>や、<b>アプリ内の通知</b>で届きます。落選の連絡はありません。</li><li>発表は<b>発売日の1〜2週間前</b>だった回が多いです（例：12/28締切→1/19発表→1/26発売）。</li><li>当選したら、応募のときに選んだ店舗で、<b>発売日から1週間ほど</b>の期間内に購入します（例：1/26〜2/1の閉店まで）。期限を過ぎると買えません。</li><li>購入のときは、アプリの<b>当選画面（バーコード）</b>を見せて支払います。</li></ul>
    faq:
      - ["ヤマダデンキのポケカ抽選はどこから応募しますか？", "ヤマダデジタル会員アプリから応募します。受け取り店舗を選んで応募し、1商品につき1回までです。受付期間が2〜3日と短い回が多いので注意してください。"]
      - ["当選はどうやって分かりますか？", "アプリに登録したメールアドレスへのメールや、アプリ内の通知で知らされます。落選の連絡はないので、発表日に自分で確かめましょう。"]
      - ["当選したら、いつまでに買えばいいですか？", "応募のときに選んだ店舗で、発売日から1週間ほどの期間内に購入します。期限は抽選ごとに違うので、当選の連絡で確認してください。"]
    sources:
      - ["usedoor（ヤマダデンキのポケカ抽選）", "https://usedoor.jp/?p=214203"]
      - ["トレカマップ（ヤマダデンキの抽選）", "https://torecamap.co.jp/column/pokemon-yamada-denki-reservation/"]
