    intro: 渋谷のQFRONTにある「<b>ポケモンカードラウンジ</b>」でも、新弾やセット商品の抽選販売が行われています。受け取りは<b>渋谷の店舗のみ</b>で、郵送はありません。
    sections:
      - h: 応募のしかた
        html: <ul><li>抽選の告知は<b>公式X</b>で出され、案内されたURLの申し込みサイトから応募します。<b>会員登録（電話番号の登録）</b>が必要です。</li><li>受付期間は<b>2〜3日ほど</b>だった回が多いです（例：7/20 10:00〜7/21 23:59）。</li><li>申し込みのときの氏名・住所は、<b>本人確認書類と同じ表記</b>で入力します。締切後は変更できず、誤りがあると当選が無効になることがあります。</li></ul>
      - h: 当選メールと受け取り
        html: <ul><li>結果は<b>メール</b>で届きます。発表は<b>18時以降に順次</b>だった回が多いです（例：7/24 18:00、8/4 18:00、9/8 18時以降）。</li><li>受け取りは<b>渋谷の店舗のみ</b>で、郵送はありません。受け取り期間は<b>発売日から数日〜10日ほど</b>だった回があります（例：9/16〜9/23）。</li><li>受け取りのときは、申し込み時に選んだ<b>顔写真つきの本人確認書類</b>を見せます。代理での受け取りはできません。</li></ul>
    faq:
      - ["ポケモンカードラウンジの抽選はどこから応募しますか？", "公式Xで告知され、案内されたURLの申し込みサイトから応募します。会員登録（電話番号の登録）が必要です。"]
      - ["商品は郵送してもらえますか？", "できません。受け取りは渋谷の店舗のみです。顔写真つきの本人確認書類を持って、受け取り期間内に行ってください。"]
    sources:
      - ["トレカマップ（ポケモンカードラウンジの抽選）", "https://torecamap.co.jp/column/pokemoncardlounge-lottery/"]
