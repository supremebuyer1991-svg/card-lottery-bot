  - slug: famima-online
    name: ファミマオンライン
    game: pokemon
    store_re: "ファミマ|ファミリーマート"
    short: ファミマオンラインの抽選のやり方・店頭受け取り
    title: ファミマオンラインのポケカ抽選のやり方｜応募条件（会員・メルマガ）・当選メール・ファミリーマート店頭受け取り
    h1: ファミマオンラインの抽選のやり方と、受け取りの流れ
    desc: ファミリーマートの通販「ファミマオンライン」のポケカ抽選について、応募方法と条件（会員登録・メルマガ）、当選メールの届き方、全国のファミリーマートでの店頭受け取りの流れをまとめました。受付中の抽選の一覧つき。
    intro: ファミリーマートの通販サイト「<b>ファミマオンライン</b>」でも、新弾のポケカBOXが抽選販売になります。当選したら、<b>全国のファミリーマートの店頭</b>で受け取れるのが特徴です。
    sections:
      - h: 応募のしかたと条件
        html: <ul><li>ファミマオンラインのお知らせに抽選の告知が出て、案内にそって<b>応募ページ</b>から申し込みます。</li><li><b>ファミマオンラインの会員登録</b>と、<b>メールマガジンの登録</b>が必要です。</li><li>受付期間は<b>4〜6日ほど</b>だった回があります（例：7/15 10:00〜7/20 23:59）。期間を過ぎると再エントリーはできません。</li></ul>
      - h: 当選メールと受け取り
        html: <ul><li>結果は、当選者に<b>メール</b>で届きます。発売日以降に順次届いた回があります。迷惑メールフォルダも確かめてください。</li><li>メールに書かれたリンクから<b>購入手続き</b>をします。購入できる期間は<b>2週間ほど</b>だった回があります（例：9/25〜10/8）。</li><li>商品は<b>全国のファミリーマート店舗で受け取り</b>です。受け取り期間が決められていた回があります（例：8/7〜8/20）。</li></ul>
    faq:
      - ["ファミマオンラインのポケカ抽選に応募する条件は？", "ファミマオンラインの会員登録と、メールマガジンの登録が必要です。応募は告知にある応募ページから行います。"]
      - ["当選したら、どこで受け取りますか？", "全国のファミリーマートの店頭で受け取ります。先に当選メールのリンクから購入手続きをして、決められた受け取り期間内にお店に行きます。"]
    sources:
      - ["トレカマップ（ファミマオンラインの抽選）", "https://torecamap.co.jp/column/famima-online/"]
      - ["スニーカーダンク（ポケカ抽選まとめ）", "https://snkrdunk.com/articles/32581/"]

  - slug: lawson-hmv
    name: ローソン・HMV
    game: pokemon
    store_re: "ローソン|HMV"
    short: ローソン（HMV&BOOKS online）の抽選と、発売日の店頭販売
    title: ローソン・HMVのポケカの買い方｜HMV&BOOKS onlineの抽選（ローソンWEB会員）と、ローソン店頭の先着販売
    h1: ローソン・HMVでのポケカの買い方（抽選と先着販売）
    desc: ローソングループのHMV&BOOKS onlineで行われるポケカ抽選の応募方法（ローソンWEB会員）、当選の連絡、HMV店舗での購入と、ローソン店頭で発売日に行われる先着販売（販売開始時間・購入制限）をまとめました。受付中の抽選の一覧つき。
    intro: ローソングループでは、<b>HMV&BOOKS onlineの抽選</b>と、<b>ローソン店頭での先着販売</b>の2つの買い方があります。抽選はHMV、発売日の朝の販売はローソンのお店、と分けて考えると分かりやすいです。
    sections:
      - h: HMV&BOOKS onlineの抽選
        html: <ul><li>応募は<b>HMV&BOOKS online</b>の抽選ページから行います。<b>ローソンWEB会員</b>の登録が必要だった回があります。</li><li>受付期間は<b>3〜4日ほど</b>だった回があります（例：7/21 13:00〜7/24 23:59、9/8 13:00〜9/10 23:59）。</li><li>当選発表は、受付が終わってから<b>数日〜2週間ほど後</b>だった回があります（例：11/26締切→11/29 18:00まで、9/10締切→9/22）。</li><li>当選者が<b>応募のときに指定したHMVの店舗</b>に行って購入する形だった回があります。購入できる期間は<b>発売日からの3日間</b>で、各日14:00から閉店まででした。</li></ul>
      - h: ローソン店頭の先着販売
        html: <ul><li>ローソンの店頭では、抽選ではなく<b>発売日の朝7:00から先着</b>で販売された回があります。なくなり次第終了です。</li><li>発売日からの3日間は<b>1人10パックまで</b>など、購入制限がついた回があります。</li><li>取り置きや予約はできません。店舗によっては入荷がなかったり、販売が発売日より後になることがあります。</li></ul>
    faq:
      - ["ローソンでポケカの抽選はありますか？", "ローソンの店頭では抽選ではなく、発売日の朝7:00から先着で販売された回があります。抽選は、ローソングループのHMV&BOOKS onlineで行われることがあります。"]
      - ["HMVの抽選に応募する条件は？", "HMV&BOOKS onlineの抽選ページから応募し、ローソンWEB会員の登録が必要だった回があります。当選者が指定したHMVの店舗で購入する形だった回があります。"]
    sources:
      - ["usedoor（HMVのポケカ抽選）", "https://usedoor.jp/news/2023-11-24-hmv-pokemon-card-game-shiny-treasure-ex-chuusen"]
      - ["インサイド（ローソンの先着販売）", "https://www.inside-games.jp/article/2023/06/07/146409.html"]
