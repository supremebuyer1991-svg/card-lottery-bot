      html: <ul><li><b>店頭で抽選券をもらう</b>：配布期間のあいだにお店へ行き、抽選券を受け取る形です（明石ビブレ店・玉島店の告知）。配布期間は1週間〜12日ほどでした。</li><li><b>店頭のQRコードから応募</b>：お店にあるQRコードを読み取って応募する形です（岡崎店の告知）。受付が1か月ほどと長い回がありました。</li><li><b>Webの応募ページから応募</b>：Xのポストにあるリンクから応募する形です（京都店・日本橋店・船橋駅前店の告知）。船橋駅前店は、応募と<b>応募できたかの確認</b>が同じページでできました。</li><li><b>Xのフォロー＆リポスト＋フォーム</b>：店舗のアカウントをフォローし、告知ポストをリポストしたうえで、フォームに必要なことを書く形です（青馬堂書店矢向店の告知）。</li><li>「<b>購入権</b>」「<b>予約権利</b>」の抽選と書かれていることがあります。当たると買える権利がもらえる、という意味です。</li></ul>
    - h: 必要なもの
      html: <ul><li><b>会員証（ポイントカード）</b>：抽選券をもらうとき・当選して買うときに必要だった店舗があります。<b>会員限定</b>の回があり、「当日入会でもよい」回と「決められた日までに会員になっている人だけ」の回がありました（玉島店）。</li><li><b>身分証</b>：<b>顔写真つき</b>と指定していた店舗があります（玉島店）。</li><li><b>現金</b>：支払いは<b>現金のみ</b>と書かれていた店舗があります（明石ビブレ店・玉島店）。</li><li><b>Xアカウント</b>：フォロー＆リポストで応募する店舗では必要です。</li><li>必要なものは店舗によってちがいます。応募前に各店舗の告知を確認してください。</li></ul>
    - h: 当選の発表と受け取り
      html: <ul><li><b>抽選結果を公開する形</b>：お店が結果を出し、<b>応募した人が自分で確かめる</b>店舗があります（刈谷店）。</li><li><b>当選した人に連絡が来る形</b>：決められた日のうちに当選者へ連絡する店舗があります（青馬堂書店矢向店）。</li><li>受け取りは<b>店頭</b>です。引き換えの期間は、<b>発売日から3日以内</b>だった店舗（刈谷店）と、<b>発売日から8〜10日ほど</b>だった店舗（明石ビブレ店・玉島店）がありました。</li><li>来店のときは、会員証（ポイントカード）と身分証を持っていきます。</li></ul>
    - h: 注意すること
      html: <ul><li>抽選券は<b>1人1枚まで</b>で、「1家族・1世帯・同じ住所で1枚」と数える店舗がありました（玉島店）。</li><li><b>系列店あわせて1枚のみ</b>と書かれていた店舗があります。近くの系列店と両方に応募すると無効になるおそれがあるので、告知を確認しましょう。</li><li>Webの応募ページでは「<b>概要欄を必ず読む</b>」「詳細を必ず確認する」と案内されています。応募条件はそこに書かれています。</li><li>ワンピースカードの抽選をするかどうか・やり方は店舗によってちがいます。応募前に各店舗の告知を確認してください。</li></ul>
