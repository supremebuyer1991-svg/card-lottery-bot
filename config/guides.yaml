    title: カードボックスのポケカ・ワンピースカード抽選の応募方法｜必要なもの・当選発表・受け取り方
    h1: カードボックスの抽選の応募方法と受け取り方
    desc: カードボックスのポケカ抽選販売について、店舗ごとにちがう応募方法（店頭の抽選券・店頭QRコード・Webの応募ページ・Xのフォロー＆リポスト）、会員証や身分証などの持ち物、当選発表と引き換えの流れをまとめました。受付中の抽選の一覧つき。
    intro: カードボックスの抽選は<b>店舗ごと</b>に行われ、応募のしかたが店舗でかなりちがいます。各店舗のXの告知で確かめられたのは、<b>店頭で抽選券をもらう形</b>、<b>店頭のQRコードから応募する形</b>、<b>Webの応募ページから応募する形</b>、<b>Xのフォロー＆リポストとフォーム入力の形</b>の4つです。応募前に各店舗の告知を確認してください。
    sections:
