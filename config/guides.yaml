    short: イエローサブマリンの購入権抽選のやり方（LivePocket・レシート・マイナンバーカード）
    title: イエローサブマリンの抽選のやり方｜LivePocketの購入権抽選・必要なもの（レシート・マイナンバーカード）・当選後の購入
    h1: イエローサブマリンの購入権抽選のやり方と、必要なもの
    desc: イエローサブマリンのポケカ・ワンピースカード抽選（LivePocketの購入権抽選）の応募方法、必要なもの（LivePocketのアカウント・マイナンバーカード・300円以上のレシート）、当選発表と店頭での購入までをまとめました。受付中の抽選の一覧つき。
    intro: イエローサブマリンでは、新弾のBOXを<b>LivePocket（ライブポケット）の「購入権抽選」</b>で売ることがあります。<b>取扱店舗全店まとめての抽選</b>で、応募に使った<b>レシートを発行した店舗</b>で買うしくみです。必要なものが多いので、応募前に確かめておきましょう。
    sections:
      - h: 必要なもの
        html: <ul><li><b>LivePocketのアカウント</b>（プロフィールの氏名・居住地（都道府県）・生年月日を、マイナンバーカードと同じにしておく）</li><li><b>マイナンバーカード</b>（当選後の購入時の本人確認。マイナポータルやデジタル版、期限切れは不可。高校生以下は別の身分証2つ以上で対応した回があります）</li><li><b>指定された期間に、取扱店舗で発行された300円以上の購入または買取のレシート</b>（予約時のレシートは不可。1人1枚）</li></ul>
      - h: 応募のしかた
        html: <ul><li>告知にあるLivePocketの抽選ページから申し込みます。</li><li>申し込み時のアンケートで、<b>名字・名前（全角カタカナ）</b>、<b>レシートNo.（半角数字）</b>、<b>購入金額（半角数字）</b>を入力します。全角・半角や記号のまちがいは無効になります。</li><li>LivePocketの登録情報とマイナンバーカードの記載がちがうと、抽選の対象外・当選無効になります（特に住所の変更し忘れに注意）。</li></ul>
      - h: 当選発表と購入
        html: <ul><li>当選すると<b>案内メール</b>が届きます。発表は発売日の前日ごろだった回があります（例：11/11締切→11/20発表予定→11/21〜23購入）。</li><li>購入は<b>レシートを発行した店舗だけ</b>で、<b>当選した本人だけ</b>です。当選チケットを見せ、<b>マイナンバーカード</b>で本人確認をします。</li><li>購入できる期間（発売日から3日ほどだった回があります）に行かないと、当選は無効です。</li></ul>
    faq:
      - ["イエローサブマリンの抽選に必要なものは何ですか？", "LivePocketのアカウント、マイナンバーカード、指定期間に取扱店舗で発行された300円以上の購入または買取のレシートが必要だった回があります。抽選ごとに告知を確認してください。"]
      - ["どの店舗で買えますか？", "応募に使ったレシートを発行した店舗で買います。ほかの店舗では買えません。"]
      - ["イエローサブマリンの抽選の結果はどうやってわかりますか？", "当選するとLivePocketから案内メールが届きます。発売日の前日ごろに発表だった回があります。"]
    sources:
      - ["イエローサブマリン 購入権抽選（LivePocket・神の支配）", "https://livepocket.jp/e/bh-48"]

