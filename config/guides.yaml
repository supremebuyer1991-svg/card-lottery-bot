    intro: TSUTAYAのポケカ抽選は、<b>店舗ごとに別々</b>に行われます。全国共通の応募ページはなく、各店舗の<b>公式X</b>などで告知される形です。近くの店舗のXをフォローしておくのがいちばんの近道です。
    sections:
      - h: 応募のしかた
        html: <ul><li>抽選の告知と応募方法は、<b>各店舗の公式X</b>で出されます。応募のしかた（店頭での受付、Xでの応募など）は店舗によって違います。</li><li>多くの店舗が事前抽選ですが、<b>先着販売</b>にする店舗もあります。近くの店舗がどちらかは、その店舗の告知で確かめてください。</li><li>受付期間は店舗ごとに違い、<b>2〜3日</b>の店舗から<b>1〜2週間</b>の店舗まであります（例：7/17〜7/19 22:00、7/13 10:00〜7/26 22:00）。</li></ul>
      - h: 当選発表と購入
        html: <ul><li>当選発表の日時も店舗ごとに違います。受付終了から<b>数日〜2週間ほど後</b>に、店舗のXなどで発表された回が多いです（例：7/19締切→7/22発表、7/12締切→7/28発表）。</li><li>購入は応募した店舗で行います。購入期間や持ち物は、各店舗の告知で確かめてください。</li></ul>
    faq:
      - ["TSUTAYAのポケカ抽選はどこから応募しますか？", "店舗ごとに行われるので、全国共通の応募ページはありません。近くの店舗の公式Xで告知される応募方法にそって申し込みます。"]
      - ["どの店舗でも抽選をしていますか？", "店舗によって、事前抽選・先着販売・取り扱いなしに分かれます。行く予定の店舗の告知を確かめてください。"]
    sources:
      - ["スニーカーダンク（ポケカ抽選まとめ）", "https://snkrdunk.com/articles/32581/"]
