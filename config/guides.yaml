    sections:
      - h: 応募のしかたと条件
        html: <ul><li>応募は、対象店舗の<b>店頭レジ</b>で受け付けます。受付期間は<b>金〜日の3日間</b>だった回が多いです。</li><li><b>お客様情報を登録したビックカメラのポイントカードか公式アプリ</b>が必要です。決められた日までに発行されたものに限られます。</li><li>そのカード・アプリで、<b>過去約2年の間に1回以上の購入履歴</b>があることが条件だった回があります（例：2021/9/3〜2023/9/3の購入）。</li><li>コジマ・ソフマップのポイントカードは対象外だった回があります。</li><li>実施する店舗は限られます。対象店舗は店頭や各店舗の公式Xで確かめてください。</li></ul>
      - h: 当選の確かめ方と購入
        html: <ul><li>当選発表は、受付が終わってから<b>1〜2週間後の木曜</b>だった回が多いです。応募した店舗の掲示や、店舗の公式Xで当選番号が発表される形で、メールでの連絡はありません。</li><li>購入できる期間は<b>発売日からの3日間（金〜日）</b>だった回が多いです。</li><li>購入のときは、<b>応募時のレシート控え</b>、<b>応募に使ったポイントカードかアプリ</b>、<b>本人確認書類</b>を持って、応募した店舗に行きます。</li><li>購入できる数は<b>1人1BOXまで</b>だった回があります。</li></ul>
    faq:
      - ["ビックカメラのポケカ抽選はネットから応募できますか？", "できません。対象店舗の店頭レジで応募します。お客様情報を登録したポイントカードか公式アプリと、過去の購入履歴が条件だった回があります。"]
      - ["当選したかどうかは、どうやって分かりますか？", "応募した店舗の掲示や、店舗の公式Xで当選番号が発表されます。メールは来ないので、発表日に自分で確かめてください。レシート控えは再発行できないので、なくさないようにしましょう。"]
      - ["当選したら何を持っていけばいいですか？", "応募時のレシート控え、応募に使ったポイントカードかアプリ、本人確認書類の3つです。応募した店舗でだけ購入できます。"]
    sources:
      - ["usedoor（ビックカメラのポケカ抽選・レイジングサーフ）", "https://usedoor.jp/news/2023-09-08-biccamera-pokemon-card-game-raging-surf-chuusen"]
      - ["usedoor（ビックカメラのポケカ抽選・シャイニートレジャーex）", "https://usedoor.jp/news/2023-11-14-biccamera-pokemon-card-game-shiny-treasure-ex-chuusen"]
      - ["トレカマップ（ビックカメラの抽選）", "https://torecamap.co.jp/column/biccamera-lottery/"]
