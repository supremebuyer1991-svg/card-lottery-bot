    title: ドラゴンスターのポケカ・ワンピースカード抽選の応募方法｜会員登録・当選発表・店頭と通販の受け取り
    desc: ドラゴンスターのポケカなどの抽選販売について、抽選受付ページからの応募、必要な会員登録（ドラゴンスターモバイル会員）、当選発表、店頭で買う抽選と通販の抽選のちがい、購入期間の注意点をまとめました。受付中の抽選の一覧つき。
    h1: ドラゴンスターの抽選の応募方法
    intro: カードショップのドラゴンスターでは、人気のBOXを<b>会員向けの抽選</b>で販売します。応募は公式の<b>抽選受付ページ</b>からで、<b>店頭で買う抽選</b>と<b>通販の抽選</b>の2つがあります。
    short: ドラゴンスターの抽選の応募方法（会員登録・抽選受付ページ・店頭／通販）
    sections:
    - h: 応募のしかた
      html: <ul><li>応募は、ドラゴンスターの<b>抽選受付ページ</b>（会員サイト）から行います。</li><li>店頭で買う抽選は、<b>抽選をしている店舗</b>の中から応募する店舗を選びます。実施店舗は抽選受付ページで確認できます。</li><li>締め切りは<b>23時59分</b>だった回があります（例：5/17 23:59まで、11/23 23:59まで）。</li></ul>
    - h: 必要なもの
      html: <ul><li><b>ドラゴンスターの会員登録</b>が必要です。「<b>ドラゴンスターモバイル会員限定</b>」として行われた回があります。</li><li>会員登録は応募の前にすませておきましょう。締め切り間ぎわだと間に合わないことがあります。</li><li>受け取りのときに本人確認書類がいるかどうかは、回や店舗によってちがいます。応募前に各店舗の告知を確認してください。</li></ul>
    - h: 当選の発表と受け取り
      html: <ul><li>当選発表は、締め切りの<b>次の日</b>だった回と、<b>2〜3日後</b>だった回があります（例：5/17締切→5/18発表、11/23締切→11/25〜11/26発表）。</li><li>結果が<b>当選メール</b>で届いた回があります。</li><li><b>店頭の抽選</b>：当選したら、<b>応募した店舗</b>に行って販売期間内に買います。販売期間は<b>3日間</b>だった回があります（例：5/19〜5/21）。</li><li><b>通販の抽選</b>：当選したあとの購入期間は<b>1週間ほど</b>だった回があります（例：3/16〜3/22）。</li></ul>
    - h: 注意すること
      html: <ul><li>購入できる数は<b>1人1BOXまで</b>が基本でした。通販の抽選は「1人1点まで」だった回があります。</li><li>店頭の抽選は販売期間が短い回があります。<b>期間内に行ける店舗</b>を選んで応募しましょう。</li><li>抽選期間と購入期間は回ごとにちがいます。応募のたびに日付を確かめてください。</li></ul>
    faq:
    - - ドラゴンスターの抽選に会員登録は必要ですか？
      - 必要です。ドラゴンスターの会員登録が応募の条件で、「ドラゴンスターモバイル会員限定」として行われた回があります。
    - - 当選したら、どこで買いますか？
      - 店頭の抽選は、応募した店舗に行って販売期間内に買います（3日間だった回があります）。通販の抽選は、決められた購入期間のうちに通販で買います。
    - - 当選発表はいつですか？
      - 締め切りの次の日だった回と、2〜3日後だった回があります。当選メールで届いた回があるので、メールもあわせて確認してください。
    sources:
    - - インサイド（ドラゴンスターの抽選販売・2023年5月）
