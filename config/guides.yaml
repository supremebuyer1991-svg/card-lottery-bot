    sections:
    - h: 応募のしかた
      html: <ul><li>三洋堂の公式サイトに出る<b>抽選販売のご案内</b>から、Webの申込ページで応募します。</li><li>応募のときに、<b>受け取りに行く店舗を1つ選びます</b>。応募できるのは1店舗だけだった回があります。</li><li>受付期間は<b>10日〜2週間ほど</b>の回があります（例：11/10〜11/19、8/19〜9/1）。</li><li>商品が2種類あるときは、<b>商品ごとに申込ページが分かれていた</b>回があります。</li></ul>
    - h: 必要なもの
      html: <ul><li><b>三洋堂サイトの会員登録</b>：応募に<b>会員番号</b>が必要だった回があります。先に登録をすませておきましょう。</li><li><b>本人確認書類</b>：買うときに必要です。運転免許証・マイナンバーカード・学生証・パスポートなどが例にあがっていました。</li></ul>
    - h: 当選の発表と受け取り
      html: <ul><li>当選の発表は、受付が終わってから<b>10日ほど後</b>だった回があります（例：9/1締切→9/11発表）。</li><li>当選したら、<b>応募のときに選んだ店舗</b>に行き、そこでお会計をして受け取ります。</li><li>買える期間は<b>3〜5日間</b>だった回があります（例：12/1〜12/3、9/16〜9/20）。</li><li>買える数は<b>1人1BOXまで</b>だった回があります。</li></ul>
    - h: 注意すること
      html: <ul><li>予約した商品や当選した商品を<b>受け取りに行かなかったこと</b>が何回か確認された人は、抽選の対象から外されたり、当選が無効になったりすることがあると案内されています。当選したら必ず期間内に行きましょう。</li><li>受け取りは選んだ店舗だけです。あとから店舗を変えられるかどうかは、応募前に告知を確認してください。</li><li>ワンピースカードの抽選をするかどうかは、三洋堂の公式サイトのお知らせを確認してください。</li></ul>
    faq:
    - - 三洋堂のポケカ抽選に応募するには何が必要ですか？
      - 三洋堂サイトの会員登録が必要です。応募に会員番号を使った回があるので、先に登録しておきましょう。
    - - 当選したら、どこで受け取りますか？
      - 応募のときに選んだ店舗に行って、その場でお会計をして受け取ります。買える期間は3〜5日間ほどだった回があります。
    - - 受け取りのときの持ち物は？
      - 運転免許証やマイナンバーカードなどの本人確認書類が必要です。
    sources:
    - - 三洋堂 公式サイト（30th CELEBRATION 抽選販売のご案内）
      - https://www.sanyodo.co.jp/news/evt_20260819-20260901_01
    - - インサイド（三洋堂の30th CELEBRATION抽選販売）
      - https://www.inside-games.jp/article/2026/08/27/186869.html
    - - AppBank（三洋堂書店のシャイニートレジャーex抽選予約）
      - https://www.appbank.net/2023/11/10/tcg/2627062.php
  - name: ジャンプショップ
    slug: jumpshop
    store_re: ジャンプショップ|JUMP ?SHOP
    title: ジャンプショップのワンピースカード抽選の応募方法｜Web応募・当選発表・店頭での受け取り方
    desc: ジャンプショップ（JUMP SHOP）で行われるワンピースカードなどの抽選販売について、店舗ごとのWeb応募、当選発表のタイミング、店頭での購入、発売日の入店予約（ライヴポケット）の注意点をまとめました。受付中の抽選の一覧つき。
    h1: ジャンプショップ（JUMP SHOP）の抽選の応募方法
    intro: ジャンプショップ（JUMP SHOP）では、ONE PIECEカードゲームの新しいBOXなどが抽選販売になることがあります。応募は<b>店舗ごとのWebの応募ページ</b>から行い、当選したらその店舗に行って買う形でした。
    short: ジャンプショップの抽選の応募方法（店舗ごとのWeb応募・店頭で購入）
    sections:
    - h: 応募のしかた
      html: <ul><li>応募は<b>Web</b>から行います。応募ページは<b>店舗ごと</b>に分かれていた回があります（例：東京駅店の応募ページ）。</li><li>受付の締め切りは<b>夜の23時59分</b>だった回があります（例：『二つの伝説』は5/18 23:59まで）。</li><li>抽選をする店舗・しない店舗があります。店舗によってちがいます。応募前に各店舗の告知を確認してください。</li></ul>
    - h: 当選の発表と受け取り
      html: <ul><li>当選発表は、締め切りの<b>次の日</b>だった回があります（例：5/18締切→5/19発表）。発表までが短いので、結果を見のがさないようにしましょう。</li><li>当選したら、<b>応募した店舗の店頭</b>で購入します。通販での発送ではありません。</li><li>購入できる期間・支払い方法・本人確認書類がいるかどうかは、回や店舗によってちがいます。応募前に各店舗の告知を確認してください。</li></ul>
    - h: 発売日まわりの入店予約（ライヴポケット）
      html: <ul><li>ジャンプショップは、新商品の発売日などに<b>入店そのものが事前予約制（抽選）</b>になる日があります。予約は<b>ライヴポケット（LivePocket）</b>の各店舗のページから行います。</li><li>入店予約は、予約期間が約6日間、そのあと1〜2日で当選発表だった回があります（例：3/31〜4/5に予約→4/6〜4/7に発表）。</li><li>予約のいらない「通常入店」の日でも、こみ具合によって<b>入場制限</b>がかかることがあります。空きのある時間帯は、当日の朝9時から先着で申し込めた回があります。</li><li>お店の休業や営業時間の変更があると、その日時の入場チケットは無効になり、代わりのチケットは出ません。</li></ul>
    - h: 注意すること
      html: <ul><li>入店予約とカードの抽選販売は<b>別のもの</b>です。入店できても、商品が買えるとは限りません。</li><li>商品によっては<b>購入できる数に上限</b>があります。数は回によって変わります。</li><li>営業時間は、入っている商業施設に合わせて店舗ごとにちがいます。行く前に公式の営業一覧を確認してください。</li></ul>
    faq:
    - - ジャンプショップの抽選はどこから応募しますか？
      - Webの応募ページから応募します。応募ページは店舗ごとに分かれていた回があるので、買いに行ける店舗のページから応募してください。
    - - 当選したら、どうやって買いますか？
      - 応募した店舗の店頭で購入します。発送はありません。購入期間や持ち物は回や店舗によってちがうので、当選の案内と各店舗の告知を確認してください。
    - - 発売日は予約なしでお店に入れますか？
      - 新商品の発売日などは、ライヴポケットでの事前予約（抽選）が必要な日があります。通常入店の日でも、こみ具合で入場制限がかかることがあります。
    sources:
    - - JUMP SHOP 営業一覧（公式・2025年3月31日版）
      - https://benelic.com/jumpshop/wp-content/uploads/2025/03/31160029/0331.pdf
    - - JUMP SHOP 営業一覧（公式・2025年6月30日版）
      - https://benelic.com/jumpshop/wp-content/uploads/2025/06/30164613/0630.pdf
    - - magi（『二つの伝説』抽選・店舗一覧）
      - https://magi.camp/blogs/1004409654
  - name: ミント（MINT）
    slug: mint
    store_re: (?<![ァ-ヴー])ミント|(?<![A-Za-z])MINT(?![A-Za-z])
    title: ミント（MINT）のポケカ・ワンピースカード抽選の応募方法｜応募フォーム・当選メール・店頭受け取り
    desc: カードショップ ミント（MINT）のポケカ・ワンピースカード抽選販売について、店舗ごとの応募フォームやXでの告知、当選メール、店頭での引き取りと取り置き期限、二重応募などの注意点をまとめました。受付中の抽選の一覧つき。
    h1: ミント（MINT）の抽選の応募方法
    intro: カードショップのミント（MINT）では、<b>店舗ごと</b>にポケカやワンピースカードの抽選販売を行います。応募は各店舗が用意する<b>応募フォーム</b>からで、当選したらその店舗で買う形が中心です。
    short: ミント（MINT）の抽選の応募方法（店舗ごとの応募フォーム・当選メール・店頭受け取り）
    sections:
    - h: 応募のしかた
      html: <ul><li>抽選は<b>店舗ごと</b>に行われます。各店舗の<b>公式X</b>に告知が出て、そこから応募する形でした（例：横浜店・沖縄店）。</li><li>応募には<b>Googleフォーム</b>が使われた回があります（例：札幌店・新宿店・名古屋店）。</li><li>「<b>フォームからのオンライン受付だけ</b>で、店頭では受け付けない」とされた回があります（札幌店）。</li><li>受付期間は、5日ほどの回から2週間ほどの回までありました。店舗によってちがいます。応募前に各店舗の告知を確認してください。</li></ul>
    - h: 必要なもの・応募できる人
      html: <ul><li>応募フォームを開くときに<b>Googleアカウントへのログイン</b>を求められた回があります。</li><li><b>中学生以下は保護者の同伴が必須</b>とされた回があります（札幌店）。</li><li>同じ商品を<b>店頭で予約した人は、抽選に参加できない</b>とされた回があります（名古屋店）。</li><li>会員カードや本人確認書類がいるかどうかは、店舗によってちがいます。応募前に各店舗の告知を確認してください。</li></ul>
    - h: 当選の発表と受け取り
      html: <ul><li>当選発表は、<b>当選した人にだけメール</b>で届いた回があります。発表は締め切りの当日（夕方ごろ）だった回があります。</li><li>受け取りは<b>店舗での販売だけ</b>で、発送はしないとされた回があります（名古屋店）。</li><li>引き取りは発表の次の日からで、<b>取り置きは約1週間</b>。期限を過ぎるとキャンセルになった回があります（例：11/28発表→11/29から引き取り→12/6まで）。</li><li>購入できる数は<b>1人1BOXまで</b>だった回があります。</li></ul>
    - h: 注意すること
      html: <ul><li><b>二重応募</b>が見つかると、<b>すべての予約が取り消し</b>になるとされた回があります。応募は1人1回にしましょう。</li><li>当選メールが迷惑メールに入らないよう、受信設定を見ておくと安心です。</li><li>応募条件や受け取りのルールは店舗ごとに決まっています。ほかの店舗の例をそのまま当てはめないようにしてください。</li></ul>
    faq:
    - - ミント（MINT）の抽選はどこから応募しますか？
      - 各店舗の公式Xの告知から、その店舗の応募フォーム（Googleフォームだった回があります）で応募します。店頭では受け付けない回もありました。
    - - 当選はどうやってわかりますか？
      - 当選した人にだけメールが届いた回があります。落選の連絡は来ないことがあるので、発表予定日は告知で確かめておきましょう。
    - - 当選した商品は送ってもらえますか？
      - 店舗での販売だけで、発送はしないとされた回があります。取り置きの期限（約1週間だった回があります）までに店舗へ行ってください。
    sources:
    - - MINT札幌店 抽選販売応募フォーム（MEGAドリームex）
      - https://docs.google.com/forms/d/19Y3_878nd70bR26wy72JPcDfTyIoijO2dCvugzD2aAI/viewform
    - - MINT名古屋店 抽選応募フォーム
      - https://docs.google.com/forms/d/e/1FAIpQLSfFXYZCI2kEOHKyqIUDk2vcFlaT7BJt8AxOm9221LKMSP4tEQ/formResponse
    - - MINT新宿店 ONE PIECEカードゲーム 抽選応募フォーム
      - https://docs.google.com/forms/d/e/1FAIpQLSdoR29KHgPIKmqZ32pthLb52sIWB7CjYVoJdPwXoIYH2Su1Cw/viewform
    - - スニーカーダンク（ポケカ抽選まとめ）
      - https://snkrdunk.com/articles/30468/
  - name: ドラゴンスター
    slug: dragonstar
