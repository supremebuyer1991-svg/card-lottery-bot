  - slug: edion
    name: エディオン
    game: pokemon
    store_re: "エディオン|トレカキャピタル"
    short: エディオンの抽選のやり方・応募の条件（会員限定）
    title: エディオンのポケカ抽選のやり方｜会員限定の応募条件・当選はSMSで連絡・店舗での購入
    h1: エディオン（トレカキャピタル含む）の抽選のやり方と、応募の条件
    desc: エディオンのポケカ抽選の応募条件（エディオンカード・あんしん保証・アプリ・ID会員）、応募方法、当選の連絡（SMS）、店舗での購入期間と購入数をまとめました。受付中の抽選の一覧つき。
    intro: エディオンのポケカ抽選は<b>会員限定</b>です。エディオンの専用ページから応募し、当選すると携帯電話に<b>SMS</b>で連絡が来て、店舗で購入する形です。エディオンのトレカ専門店「トレカキャピタル」の分もいっしょに受け付ける回があります。
    sections:
      - h: 応募の条件と応募のしかた
        html: <ul><li>応募できるのは<b>エディオンの会員</b>だけです。クレジット機能つきエディオンカード（家族カード含む）、あんしん保証会員、アプリ会員、ID会員が対象だった回があります。アプリ会員は無料で登録できます。</li><li>応募は、エディオン公式サイトの<b>抽選の専用ページ</b>から行います。</li><li>受付期間は<b>3〜6日ほど</b>だった回があります（例：10/6 10:00〜10/11 23:59、7/17 10:00〜7/19 23:59）。</li><li>同じ人が複数応募したと判断されると、<b>すべて無効</b>になります。転売目的と判断された場合も無効です。</li></ul>
      - h: 当選の連絡と購入
        html: <ul><li>当選の連絡は、応募した<b>携帯電話番号にSMS</b>で届きます。発表は発売の数日前〜当日にかけてだった回があります（例：10/25までに連絡→10/27発売）。</li><li>当選しただけでは商品は手に入りません。<b>店舗に行って購入</b>します。購入期間は<b>発売日から約1週間</b>だった回があります（例：10/27 10:00〜11/2 閉店まで）。</li><li>購入できる数は原則<b>1人1BOXまで</b>（トレカキャピタル3店舗では2BOXまで）だった回があります。BOXに満たないパック数での購入もできました。</li><li>商品は<b>シュリンクを外した状態</b>で渡された回があります。</li></ul>
    faq:
      - ["エディオンのポケカ抽選は誰でも応募できますか？", "会員限定です。エディオンカード、あんしん保証、アプリ会員、ID会員などが対象だった回があります。アプリ会員は無料で登録できます。"]
      - ["当選はどうやって分かりますか？", "応募した携帯電話番号にSMSで連絡が来ます。当選しただけでは商品は届かないので、期間内に店舗に行って購入してください。"]
    sources:
      - ["AppBank（エディオンのポケカ抽選）", "https://www.appbank.net/2023/10/05/game/tcg/2584990.php"]
      - ["usedoor（エディオンのポケカ抽選・クリムゾンヘイズ）", "https://usedoor.jp/news/2024-03-04-edion-pokemon-card-game-sv-crimsonhaze-chuusen"]
      - ["スニーカーダンク（ポケカ抽選まとめ）", "https://snkrdunk.com/articles/32581/"]

  - slug: nojima
    name: ノジマ
    store_re: "ノジマ"
    short: ノジマオンラインの「シークレット販売会」のしくみ
    title: ノジマオンラインの「シークレット販売会」とは｜ポケカの購入案内メールが届く条件・抽選との違い
    h1: ノジマオンラインの「シークレット販売会」のしくみ
    desc: ノジマオンラインで行われているポケカ・ワンピースカードなどの「シークレット販売会」について、エントリー方法、購入案内メールが届かない条件、ふつうの抽選との違いをまとめました。受付中の情報の一覧つき。
    intro: ノジマオンラインでは、ポケカやワンピースカードなどの人気商品を「<b>シークレット販売会</b>」という形で売っています。名前は抽選っぽいですが、<b>抽選ではなく</b>、案内メールが届いた人だけが買える<b>先着販売</b>です。
    sections:
      - h: しくみとエントリーのしかた
        html: <ul><li>ノジマオンラインの会員が、対象商品に<b>エントリー</b>しておきます。複数の商品にエントリーできます。</li><li>エントリーした人の一部に、不定期で<b>購入案内メール</b>が届きます。メールが届いた人だけが、<b>先着</b>で購入できます。</li><li>案内が届いても購入は義務ではありません。ただし、買おうとした時にはすでに売り切れていることもあります。</li><li>受付は不定期に締め切られたり、再開されたりします。ノジマオンラインの<b>公式X</b>をフォローしておくと案内が届きやすいと案内されています。</li></ul>
      - h: 案内メールが届かない条件
        html: <ul><li><b>家族の会員IDを含めて、複数のIDで応募</b>した場合は対象外です。</li><li><b>過去に人気商品・品薄商品を多く購入</b>している場合は対象外です。</li><li><b>ノジマオンラインでの購入履歴がない</b>場合は対象外です（案内の前に受け取り済みの購入があれば対象になることがあります）。</li></ul>
    faq:
      - ["ノジマの「シークレット販売会」は抽選ですか？", "抽選ではありません。エントリーした人の一部に購入案内メールが届き、届いた人が先着で買えるしくみです。案内は不定期で、届かないこともあります。"]
      - ["案内メールが届かないのはなぜですか？", "複数IDでの応募、人気商品の購入が多い、ノジマオンラインでの購入履歴がない、のどれかに当たると対象外になります。確実に届く方法はありません。"]
    sources:
      - ["Game*Spark（ノジマオンラインのシークレット販売会）", "https://www.gamespark.jp/article/2025/06/10/153813.html"]
      - ["インサイド", "https://www.inside-games.jp/article/2025/06/10/168242.html"]

  - slug: aeon
    name: イオン
    game: pokemon
    store_re: "イオン|キッズリパブリック|iAEON"
    short: イオン（iAEON・キッズリパブリック・各地域）の抽選のやり方
    title: イオンのポケカ抽選のやり方｜iAEONアプリ・キッズリパブリックアプリ・イオン北海道／九州・イオンスタイルオンラインの違い
    h1: イオンの抽選のやり方（アプリ・地域ごとの違い）
    desc: イオンのポケカ抽選は、本州・四国の「キッズリパブリックアプリ」、北海道・九州など地域会社の「iAEONアプリ」、通販の「イオンスタイルオンライン」に分かれます。それぞれの応募方法、当選クーポンの確かめ方、購入期間と支払いの条件をまとめました。受付中の抽選の一覧つき。
    intro: イオンのポケカ抽選は、<b>住んでいる地域によって応募先が違う</b>のがポイントです。本州・四国は「キッズリパブリック」アプリ、北海道や九州はそれぞれのイオンの「iAEON」アプリ、通販は「イオンスタイルオンライン」で、別々に抽選が行われます。
    sections:
      - h: キッズリパブリックアプリ（本州・四国）
        html: <ul><li>イオンのおもちゃ売場のアプリ「<b>キッズリパブリック</b>」から応募します。店頭やサイトでの応募はありません。<b>対象は本州・四国の店舗</b>で、北海道・九州・沖縄は対象外です。</li><li><b>iAEON IDとの連携</b>と、お気に入り店舗の登録が必要です。<b>1人1ID1回</b>までです。</li><li>当選者には、アプリ内に<b>当選クーポン</b>が配信されます（例：10/26 12:00以降）。落選の連絡はありません。</li><li>当選したら、指定した店舗で<b>期限内に購入</b>します（例：発売日10/27→11/1まで）。店頭では<b>アプリの当選クーポンと会員ID</b>を見せます。スクリーンショットは無効です。</li><li>店舗によっては<b>シュリンクを外して</b>渡されます。</li></ul>
      - h: iAEONアプリ（イオン北海道・イオン九州など）
        html: <ul><li>イオン北海道やイオン九州は、<b>iAEONアプリ</b>のエントリーから応募する、別の抽選です。北海道の抽選は、北海道のイオンをお気に入り店舗に登録している人が対象でした。</li><li>当選者にはアプリに<b>当選クーポン</b>が届き、対象店舗のおもちゃ売場で購入します（例：9/15 8:00以降発表→9/16〜9/20購入）。</li><li>イオン北海道では、支払いが<b>イオンのクレジットカード（またはAEON Payのイオンカード払い）のみ</b>だった回があります。複数IDで応募すると、応募と当選がすべて無効になります。</li></ul>
      - h: イオンスタイルオンライン（通販）
        html: <ul><li>イオンスタイルオンラインの会員が、Webの応募ページから応募します。商品は<b>郵送</b>で届きます。</li><li>結果は<b>メール</b>で知らされ、当選メールのURLから購入手続きをします。購入できる期間は<b>発表日の12時から翌日の23:59まで</b>だった回があります。</li><li>支払いが<b>イオンマークのクレジットカードのみ</b>、購入は<b>1人1BOX・1世帯1名</b>だった回があります。</li></ul>
    faq:
      - ["イオンのポケカ抽選はどのアプリから応募しますか？", "本州・四国の店舗はキッズリパブリックアプリ、北海道や九州はそれぞれのイオンのiAEONアプリ、通販はイオンスタイルオンラインです。住んでいる地域に合わせて応募先を選んでください。"]
      - ["当選はどうやって分かりますか？", "アプリの抽選は、アプリ内に当選クーポンが配信されます。落選の連絡はありません。イオンスタイルオンラインはメールで知らされます。"]
      - ["機種変更をしても大丈夫ですか？", "アプリの退会・再インストール・機種変更などでIDが変わると、当選が無効になったりクーポンが表示できなくなることがあります。当選クーポンを使い終わるまでは避けるのが安心です。"]
    sources:
      - ["AppBank（キッズリパブリックアプリのポケカ抽選）", "https://www.appbank.net/2023/10/11/game/tcg/2590056.php"]
      - ["トレカマップ（イオンの抽選）", "https://torecamap.co.jp/column/pokemon-aeon-reservation/"]
      - ["スニーカーダンク（ポケカ抽選まとめ）", "https://snkrdunk.com/articles/32581/"]

  - slug: ito-yokado
    name: イトーヨーカドー
    game: pokemon
    store_re: "イトーヨーカドー|ヨーカドー"
    short: イトーヨーカドー（ネット通販・店頭QR）の抽選のやり方
    title: イトーヨーカドーのポケカ抽選のやり方｜ネット通販（7iD）と店頭QR（LivePocket）の違い・当選の確かめ方
    h1: イトーヨーカドーの抽選のやり方（ネット通販と店頭QR）
    desc: イトーヨーカドーのポケカ抽選は、ネット通販（7iD・郵送）の抽選と、店頭のQRコードから申し込む店舗受け取りの抽選（LivePocket）があります。それぞれの応募方法、当選の確かめ方、購入期間をまとめました。受付中の抽選の一覧つき。
    intro: イトーヨーカドーのポケカ抽選には、<b>ネット通販で申し込んで郵送で受け取る</b>ものと、<b>お店のQRコードから申し込んで店舗で受け取る</b>ものの2種類があります。回によってどちらか、または両方が行われます。
    sections:
      - h: ネット通販の抽選（7iD）
        html: <ul><li>イトーヨーカドーのネット通販サイトの応募ページから申し込みます。<b>7iDの会員登録</b>と、<b>二要素認証用の電話番号の設定</b>が必要です。</li><li>受付期間は<b>1〜4日ほど</b>と短い回が多いです（例：7/14 12:00〜7/15 23:59）。</li><li>結果は<b>メール</b>で知らされ、当選メールのリンクから購入手続きをします。発売日以降に順次連絡が来た回もあります。購入期限は当選メールに書かれています。</li><li>当選メールが迷惑メールに入ることがあるので、迷惑メールフォルダも確かめてください。</li></ul>
      - h: 店頭QRの抽選（店舗受け取り）
        html: <ul><li>店頭に掲示された<b>QRコード</b>から申し込みます。30周年の商品では、申し込み先がチケットサイト「<b>LivePocket</b>」だった回があります。</li><li>当選のお知らせはLivePocket上で行われ、<b>店頭での当選発表はありません</b>でした。</li><li>当選したら、<b>発売日から数日の購入期間</b>に店舗で購入します（例：9/16〜9/20）。</li><li>発売日当日に店頭で抽選を受け付けた回もあります（例：当日10:00〜10:15受付、13:00以降発表）。入荷のない店舗もあるので、店頭のPOPを確かめてください。</li></ul>
    faq:
      - ["イトーヨーカドーのポケカ抽選はどこから応募しますか？", "ネット通販の抽選は、イトーヨーカドーのネット通販サイトから7iDで応募します。店頭QRの抽選は、お店に掲示されたQRコードから申し込みます。回によって実施されるものが違います。"]
      - ["ネット通販の抽選に必要なものは？", "7iDの会員登録と、二要素認証用の電話番号の設定が必要です。応募前にマイページで設定しておきましょう。"]
      - ["店頭QRの抽選の結果は店で発表されますか？", "30周年の商品では、LivePocket上でお知らせがあり、店頭での当選発表はありませんでした。申し込んだサイトで確かめてください。"]
    sources:
      - ["トレカマップ（イトーヨーカドーの抽選）", "https://torecamap.co.jp/column/itoyokado-lottery/"]
