    title: カードラボのポケカ抽選のやり方｜店舗ごとのX応募・当選はDMで連絡・店頭での予約
    h1: カードラボ各店の抽選のやり方
    desc: トレカ専門店カードラボのポケカ抽選について、店舗ごとの公式Xでの応募方法（フォロー＆リポスト）、当選の連絡（DM）、当選後の店頭での手続き、購入数の上限をまとめました。受付中の抽選の一覧つき。
    intro: トレカ専門店の<b>カードラボ</b>では、新弾のBOXを<b>店舗ごとの事前抽選</b>で販売します。抽選の分は店頭での一般販売がないので、ほしい店舗の抽選に応募しておく必要があります。
    sections:
      - h: 応募のしかた
        html: <ul><li>抽選は<b>店舗ごと</b>に行われます。応募方法は<b>各店舗の公式X</b>で告知されます。</li><li>応募したい店舗のXアカウントを<b>フォローして、応募用の投稿をリポスト</b>する形だった回があります。店舗ごとに投稿が違うので、予約したい店舗のものを選びます。</li><li>受付期間は<b>3〜7日ほど</b>だった回があります（例：7/1〜7/5、9/2〜9/8）。</li><li>複数の店舗がまとめて同じ期間に受け付けることもあります。</li></ul>
      - h: 当選の連絡と購入
        html: <ul><li>当選者には、受付終了後の数日間に<b>XのDM</b>で連絡が来た回があります（例：10/8締切→10/9〜10/13に連絡）。発表が「〇日〜〇日」と幅をもって告知されることが多いです。</li><li>当選しただけでは終わりません。<b>店舗に行って予約（購入）の手続き</b>をする必要があった回があります。</li><li>購入できる数は<b>1名につき各1BOXまで</b>だった回があります。</li><li>抽選の分は、<b>店頭での一般販売はない</b>と案内されています。</li></ul>
    faq:
      - ["カードラボのポケカ抽選はどこから応募しますか？", "店舗ごとに行われます。応募したい店舗の公式Xをフォローして、応募用の投稿をリポストする形だった回があります。店舗ごとに投稿が違うので注意してください。"]
      - ["当選はどうやって分かりますか？", "XのDMで連絡が来た回があります。発表期間は数日の幅をもって告知されるので、DMをこまめに確かめてください。"]
    sources:
      - ["AppBank（カードラボのポケカ予約抽選）", "https://www.appbank.net/2023/10/04/tcg/2583444.php"]
