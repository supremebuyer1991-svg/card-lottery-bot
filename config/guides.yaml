  - slug: joshin
    name: ジョーシン
    store_re: "ジョーシン|Joshin"
    short: ジョーシンの抽選のやり方・応募の条件
    title: ジョーシン（Joshin web）の抽選のやり方｜応募条件・当選の連絡・支払い期限
    h1: ジョーシン（Joshin webショップ）の抽選のやり方
    desc: Joshin webショップの抽選販売の応募条件（会員ランク・メルマガ）、応募方法、当選の連絡と支払いの期限をまとめました。受付中の抽選の一覧つき。
    intro: ジョーシンのネット通販「Joshin webショップ」の抽選は、会員ランクなどの条件があり、案内メールから応募する形です。
    sections:
      - h: 応募の条件と応募のしかた
        html: <ul><li><b>プラチナ会員・VIPスマイル会員</b>であることが条件です。</li><li><b>メールマガジンを受け取っている</b>ことが条件です。</li><li>同じ商品をすでに当選・購入している人は応募できません。</li><li>応募は、届いた<b>案内メールから</b>だけできます。</li></ul>
      - h: 当選の連絡と支払い
        html: <ul><li>当選した人にだけ、<b>メールと「連絡帳」</b>で知らされます。</li><li>期限内に決済しないと、当選が取り消されます。</li></ul>
    faq:
      - ["ジョーシンの抽選に応募する条件は？", "プラチナ会員・VIPスマイル会員で、メールマガジンを受け取っていることが条件です。応募は案内メールからだけできます。"]
      - ["当選はどうやって分かりますか？", "当選した人にだけ、メールと連絡帳で知らされます。期限内に決済しないと取り消しになります。"]
    sources:
      - ["Joshin webショップ 抽選販売について", "https://joshinweb.jp/toy/c_chusen.html"]

  - slug: premium-bandai
    name: プレミアムバンダイ
    game: onepiece
    store_re: "プレミアムバンダイ|プレバン|バンダイカードショップ"
    short: プレミアムバンダイの抽選のやり方・注意点
    title: プレミアムバンダイのワンピースカード抽選のやり方｜1次・2次抽選の注意点
    h1: プレミアムバンダイの抽選のやり方と注意点
    desc: プレミアムバンダイ（バンダイカードショップ）のワンピースカード抽選の注意点（1次・2次抽選、購入数の上限、当選発表の時期）をまとめました。受付中の抽選の一覧つき。
    intro: ワンピースカードの新弾やセットは、プレミアムバンダイ（バンダイカードショップ）で抽選販売になることがあります。
    sections:
      - h: 抽選のしくみと注意点
        html: <ul><li>1次抽選・2次抽選がある場合、<b>1次抽選に当選した人は2次抽選に応募できません</b>。</li><li>購入できる数は「<b>おひとりさまにつき各商品1個まで</b>」のように決められていることがあります。</li><li>当選の発表は「8月上旬」のように、<b>時期だけ</b>告知されることが多いです。</li></ul>
    faq:
      - ["プレミアムバンダイの2次抽選に応募できますか？", "1次抽選に当選した人は、2次抽選には応募できません。"]
      - ["当選発表はいつですか？", "「〇月上旬」のように時期だけ告知されることが多いです。告知をこまめに確認してください。"]
    sources:
      - ["インサイド", "https://www.inside-games.jp/article/2026/10/14/189214.html"]
      - ["インサイド", "https://www.inside-games.jp/article/2026/08/02/185571.html"]
