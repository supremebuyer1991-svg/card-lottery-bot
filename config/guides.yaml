    title: キデイランドのポケカ・ワンピースカード抽選の応募方法｜必要なもの（LivePocket）・当選発表・受け取り方
    h1: キデイランドの抽選の応募方法と受け取り方（LivePocket）
    desc: キデイランドのポケカ抽選販売について、LivePocketでの購入券の応募方法、会員登録の注意（本名・生年月日）、当選メール、QRコードチケットと身分証を使った店頭での買い方、代理不可などの注意点をまとめました。受付中の抽選の一覧つき。
    intro: キデイランドのポケカ抽選は、チケットサービスの<b>LivePocket（ライブポケット）</b>で、店舗ごとの「<b>購入券</b>」に応募する形です。当選すると<b>QRコードのチケット</b>が手に入り、決められた日にその店舗のレジで身分証といっしょに見せて買います。抽選をする店舗や日程は店舗によってちがいます。応募前に各店舗の告知を確認してください。
    sections:
    - h: 応募のしかた
      html: <ul><li>LivePocketにある<b>店舗ごとの抽選ページ</b>から応募します。応募にお金はかかりません（無料）。</li><li>先着順ではありません。受付期間のあいだなら、<b>いつ応募しても当たりやすさは同じ</b>と書かれています。受付開始の直後はつながりにくいことがあるので、時間をずらしても大丈夫です。</li><li>応募は<b>買いたい本人が1回だけ</b>です。名前を入れかえた重ねての応募や、ほかの人の名前を使った応募は無効になります。</li><li>受付期間は<b>3日間ほど</b>だった回があります（例：9/1 10:00〜9/3 23:59）。</li></ul>
    - h: 必要なもの
      html: <ul><li><b>LivePocketの会員登録（無料）</b>：<b>本名と正しい生年月日</b>で登録します。名前に★や♡などの記号が入っていると無効になります。</li><li><b>身分証</b>：名前と生年月日が分かるもの（運転免許証・マイナンバーカード・学生証・在留カードなど）。</li><li><b>当選のQRコードチケット</b>：LivePocketで表示します。<b>1回しか使えず、再発行はありません</b>。</li></ul>
    - h: 当選の発表と受け取り
      html: <ul><li>当選の結果は、決められた日の<b>18時ごろまで</b>に、登録した<b>メールアドレス</b>に届きます。</li><li>購入券には<b>使える期間</b>があり、<b>3日間</b>だった回があります（例：9/11〜9/13）。期間を過ぎると無効で、延長や取り置きはできません。</li><li>買うときは、応募した店舗の<b>売場レジ</b>で身分証とQRコードチケットを見せます。名前と生年月日が合っていれば、そのままお会計です。</li><li>買える数は<b>購入券1枚につき1BOX分（30パック）まで</b>だった回があります。</li><li>店舗によって引き取りの日程がちがうことがあります。応募前に各店舗の告知を確認してください。</li></ul>
    - h: 注意すること
      html: <ul><li><b>当選した本人しか買えません</b>。代理での来店や、いっしょに来た人の分の購入はできません。</li><li>購入券を<b>ゆずること・転売することは禁止</b>です。</li><li>スマホをなくした・こわれたなどでQRコードを表示できないと、買えません。当日は充電にも気をつけましょう。</li><li><b>返品・交換はできません</b>。</li><li>災害などでお店が休みになると購入券が無効になることがあり、交通費などは出ません。</li><li>ワンピースカードの抽選をするかどうか・やり方は店舗によってちがいます。応募前に各店舗の告知を確認してください。</li></ul>
    faq:
    - - キデイランドのポケカ抽選はどこから応募しますか？
      - LivePocket（ライブポケット）にある店舗ごとの抽選ページから、無料で応募します。LivePocketの会員登録が必要で、本名と正しい生年月日で登録します。
    - - 当選したら何を持っていけばいいですか？
      - 名前と生年月日が分かる身分証と、LivePocketの当選QRコードチケットです。レジで照らし合わせて、合っていればお会計になります。
    - - 家族や友だちに代わりに買ってもらえますか？
      - できません。当選した本人だけが買えます。購入券をゆずることや、使える期間をのばすこともできません。
    sources:
    - - LivePocket キデイランド二子玉川店 ポケモンカード購入券抽選ページ
      - https://livepocket.jp/e/gryr4
    - - AppBank（キデイランドの抽選予約・LivePocketでの応募）
      - https://www.appbank.net/2023/10/13/tcg/2591884.php
