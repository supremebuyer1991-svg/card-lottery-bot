# ゲーム・ホビー入荷速報：自分で見つけた抽選・予約・再入荷を手で追加する場所
# ここに書くと、次の実行でサイトに載り、個別ページ（ https://game-nyuka.com/l/<slug>/ ）が作られます。
#
# 書き方
#   game    … カテゴリ（config/game/categories.yaml の id：ps5 / switch2 / handheld_pc / game_limited / fukubukuro / gunpla / pokecen / beyblade / figure / ichibankuji / chiikawa / lego / tomica）
#   kind    … 種類：lottery（抽選）/ invite（招待）/ preorder（予約）/ restock（再入荷）/ first_come（先着）/ fukubukuro（福袋）/ release（発売日・再販日）
#   store   … お店の名前（release のときはメーカー名でOK）
#   product … 商品名、series … 機種・モデル名（例 PS5 Pro）
#   channel … online（発送）/ store（店頭受取）
#   start / end … 受付開始・締切（2026-11-19T10:00 のように「年-月-日T時:分」）。release は end に発売日を書く
#   price   … 定価（税込・文字列。例 "119,980円"）※転売・フリマの値段は書かない
#   tags    … 条件（会員 / アプリ / 本人確認 / 購入履歴 / プレイ時間 / PSN必須 / NSO加入 / 前回落選者優先 / 1人1台 / ソフト同時購入 / 要予約金）
#   url     … 応募・予約ページ
# 締切を過ぎると自動で「受付終了」になります。終わったものはここから消してOK。

# ---- 書き方の見本（コメントのままなので載りません。URL・日付・値段を公式で確かめてから # を外す）----
