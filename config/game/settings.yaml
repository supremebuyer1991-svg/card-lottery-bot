# ゲーム・ホビー入荷速報（game-nyuka.com）の動作設定
# ※ トレカ抽選ナビの設定（config/settings.yaml）とは別。SITE=game のときだけ読まれる
# カテゴリ（PS5・ガンプラ など）は config/game/categories.yaml に書く（game_names はそこから自動で入る）

auto_approve: true        # true=見つけたらサイトに載せる（Xへの自動投稿はこのサイトでは無し）
dry_run: false
x_speed_post: true         # 新しい抽選・予約・再入荷をXで速報（@a9994aaa。リンクなし＋商品写真、1件 約$0.015）
x_speed_per_day: 5         # 速報の1日の上限（毎日の決まった投稿はXの予約投稿で別に入れる）
x_speed_gap_min: 20        # 前の速報から何分あけるか
x_urgent_end_hours: 24     # 締切まで何時間以内なら「急ぎ」＝速報（それより先は予約投稿に回す）
x_urgent_start_hours: 3    # 受付開始まで何時間以内なら「急ぎ」
x_speed_hobby_per_day: 1   # ホビーの速報は1日この本数まで（ゲームが本業のアカウント。ホビーの速報でフォロワーが減ったため 11/8 に2→1）
premium_teika_per_run: 15  # 定価以上で売れる商品：楽天ブックスで定価を調べる数（1回あたり・同じ商品は7日に1回）
kaitori_per_run: 4         # 買取ルデヤで新品の買取価格を調べる数（1回あたり。同じ商品は24時間に1回）
x_exclude_games: [ichibankuji]   # Xに投稿しないカテゴリ（11/9 ユーザーの指示：一番くじの投稿はいらない）。サイトには載せる
x_speed_link: true         # 1件だけの速報で、その商品のAmazon・楽天（アフィリエイト）のページがあればリンクを付ける（PR表記つき・1件 約$0.20）
min_confidence: 0.7       # AI抽出の自信度がこれ未満は承認待ち（GitHubのIssue）
max_posts_per_run: 0      # Xの自動投稿は使わない（下書きページ /x-draft.html からコピペで手動投稿）
big_post: false
remind_hours_before: 24
run_hours: [7, 10, 13, 17, 19, 22]   # 自動の実行の時刻（run.yml の cron と同じ・1日6回）
collect_time_budget: 150   # 情報集めは150秒まで。超えたら読んだ所までを保存して、残りは次の回に（サイト作りの時間を残すため）
via_jp_hosts: ["geo-online.co.jp"]   # GitHubからは断られるので、日本の中継（Cloudflare Worker jp-fetch）経由で読むお店
job_tail_sec: 90           # 抽選集めのあとに残しておく秒数（買取価格の読み取り・サイト作り・公開）
rss_read_article: true       # ニュースのRSSは記事を開いて本文まで読む（締切・プレバンの商品ページなどの応募先を拾うため）
rss_article_max_per_run: 24  # 1回に開く記事の数の上限（時間と費用の上限。時間は collect_time_budget でも止まる）
rss_article_per_source: 3    # 1つの情報元で開く記事の数の上限（最初の情報元で使い切らないように）
page_checks_per_run: 6   # 応募ページが終わっていないか見る数（1回あたり。17件で約90秒かかったため 11/9 に少なく）
deadline_checks_per_run: 3   # 締切が分からない抽選を応募ページで調べる数（1回あたり。8件で約90秒かかったため 11/9 に少なく）
no_end_post_days: 10
no_end_expire_days: 10      # 締切が書かれていない抽選・予約は、見つけてからこの日数で終了に
no_end_start_days: 14
no_deadline_kind_days: 3    # 再入荷・先着（締切という考えがない）は、見つけてからこの日数で一覧から外す
purge_closed_days: 2
max_entry_days: 120         # 予約は発売日まで長く受け付けることがあるので、トレカ（90日）より長め

# --- X API（従量課金）：このサイトでは使わない（sources.yaml の X は enabled: false）---
x_read_budget_per_day: 0
x_read_budget_peak: 0
x_peak_days_before: 0
x_read_budget_by_date: {}
post_link: false
quote_source: false
summary_hours: []
trend_hours: []
buzz_hour:
market_hour:
deadline_post: false

# --- サイト ---
site_name: ゲーム・ホビー入荷速報
site_name_en: GAME & HOBBY RESTOCK NEWS
site_tagline: 定価で買いたいファンのための抽選・予約・再入荷情報
site_public_url: "https://game-nyuka.com"   # 独自ドメイン（Cloudflare Pages の project は run.yml の CF_PROJECT_GAME）
theme_color: "#1b3a5c"      # 濃いネイビー（トレカ抽選ナビの赤とは別のブランド）
accent_color: "#0f8b8d"     # ティール
ga_id: ""                   # Googleアナリティクスの測定ID（取ったら入れる。空なら入れない）
google_site_verification: ""   # Search Console の確認コード（取ったら入れる）
indexnow_key: "a0f3c6d1e9b24f7a8c5d1e2f3a4b5c6d"   # IndexNow の鍵（変えなくてOK）
x_account: ""               # このサイト用のXアカウントID（@なし）。入れると「Xをフォロー」のボタンが出る   # TODO: オーナーが決める
site_url: ""                # WordPress は使わない（空のまま）

# アフィリエイト
amazon_tag: ""              # Amazonアソシエイトのトラッキングタグ（例 xxxx-22）。このサイト用に登録したら入れる   # TODO: オーナーが確認
rakuten_affiliate_id: ""    # 楽天アフィリエイトID（このサイトをサイト登録してから）   # TODO: オーナーが確認
                            # ※空なら GitHub の Variable「RAKUTEN_AFFILIATE_ID_GAME」→ トレカと同じ「RAKUTEN_AFFILIATE_ID」を使う
                            # ※amazon_tag も空なら「AMAZON_TAG_GAME」→ トレカと同じ「AMAZON_TAG」を使う
# カードの商品写真と「楽天で見る」（楽天ブックスのその商品のページ。売り切れでも入荷お知らせを登録できる）
# 自動で楽天ブックスを探す。手で決めたいときは manual.yaml の1件ごと／models.yaml の series_shop に rakuten_url・amazon_asin を書く
rakuten_max_calls_per_run: 15   # 1回の実行で楽天APIを呼ぶ回数の上限（Actions の時間を短く）
rakuten_refresh_hours: 24       # 同じ商品を探し直すのは24時間に1回まで（見つからなかったものも）
amazon_invite:              # トップの一番上に固定で出す「Amazonの招待リクエスト」の案内（url が空なら出さない）
  enabled: false
  label: "Amazon 招待リクエスト（PS5・Switch 2）"
  url: ""                   # TODO: オーナーが確認（Amazonの招待制販売の商品ページ or 検索URL）

# 情報元ではなく「まとめブログ」のドメイン。応募ボタンのリンク先がここなら、リンクを外す
blog_domains: [nyuka-now.com, cardchusen.com, mikeco-room.com]

# 終了にする抽選（応募先URLの一部）
closed_urls: []

# 条件のタグ（AIが付ける。絞り込みに使う）
condition_tags: [会員, アプリ, 本人確認, 購入履歴, プレイ時間, PSN必須, NSO加入, 前回落選者優先, 1人1台, ソフト同時購入, 要予約金, 店舗クレカ, SNS応募, 整理券]

# 種類ごとの表示名（プログラム側にもあるが、ここで上書きできる）
kind_names:
  lottery: 抽選
  invite: 招待
  preorder: 予約
  restock: 再入荷
  first_come: 先着
  fukubukuro: 福袋
  release: 発売・再販

# LivePocket常連店の仕組みは使わない
lp_shops_enabled: false
threads_each: false

# 見張り（health.py）で開けるか確かめるページ
health_paths: ["/", "/ps5/", "/now/"]

# 買取相場：1回の実行で読む店の数（店が15に増えたので3。各店1日1回）
kaitori_stores_per_run: 3
