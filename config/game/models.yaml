# 機種・モデル（series）のページ設定（/<カテゴリ>/<モデルのslug>/）
# series_aliases … 同じモデルの別の呼び方 → まとめる名前（別名ごとに薄いページができないように）
# series_slugs   … ページのアドレス（英数字とハイフン）。ここに無い日本語名は自動の記号になる
# series_info    … 発売日・定価（公式サイトで確かめたものだけ書く。分からなければ書かない）
#
# ※ 値段・発売日は、このファイルを書いた時点では確認できていないので空です（TODO: オーナーが公式サイトで確認して入れる）

series_aliases:
  ps5:
    PlayStation 5 Pro: PS5 Pro
    PlayStation5 Pro: PS5 Pro
    プレステ5 Pro: PS5 Pro
    PS5Pro: PS5 Pro
    PlayStation 5: PS5 本体
    PlayStation5: PS5 本体
    プレステ5: PS5 本体
    PS5 デジタル・エディション: PS5 デジタル・エディション
    PS5 Digital Edition: PS5 デジタル・エディション
    PS5 ミッドナイトブラック: PS5 ミッドナイト ブラック
    PlayStation 5 ミッドナイト ブラック: PS5 ミッドナイト ブラック
  switch2:
    Nintendo Switch 2: Switch 2 本体
    Nintendo Switch2: Switch 2 本体
    ニンテンドースイッチ2: Switch 2 本体
    スイッチ2: Switch 2 本体
    Nintendo Switch 2 マリオカート ワールド セット: Switch 2 マリオカート ワールド セット
  handheld_pc:
    Steam Deck OLED: Steam Deck
    スチームデック: Steam Deck
    ROG Xbox Ally: ROG Ally

series_slugs:
  ps5:
    PS5 Pro: ps5-pro
    PS5 本体: ps5
    PS5 デジタル・エディション: ps5-digital-edition
    PS5 ミッドナイト ブラック: ps5-midnight-black
  switch2:
    Switch 2 本体: switch2
    Switch 2 マリオカート ワールド セット: switch2-mario-kart-world-set
  handheld_pc:
    Steam Deck: steam-deck
    ROG Ally: rog-ally
    Legion Go: legion-go
  fukubukuro:
    夢のお年玉箱 2027: yodobashi-otoshidama-2027

series_info: {}

# スニダンの相場（サイトに「スニダン相場 ○円（定価比 +○%）」を出す）。snkr＝スニダンの商品番号（https://snkrdunk.com/apparels/○○ の数字）、
# teika＝定価（税込・円。公式発表で確かめたもの）。11/8：PS5は4/2の価格改定後、Switch 2は5/25の価格改定後の値段
series_souba:
  ps5:
    PS5 Pro: {snkr: 857663, teika: 137980}
    PS5 デジタル・エディション: {snkr: 726560, teika: 55000}
  switch2:
    Switch 2 本体: {snkr: 558579, teika: 59980}
    Switch 2 マリオカート ワールド セット: {snkr: 558580}
#  ps5:
#    PS5 Pro: {release: "", type: 本体, price: ""}   # TODO: オーナーが公式で確認して入れる（税込の定価）

# 機種・モデルごとの「楽天で見る」「Amazonで見る」（そのモデルの抽選・予約・発売のカード全部に出る。1件ごとの manual.yaml の指定が優先）
#   rakuten_url … 楽天の「その商品のページ」（検索結果のページは不可）。amazon_asin … AmazonのASIN（10文字）。jan … JANコード
# 例：
# series_shop:
#   ps5:
#     PS5 Pro: {rakuten_url: "https://books.rakuten.co.jp/rb/00000000/", amazon_asin: "B000000000"}   # TODO: オーナーが確認
series_shop: {}

# モデルごとの常設まとめ（11/14 ユーザー「A、OK」・Fable の監査の施策8）。
# 受付が終わっても消さない（受付が無いときも、これまでの記録・該当商品の買取相場と販売状況を出す）。
#   game … カテゴリ、name … 表示名、path … ページのアドレス（前からあるモデルのページと同じなら、そのページに足す）
#   match … 商品名に当てる正規表現、require … これも入っていること（任意）、exclude … これが入っていたら外す（任意）
# 出す条件：当てはまる商品（JAN）が2つ以上、または受付の記録が1件以上
hubs:
  - {game: pc_parts, name: "GeForce RTX 5090", path: pc-parts/rtx-5090/, match: "RTX ?5090"}
  - {game: pc_parts, name: "Ryzen X3D（5800X3D・7800X3D・9800X3D など）", path: pc-parts/ryzen-x3d/, match: "\\d{4}X3D"}
  - {game: ps5, name: "PS5 Pro", path: ps5/ps5-pro/, match: "PS5 ?Pro|PlayStation ?5 ?Pro|プレイステーション ?5 ?Pro|CFI-7\\d{3}", exclude: "コントローラ|DualSense|カバー|ケース|スタンド"}
  - {game: ps5, name: "PS5 ミッドナイト ブラック", path: ps5/ps5-midnight-black/, match: "ミッドナイト ?ブラック", require: "PS5|PlayStation ?5|プレイステーション ?5", exclude: "コントローラ|DualSense|カバー|Portal|リモート|ヘッドセット|PULSE"}
  - {game: ps5, name: "PlayStation Portal", path: ps5/playstation-portal/, match: "PlayStation ?Portal|リモートプレーヤー"}
  - {game: switch2, name: "Switch 2 本体", path: switch2/switch2/, match: "Switch ?2|スイッチ ?2", require: "本体|セット|日本語・国内専用", exclude: "ソフト|コントローラ|ケース|microSD|カメラ|充電|ドック|フィルム|amiibo|Proコン"}
  - {game: liquor, name: "山崎（サントリー シングルモルトウイスキー）", path: liquor/yamazaki/, match: "山崎", exclude: "まさよし"}
  - {game: liquor, name: "響（サントリー ウイスキー）", path: liquor/hibiki/, match: "響 ?(JAPANESE|ジャパニーズ|BLOSSOM|ブロッサム|BLENDER|ブレンダー|\\d+年)|サントリー ?(ウイスキー ?)?響"}
  - {game: liquor, name: "白州（サントリー シングルモルトウイスキー）", path: liquor/hakushu/, match: "白州"}
  - {game: gunpla, name: "ガンダムベース限定ガンプラ", path: gunpla/gandamubesu-9967d/, match: "ガンダムベース"}
