    - ["GeForce RTX 5090 Founders Edition搭載PCがパソコン工房から登場（PC Watch、2026年4月30日）", "https://pc.watch.impress.co.jp/docs/news/2105762.html"]
    - ["グラボ高騰止まらず、RTX 5090はついに100万円を超え始める（AUTOMATON、2026年9月11日）", "https://automaton-media.com/articles/newsjp/20260911-466913/"]
    - ["通常価格の120万円台に高騰したGeForce RTX 5090（ITmedia PC USER、2026年11月7日）", "https://www.itmedia.co.jp/pcuser/articles/2611/07/news011.html"]
    - ["GeForce RTX 5090搭載グラボに50万円超の幅、そのワケは？（ITmedia PC USER、2026年11月14日）", "https://www.itmedia.co.jp/pcuser/articles/2611/14/news013.html"]
