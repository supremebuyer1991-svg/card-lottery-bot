switch2/switch2/:
  checked: "2026-11-22"
  title: "Switch 2はどこで買える？抽選・再販・在庫の状況まとめ【{md}更新】"
  desc: "Nintendo Switch 2を定価で買う方法。マイニンテンドーストアの購入条件（多言語対応版はプレイ50時間）、値上げ（59,980円）、これまでの抽選・招待・先着販売の流れ、いま受付中の抽選と新品の買取価格をまとめています。"
  h1: "Switch 2はどこで買える？抽選・再販・在庫の状況"
  summary:
    - "定価（日本語・国内専用）は<b>59,980円</b>（2026年5月25日に49,980円から値上げ）。多言語対応版は69,980円のまま。"
    - "マイニンテンドーストアでは、<b>日本語・国内専用は購入条件なし</b>（1アカウント1台）。多言語対応版は「2026年5月31日時点でSwitchのプレイ時間50時間以上」が条件。"
    - "在庫は随時追加。ただし<b>追加の日時や通知は出ない</b>と任天堂が案内しています。"
    - "家電量販店・Amazon・楽天は入荷のたびに先着や抽選。下に、いま受付中の抽選と新品の買取価格を毎日更新で載せています。"
  sections:
    - h: "いまの買い方（2026年11月時点）"
      html: >-
        <p>いちばん確実に定価で買えるのは、任天堂の公式通販<b>マイニンテンドーストア</b>です。2026年5月25日から、日本語・国内専用モデルは購入条件（プレイ時間）がなくなり、ニンテンドーアカウントがあれば1台買えるようになりました（過去の抽選・招待販売で買った分も1台に数えます）。</p>
        <p>一方、<b>多言語対応モデル</b>は、値上げで日本語版より安くなったことから買い占めが疑われる注文が続き、2026年6月11日に販売をいったん止めて「2026年5月31日23時59分時点で、Nintendo Switchのプレイ時間が50時間以上」という条件を付けて再開しました。</p>
        <p>マイニンテンドーストアの在庫は「随時追加」ですが、任天堂は<b>追加の日時の問い合わせには答えず、アプリ通知もしない</b>としています。売り切れていたら、こまめに見に行くのが基本です。</p>
    - h: "値段（定価）"
      html: >-
        <div class="xtbl"><table><thead><tr><th>モデル</th><th>発売時</th><th>いま（2026年5月25日〜）</th></tr></thead><tbody>
        <tr><td>Nintendo Switch 2（日本語・国内専用）</td><td>49,980円</td><td><b>59,980円</b></td></tr>
        <tr><td>Nintendo Switch 2（多言語対応）※マイニンテンドーストア限定</td><td>69,980円</td><td>69,980円（据え置き）</td></tr>
        </tbody></table></div>
        <p>同じ日に、Switch（有機ELモデル）は47,980円、Switchは43,980円、Switch Liteは29,980円に上がっています。<b>定価より高い値段で売っている出品者</b>もいるので、Amazon・楽天では「販売元」と値段を必ず確かめてください。</p>
    - h: "これまでの販売の流れ"
      html: >-
        <ul class="tl">
        <li><b>2025年4月</b>　マイニンテンドーストアの最初の抽選に、日本だけで約220万人が応募（任天堂の発表）。用意した台数を大きく超えた。</li>
        <li><b>2025年6月5日</b>　発売（日本語・国内専用 49,980円）。量販店・通販は抽選販売が中心に。</li>
        <li><b>2025年秋</b>　マイニンテンドーストアは、抽選に外れた人向けの<b>招待販売</b>に切り替え。10月20日に全員への案内を終えた。</li>
        <li><b>2026年2月6日〜</b>　マイニンテンドーストアで初めての<b>先着販売</b>（条件：2025年12月21日時点でSwitchのプレイ50時間以上。Switch Online加入は不要）。</li>
        <li><b>2026年5月8日</b>　値上げを発表。発表直後は駆け込みで、通販・店頭とも売り切れが相次いだ。</li>
        <li><b>2026年5月25日</b>　値上げ（59,980円）。同じ日にマイニンテンドーストアの購入条件からプレイ時間がなくなる。</li>
        <li><b>2026年6月11日</b>　多言語対応版だけ、買い占めの疑いでいったん停止 → プレイ50時間の条件を付けて再開。</li>
        </ul>
    - h: "定価で買うためのコツ"
      html: >-
        <ul>
        <li><b>マイニンテンドーストアを最初に見る</b>：日本語・国内専用は条件なしで買えます。在庫の追加は予告なし。</li>
        <li><b>量販店の抽選は「会員・アプリ」が条件のことが多い</b>：ビックカメラ・ヨドバシ・ノジマ・ゲオなどは、会員登録やアプリが応募の条件になりがちです。先に登録しておくと、受付が始まってすぐ応募できます。</li>
        <li><b>Amazonは販売元を確認</b>：「販売元：Amazon.co.jp」以外は定価より高いことがあります。</li>
        <li><b>セット商品に注意</b>：ソフトや周辺機器とのセットは、本体単品より高くなります。必要なものか確かめてから。</li>
        <li><b>入荷のお知らせを受け取る</b>：このサイトのX（@a9994aaa）で、楽天ブックス・Amazonで販売が始まったらすぐお知らせしています。</li>
        </ul>
  faq:
    - ["Switch 2はいくらですか？", "日本語・国内専用モデルの希望小売価格は59,980円（税込）です。2026年5月25日に49,980円から値上げされました。マイニンテンドーストア限定の多言語対応モデルは69,980円のままです。"]
    - ["マイニンテンドーストアでSwitch 2を買うのに条件はありますか？", "日本語・国内専用モデルは、2026年5月25日からプレイ時間の条件がなくなり、1つのニンテンドーアカウントにつき1台買えます。多言語対応モデルは、2026年5月31日23時59分時点でNintendo Switchのプレイ時間が50時間以上であることが条件です（2026年6月11日から）。"]
    - ["マイニンテンドーストアの在庫はいつ追加されますか？", "任天堂は「在庫は随時追加予定」としていますが、追加の日時の問い合わせには答えず、アプリでの通知もしないと案内しています。"]
    - ["Switch 2 マリオカート ワールド セットはまだ買えますか？", "マイニンテンドーストアでは2025年内の期間限定生産で、2026年以降の販売予定はないと案内されています。お店に残っている在庫や中古を探すことになります。"]
  sources:
    - ["任天堂：価格変更のお知らせ（2026年5月8日）", "https://www.nintendo.co.jp/corporate/release/2026/260508.html"]
    - ["マイニンテンドーストア：Nintendo Switch 2 特集", "https://store-jp.nintendo.com/switch2/"]
    - ["ファミ通：マイニンテンドーストアの購入条件変更（2026年5月25日）", "https://www.famitsu.com/article/202605/75886"]
    - ["ITmedia：多言語版の買い占めでプレイ50時間の条件が復活（2026年6月）", "https://www.itmedia.co.jp/mobile/amp/2606/12/news065.html"]
    - ["AV Watch：マイニンテンドーストアで先着販売へ（2026年1月28日）", "https://av.watch.impress.co.jp/docs/news/2081638.html"]
    - ["ファミ通：マイニンテンドーストアで販売再開・在庫は随時追加（2026年5月19日）", "https://www.famitsu.com/article/202605/75253"]

ps5/ps5-pro/:
  checked: "2026-11-22"
  title: "PS5 Proはどこで買える？抽選・再販・在庫の状況まとめ【{md}更新】"
  desc: "PS5 Pro（CFI-7100B01）を定価137,980円で買う方法。ソニーストアの抽選販売の条件（PS5/PS4のプレイ60時間以上）と日程、値上げの経緯、品薄の理由、いま受付中の抽選と新品の買取価格をまとめています。"
  h1: "PS5 Proはどこで買える？抽選・再販・在庫の状況"
  summary:
    - "定価は<b>137,980円</b>（2026年4月2日に119,980円から値上げ）。"
    - "ソニーストアは「入荷待ち」で、<b>抽選販売</b>のかたち。2026年秋の抽選は「過去2年でPS5/PS4のプレイ合計60時間以上」が応募条件でした。"
    - "当選者が期限までに買わなかった分は、<b>落選した人を対象に再抽選</b>（11月以降）と案内されています。"
    - "Amazonは販売元Amazon以外だと定価よりかなり高いことがあります。下に、いま受付中の抽選と新品の買取価格を毎日更新で載せています。"
  sections:
    - h: "いまの買い方（2026年11月時点）"
      html: >-
        <p>PS5 Pro（CFI-7100B01）は、2026年4月の値上げのあと入荷待ちが増え、5月以降は品薄が続いています。メーカー直販の<b>ソニーストア</b>では通常の販売が「入荷待ち」になっていて、<b>抽選販売</b>で買うかたちです。</p>
        <p>2026年秋のソニーストアの抽選は、応募が10月7日23時59分まで、当選の連絡が10月26日ごろから、購入の期限が11月2日11時59分まででした。期限までに買われなかった分は、<b>11月以降に、条件を満たして落選した人を対象に再抽選</b>すると案内されています。</p>
        <p>家電量販店や通販は、入荷したときの先着販売や、店ごとの抽選・招待販売です。受付はこのページの上の一覧に載せています。</p>
    - h: "ソニーストアの抽選の応募条件"
      html: >-
        <ul>
        <li>応募に使うアカウントで、<b>過去2年間にPS5・PS4で合計60時間以上</b>ゲームをプレイしていること。</li>
        <li>応募の数が販売の予定数を超えたら抽選。当選した人だけが専用ページから買えます。</li>
        </ul>
        <p>今から始めた人は、プレイ時間が足りず対象外になることがあります。次の抽選に備えるなら、ふだん使うアカウントで遊んでおくのが近道です（条件は回ごとに変わることがあるので、毎回ソニーストアの告知を確かめてください）。</p>
    - h: "値段の移り変わり"
      html: >-
        <div class="xtbl"><table><thead><tr><th>時期</th><th>希望小売価格（税込）</th></tr></thead><tbody>
        <tr><td>2024年11月7日（発売）</td><td>119,980円</td></tr>
        <tr><td>2026年4月2日〜</td><td><b>137,980円</b>（18,000円の値上げ）</td></tr>
        </tbody></table></div>
        <p>ディスクドライブは別売りです。パッケージ版のソフトを遊ぶなら、ディスクドライブの分も予算に入れておきましょう。</p>
    - h: "なぜ品薄なの？"
      html: >-
        <p>2026年はメモリーなどの部品の値上がりがゲーム機全体に響いていて、PS5 Proは追加のメモリーを積んでいる分、作るのにお金がかかります。海外の報道では、ソニーが販売店に対して「PS5 Proの在庫は限られ、<b>早くても2027年初めまで続く見通し</b>」と伝えたとされています。当面は「入荷したらすぐ売り切れる」状態が続くと考えておくのが安全です。</p>
    - h: "定価で買うためのコツ"
      html: >-
        <ul>
        <li><b>ソニーストアの抽選を逃さない</b>：応募の条件（プレイ時間）を早めに満たしておく。</li>
        <li><b>量販店の抽選・招待</b>：ノジマ・ソフマップ・ビックカメラなどで過去に抽選や招待販売がありました。会員登録を済ませておくとすぐ応募できます。</li>
        <li><b>Amazonは販売元を確認</b>：販売元がAmazon.co.jp以外だと、定価より大幅に高いことがあります。</li>
        <li><b>入荷のお知らせを受け取る</b>：このサイトのX（@a9994aaa）で、楽天ブックス・Amazonで販売が始まったらすぐお知らせしています。</li>
        </ul>
  faq:
    - ["PS5 Proの定価はいくらですか？", "希望小売価格は137,980円（税込）です。発売時（2024年11月7日）は119,980円で、2026年4月2日に値上げされました。"]
    - ["ソニーストアのPS5 Pro抽選の条件は？", "2026年秋の抽選では、応募するアカウントで過去2年間にPS5・PS4のゲームを合計60時間以上プレイしていることが条件でした。条件は回ごとに変わることがあるので、毎回ソニーストアの告知を確かめてください。"]
    - ["PS5 Proの品薄はいつまで続きますか？", "海外の報道では、ソニーが販売店に「早くても2027年初めまで在庫は限られる」と伝えたとされています。公式に解消の時期は発表されていません。"]
  sources:
    - ["ITmedia PC USER：ソニーストアでPS5 Proの販売再開・プレイ60時間以上が条件", "https://www.itmedia.co.jp/pcuser/articles/2609/28/news076.html"]
    - ["ソニーショップくんこく：ソニーストアのPS5 Pro抽選の日程", "https://kunkoku.jp/cfi-2200b01-13.html"]
    - ["ソニーショップ テックスタッフ：PS5 Proの購入条件と品薄の経緯", "https://tecstaff.jp/2026-09-29_ps5-pro-register-to-buy.html"]
    - ["GAZLOG：PS5 Proの抽選販売と在庫見通し", "https://gazlog.jp/entry/ps5pro-sony-store-restart-sales/"]

ps5/playstation-portal/:
  checked: "2026-11-22"
  title: "PS Portalはどこで買える？新型の予約・再販・在庫の状況まとめ【{md}更新】"
  desc: "PlayStation Portalを定価39,980円で買う方法。12月10日発売の新型「PlayStation Portal プレーヤー ミッドナイトブラック 日本語専用」と今のリモートプレーヤーのちがい、予約・再販・在庫の状況、新品の買取価格をまとめています。"
  h1: "PS Portalはどこで買える？新型の予約・再販・在庫の状況"
  summary:
    - "新型<b>「PlayStation Portal プレーヤー ミッドナイトブラック 日本語専用」が2026年12月10日発売</b>。39,980円、予約は11月13日10時から。"
    - "新型は<b>本体ストレージを搭載</b>（使い道は今後発表）し、PS Plus プレミアム1か月利用権が付属。使えるのは「国/地域」が日本のアカウントだけ。"
    - "今のリモートプレーヤー（ホワイト CFIJ-18000・ミッドナイト ブラック CFIJ-18001）も39,980円。入荷するとすぐ売り切れることが多い商品です。"
  sections:
    - h: "新型と今のモデルのちがい"
      html: >-
        <div class="xtbl"><table><thead><tr><th></th><th>リモートプレーヤー（今のモデル）</th><th>プレーヤー（新型・12月10日発売）</th></tr></thead><tbody>
        <tr><td>型番</td><td>CFIJ-18000（ホワイト）／CFIJ-18001（ミッドナイト ブラック）</td><td>（発表時点で未公表）</td></tr>
        <tr><td>希望小売価格</td><td>39,980円</td><td>39,980円</td></tr>
        <tr><td>色</td><td>ホワイト・ミッドナイト ブラック</td><td>ミッドナイトブラック</td></tr>
        <tr><td>使えるアカウント</td><td>日本以外も可</td><td>「国/地域」が日本のみ（日本語専用）</td></tr>
        <tr><td>本体ストレージ</td><td>なし</td><td>あり（用途は今後発表）</td></tr>
        <tr><td>付属</td><td>—</td><td>PS Plus プレミアム1か月利用権</td></tr>
        </tbody></table></div>
        <p>値段は同じなので、日本のアカウントで使うなら新型のほうがおトクです。海外のアカウントでも使いたい人は今のモデルを選びましょう。</p>
    - h: "いまの買い方（2026年11月時点）"
      html: >-
        <p>新型は11月13日10時から、PlayStation取扱店とECサイトで予約が始まりました。予約分が埋まると「受付終了」になり、そのあとは発売日以降の入荷待ちになります。</p>
        <p>今のリモートプレーヤーは、ソニーストアや楽天ブックス・Amazonに入荷したときの先着販売が中心です。入荷から数分で売り切れることが多いので、入荷を知る手段を持っておくのが大事です。</p>
    - h: "定価で買うためのコツ"
      html: >-
        <ul>
        <li><b>Amazonは販売元を確認</b>：「販売元：Amazon.co.jp」以外は定価より高いことがあります。</li>
        <li><b>色・モデルを決めすぎない</b>：ホワイトとミッドナイト ブラックで在庫の出方がちがうことがあります。</li>
        <li><b>入荷のお知らせを受け取る</b>：このサイトのX（@a9994aaa）で、楽天ブックス・Amazonで販売が始まったらすぐお知らせしています。</li>
        </ul>
  faq:
    - ["新型のPS Portalはいつ発売ですか？", "「PlayStation Portal プレーヤー ミッドナイトブラック 日本語専用」は2026年12月10日発売、希望小売価格は39,980円（税込）です。予約は11月13日10時から始まりました。"]
    - ["新型と今のPS Portalは何がちがいますか？", "新型は本体ストレージを搭載し（用途は今後発表）、PS Plus プレミアム1か月利用権が付属します。使えるのは「国/地域」が日本のアカウントだけです。値段は今のリモートプレーヤーと同じ39,980円です。"]
  sources:
    - ["GAME Watch：新型「PS Portal プレーヤー」が12月10日発売", "https://game.watch.impress.co.jp/docs/news/2154684.html"]
    - ["ソニーショップくんこく：新型の予約開始と今のモデルとのちがい", "https://kunkoku.jp/playstationportal-27.html"]

ps5/ps5-midnight-black/:
  checked: "2026-11-22"
  title: "PS5 ミッドナイトブラックはどこで買える？予約・再販・在庫の状況まとめ【{md}更新】"
  desc: "11月19日発売の「PS5 デジタル・エディション ミッドナイト ブラック 日本語専用」（CFI-2200B02S・55,000円）を定価で買う方法。同色のディスクドライブ、使えるアカウントの条件、予約・再販・在庫の状況と新品の買取価格をまとめています。"
  h1: "PS5 ミッドナイトブラックはどこで買える？予約・再販・在庫の状況"
  summary:
    - "<b>PS5 デジタル・エディション ミッドナイト ブラック 日本語専用（CFI-2200B02S）</b>は2026年11月19日発売、55,000円。"
    - "同色の<b>ディスクドライブ ミッドナイト ブラック（CFI-ZDD1J01）</b>も同じ日に発売、11,980円。"
    - "日本語専用モデルなので、本体言語が「日本語」・国/地域が「日本」のアカウントでしか使えません。"
  sections:
    - h: "どんなモデル？"
      html: >-
        <p>2025年11月21日に出た「PS5 デジタル・エディション 日本語専用」（ホワイト・CFI-2200B01）の色ちがいです。値段も同じ55,000円で、ディスクドライブは付いていません（ストレージは825GB）。パッケージ版のソフトを遊ぶなら、別売りのディスクドライブを付けます。</p>
        <p>PS Portal リモートプレーヤーなど、ほかの「ミッドナイト ブラック」の周辺機器と色をそろえられるのが特徴です。</p>
    - h: "いまの買い方（2026年11月時点）"
      html: >-
        <p>予約は10月20日から、日本国内のPlayStation取扱店とECサイトで順次始まりました。発売後は、楽天ブックス・Amazon・量販店への入荷ごとの先着販売や、店ごとの抽選が中心です。いま受付中のものはこのページの上の一覧に載せています。</p>
    - h: "定価で買うためのコツ"
      html: >-
        <ul>
        <li><b>型番で確かめる</b>：本体はCFI-2200B02S、ディスクドライブはCFI-ZDD1J01。ホワイト（CFI-2200B01）とまちがえないように。</li>
        <li><b>Amazonは販売元を確認</b>：「販売元：Amazon.co.jp」以外は定価より高いことがあります。</li>
        <li><b>入荷のお知らせを受け取る</b>：このサイトのX（@a9994aaa）で、楽天ブックス・Amazonで販売が始まったらすぐお知らせしています。</li>
        </ul>
  faq:
    - ["PS5 ミッドナイトブラックの発売日と値段は？", "「PlayStation 5 デジタル・エディション ミッドナイト ブラック 日本語専用」（CFI-2200B02S）は2026年11月19日発売、希望小売価格は55,000円（税込）です。同色のディスクドライブ（CFI-ZDD1J01）は11,980円です。"]
    - ["海外のアカウントでも使えますか？", "使えません。本体言語が「日本語」、かつ国/地域が「日本」に設定されたPlayStationのアカウントでのみ使える日本語専用モデルです。"]
  sources:
    - ["PHILE WEB：PS5デジタル・エディション日本語専用版に新色「ミッドナイト ブラック」", "https://www.phileweb.com/news/d-av/202610/13/66140.html"]
    - ["AV Watch：ミッドナイト ブラックの予約開始", "https://av.watch.impress.co.jp/docs/news/2149646.html"]

# 11/25 追加（ユーザー「SEOもっとがんばって」）
pc-parts/rtx-5090/:
  checked: "2026-11-25"
  title: "RTX 5090はどこで買える？抽選・在庫・値段の状況まとめ【{md}更新】"
  desc: "RTX 5090は2025年1月30日発売、国内価格は393,800円から。2026年11月のアキバ店頭では約100万〜128万円台。発売時の抽選の経緯、値段の動き、いまの在庫をまとめました。"
  h1: "RTX 5090はどこで買える？抽選・在庫・値段の状況"
  summary:
    - "RTX 5090の販売は<b>2025年1月30日23時</b>に始まりました。NVIDIAが発表した国内価格は<b>393,800円から</b>です。"
    - "発売日はパソコン工房 秋葉原パーツ館が店頭で抽選販売をしました。人が集まりすぎて騒ぎになり、<b>このあとのRTX 5080の店頭抽選は中止</b>になりました。"
    - "2026年11月7日の報道では、ドスパラ秋葉原本店の価格は<b>128万8000円</b>でした。11月14日の報道では<b>99万9800円〜104万8000円</b>に下がった製品もあります。"
    - "Founders Edition（NVIDIA純正のカード）は、カード単体の国内販売を確認できていません。2026年4月28日からは、<b>パソコン工房がFE入りのPCと組み立てキットを販売</b>しています。"
  sections:
    - h: "いまの買い方"
      html: >-
        <p>2026年11月の時点では、アキバのお店に店頭在庫がある状態です。ITmedia（2026年11月7日）によると、11月1日の週にドスパラ秋葉原本店へ複数のRTX 5090が入荷しました。<b>購入は1組1枚まで</b>で、お店は在庫を「それなり」にあると話しています。</p>
        <p>一方でITmedia（2026年11月14日）は、ASUS製のカードは入荷が不安定で、パソコンSHOPアークでは売り切れていたと伝えています。<b>メーカーやお店によって在庫の差が大きい</b>状況です。</p>
        <p>Founders Editionは、カード単体の国内販売を確認できませんでした。パソコン工房（iiyama PC）が2026年4月28日から、FEを載せたPCと組み立てキットを売っています。PCの価格は72万8800円からです（PC Watch、2026年4月30日）。</p>
    - h: "値段"
      html: >-
        <div class="xtbl"><table>
        <tr><th>時期</th><th>内容</th><th>価格</th></tr>
        <tr><td>2025年1月7日</td><td>NVIDIAが発表した国内価格</td><td>393,800円〜</td></tr>
        <tr><td>2026年9月11日の報道</td><td>ソフマップ大宮店 ASUS ROG Astral（1台限定）</td><td>102万2800円</td></tr>
        <tr><td>2026年11月7日の報道</td><td>ドスパラ秋葉原本店 MSI VENTUS 3X OC／Palit GameRock</td><td>128万8000円</td></tr>
        <tr><td>2026年11月14日の報道</td><td>ドスパラ秋葉原本店 Palit GameRock</td><td>99万9800円</td></tr>
        <tr><td>2026年11月14日の報道</td><td>ドスパラ秋葉原本店 MSI VENTUS 3X OC</td><td>104万8000円</td></tr>
        <tr><td>2026年11月14日の報道</td><td>ASUS ROG Astral OC Edition（価格改定後）</td><td>150万円超</td></tr>
        </table></div>
        <p>AUTOMATON（2026年9月11日）は、PCパーツ全体が値上がりした背景に<b>世界的な半導体メモリ不足</b>があると伝えています。また、この価格は転売ではなく、お店の正規の販売価格だとしています。11月14日の値下がりについてドスパラは、期間限定のセールではないと説明しています。</p>
    - h: "これまでの流れ"
      html: >-
        <ul class="tl">
        <li><b>2025年1月7日</b>：NVIDIAが国内価格を発表しました。RTX 5090は393,800円からです。</li>
        <li><b>2025年1月30日 23時</b>：販売が始まりました。パソコン工房は通販の抽選に加えて、秋葉原パーツ館で店頭の抽選もしました。店頭は人が集まりすぎて混乱し、RTX 5080の店頭抽選は中止になりました。</li>
        <li><b>2026年4月28日</b>：パソコン工房がFounders Edition入りのPCを発売しました。</li>
        <li><b>2026年9月</b>：ソフマップ大宮店で102万2800円の製品が出ました。</li>
        <li><b>2026年11月</b>：ドスパラ秋葉原本店の価格は128万8000円でした。その翌週には一部の製品が99万9800円〜104万8000円に下がっています。</li>
        </ul>
    - h: "買うときのコツ"
      html: >-
        <ul>
        <li><b>同じRTX 5090でも、製品で50万円以上の差があります</b>。製品名と価格をくらべてから選びましょう。</li>
        <li><b>購入できる数に注意</b>：1組1枚までにしているお店があります（ドスパラ秋葉原本店、2026年11月）。</li>
        <li><b>Founders Editionがほしいとき</b>：国内ではパソコン工房のFE入りPCか、組み立てキットで手に入ります。</li>
        <li><b>入荷のお知らせを受け取る</b>：このサイトのX（@a9994aaa）で、入荷や抽選の情報をお知らせしています。</li>
        </ul>
  faq:
    - ["RTX 5090の定価はいくらですか？", "NVIDIAが2025年1月7日に発表した国内価格は393,800円からです。2026年11月のアキバ店頭では、約100万円〜128万円台で売られています。"]
    - ["Founders Editionは日本で買えますか？", "カード単体の国内販売は確認できていません。2026年4月28日から、パソコン工房がFounders Edition入りのPCと組み立てキットを販売しています。"]
    - ["いまは抽選なしで買えますか？", "2026年11月の報道では、ドスパラ秋葉原本店に店頭在庫がありました（1組1枚まで）。ただ、ASUS製のように入荷が不安定な製品や、売り切れのお店もあります。"]
  sources:
    - ["NVIDIA「GeForce RTX 50」シリーズの国内価格が発表（Game Watch、2025年1月7日）", "https://game.watch.impress.co.jp/docs/news/1652669.html"]
