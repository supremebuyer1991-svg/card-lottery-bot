# ゲーム・ホビー入荷速報の情報元（SITE=game のときだけ読む）
# type: rss = 新着記事 / html = ページの変化 / html_index = 一覧 → 記事 / html_newlinks = 新しいリンク先だけ読む
# game: categories.yaml の id（ps5 / switch2 / handheld_pc / game_limited / fukubukuro / gunpla / pokecen / beyblade / figure / ichibankuji / chiikawa / lego / tomica）
#       auto = AIが記事の中身からカテゴリを判定
# every_hours: 何時間に1回だけ読むか（1日6回の実行のうち、2〜3回に1回にして費用と時間を抑える）
#
# ※ URLはこのファイルを書いた環境から直接確かめられなかったものがあります（enabled: false ＋ TODO）。
#    GitHub Actions の「Run workflow」で1回動かし、ログに「取得失敗」が出なければ enabled: true にしてください。
# ※ Xの検索はこのサイトでは使いません（費用がかかるため。全部 enabled: false）

