  facts:
    - 1998年にNINTENDO 64で発売された『ゼルダの伝説 時のオカリナ』を、Nintendo Switch 2向けに作り直したリメイク作品です。
    - 「ゼルダの伝説40周年 Direct」（2026年9月8日）で発表され、2026年11月5日に任天堂から発売されました。
    - 少年のリンクと大人のリンクで2つの時代を行き来し、それぞれでできることを使い分けながら冒険を進めます。
    - 冒険中に覚えたメロディをオカリナで演奏すると効果が出ます。ボタンのほか、Switch 2のマイクに向かって鼻歌などで演奏することもできます。
    - グラフィックが新しくなり、フルボイス・自由に動かせるカメラ・ダッシュなどが加わりました。
    - 価格はパッケージ版8,980円・ダウンロード版7,980円（税込）です。
