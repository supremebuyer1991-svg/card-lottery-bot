# ゲーム・ホビー入荷速報の解説ページ（/guide/<slug>/）。
# 公式の告知で確かめた事実だけを書く。具体的な日付・値段・条件の数字は、公式で確かめてから入れる（ここでは一般的な「やり方」だけ）。
# store_re … このお店・この話題の受付中の情報を下に並べるためのパターン
guides:
  - slug: how-to-read
    name: このサイトの見方
    store_re: "(?!x)x"   # どのお店にも当たらない（お店別ではなく全体の説明）
    short: 抽選・招待・予約・再入荷・先着のちがいと、このサイトの見方
    title: 抽選・招待・予約・再入荷・先着のちがい｜ゲーム機・ホビーを定価で買うための見方
    h1: 「抽選」「招待」「予約」「再入荷」「先着」のちがいと、このサイトの見方
    desc: PS5・Switch 2・ガンプラ・フィギュアなどを定価で買いたい人のために、抽選販売・招待制販売・予約受付・再入荷・先着販売のちがいと、このサイトの受付状況（受付中・予告・結果待ち・終了）の見方をまとめました。
    intro: 人気のゲーム機やホビーは、お店によって「抽選」「招待」「予約」「再入荷」「先着」と売り方が分かれています。このサイトでは種類ごとにラベルを付けて、いま何ができるかが一目で分かるようにしています。
    sections:
      - h: 種類（ラベル）の意味
        html: <ul><li><b>抽選</b>…期間内に申し込み、当選した人だけが買えます。締切と当選発表日があります。</li><li><b>招待</b>…Amazonなどの「招待リクエスト」。申し込みに締切はなく、お店から招待が届いた人だけが買えます。</li><li><b>予約</b>…発売前の商品の予約受付。開始と同時に埋まることが多いので、開始日時が大事です。</li><li><b>再入荷</b>…発売済みの商品の在庫が復活したお知らせ。すぐ売り切れるので、見つけ次第の確認が必要です。</li><li><b>先着</b>…申し込み順で買える販売。開始日時に合わせて並びます。</li><li><b>福袋</b>…年末年始の福袋・お年玉箱。多くは抽選です。</li><li><b>発売・再販</b>…メーカーが発表した発売日・再販日（お店の受付ではなく、その日を目安に各店の予約・入荷が動きます）。</li></ul>
      - h: 受付状況の見方
        html: <ul><li><b>受付中</b>…いま申し込みできます。締切までの残り時間はページを開いた時刻で計算しています。</li><li><b>予告</b>…受付開始の日時だけ分かっているもの。開始前に準備（会員登録など）ができます。</li><li><b>結果待ち</b>…受付は終わり、当選発表を待っているもの。</li><li><b>終了</b>…受付・販売が終わったもの。しばらく残してから一覧から消えます。</li></ul>
      - h: 申し込む前に確かめること
        html: <ul><li>条件のタグ（会員・アプリ・本人確認・プレイ時間・PSN必須・NSO加入・1人1台・ソフト同時購入 など）は告知から読み取ったものです。<b>必ず応募ページの原文でご確認ください</b>。</li><li>このサイトは情報を集めて並べているだけで、応募・購入は各お店のページで行います。</li><li>フリマ・転売の値段は載せていません。定価で買える機会を探すためのサイトです。</li></ul>
    faq:
      - ["「招待」と「抽選」はどう違いますか？", "抽選は期間内に申し込んで当選者だけが買える売り方で、締切と発表日があります。招待（Amazonの招待リクエストなど）は申し込みに締切がなく、お店から招待が届いた人が買えます。"]
      - ["受付状況はいつの時点のものですか？", "ページを開いた時刻で計算しています。受付中・予告・終了の判定と残り時間は、開くたびに今の時刻で表示されます。"]
      - ["値段は載っていますか？", "分かるものは定価（税込）を載せています。フリマ・転売の値段は載せていません。"]
    sources: []
