# ゲーム・ホビー入荷速報の解説ページ（/guide/<slug>/）。
# 公式の告知で確かめた事実だけを書く。具体的な日付・値段・条件の数字は、公式で確かめてから入れる（ここでは一般的な「やり方」だけ）。
# store_re … このお店・この話題の受付中の情報を下に並べるためのパターン
guides:
  - slug: how-to-read
    name: このサイトの見方
    store_re: "(?!x)x"   # どのお店にも当たらない（お店別ではなく全体の説明）
    short: 抽選・招待・予約・再入荷・先着のちがいと、このサイトの見方
    title: 抽選・招待・予約・再入荷・先着のちがい｜ゲーム機・ホビーを定価で買うための見方
    h1: 「抽選」「招待」「予約」「再入荷」「先着」のちがいと、このサイトの見方
    desc: PS5・Switch 2・ガンプラ・フィギュアなどを定価で買いたい人のために、抽選販売・招待制販売・予約受付・再入荷・先着販売のちがいと、このサイトの受付状況（受付中・予告・結果待ち・終了）の見方をまとめました。
    intro: 人気のゲーム機やホビーは、お店によって「抽選」「招待」「予約」「再入荷」「先着」と売り方が分かれています。このサイトでは種類ごとにラベルを付けて、いま何ができるかが一目で分かるようにしています。
    sections:
      - h: 種類（ラベル）の意味
        html: <ul><li><b>抽選</b>…期間内に申し込み、当選した人だけが買えます。締切と当選発表日があります。</li><li><b>招待</b>…Amazonなどの「招待リクエスト」。申し込みに締切はなく、お店から招待が届いた人だけが買えます。</li><li><b>予約</b>…発売前の商品の予約受付。開始と同時に埋まることが多いので、開始日時が大事です。</li><li><b>再入荷</b>…発売済みの商品の在庫が復活したお知らせ。すぐ売り切れるので、見つけ次第の確認が必要です。</li><li><b>先着</b>…申し込み順で買える販売。開始日時に合わせて並びます。</li><li><b>福袋</b>…年末年始の福袋・お年玉箱。多くは抽選です。</li><li><b>発売・再販</b>…メーカーが発表した発売日・再販日（お店の受付ではなく、その日を目安に各店の予約・入荷が動きます）。</li></ul>
      - h: 受付状況の見方
        html: <ul><li><b>受付中</b>…いま申し込みできます。締切までの残り時間はページを開いた時刻で計算しています。</li><li><b>予告</b>…受付開始の日時だけ分かっているもの。開始前に準備（会員登録など）ができます。</li><li><b>結果待ち</b>…受付は終わり、当選発表を待っているもの。</li><li><b>終了</b>…受付・販売が終わったもの。しばらく残してから一覧から消えます。</li></ul>
      - h: 申し込む前に確かめること
        html: <ul><li>条件のタグ（会員・アプリ・本人確認・プレイ時間・PSN必須・NSO加入・1人1台・ソフト同時購入 など）は告知から読み取ったものです。<b>必ず応募ページの原文でご確認ください</b>。</li><li>このサイトは情報を集めて並べているだけで、応募・購入は各お店のページで行います。</li><li>フリマ・転売の値段は載せていません。定価で買える機会を探すためのサイトです。</li></ul>
    faq:
      - ["「招待」と「抽選」はどう違いますか？", "抽選は期間内に申し込んで当選者だけが買える売り方で、締切と発表日があります。招待（Amazonの招待リクエストなど）は申し込みに締切がなく、お店から招待が届いた人が買えます。"]
      - ["受付状況はいつの時点のものですか？", "ページを開いた時刻で計算しています。受付中・予告・終了の判定と残り時間は、開くたびに今の時刻で表示されます。"]
      - ["値段は載っていますか？", "分かるものは定価（税込）を載せています。フリマ・転売の値段は載せていません。"]
    sources: []
  - slug: gunpla-saihan
    name: ガンプラの再販・抽選
    game: gunpla
    store_re: "バンダイ|BANDAI|ガンダムベース|GUNDAM BASE|ガンプラ"
    short: ガンプラの再販・抽選・限定品の買い方（プレバン・ガンダムベース・再販会議）
    title: ガンプラの再販はいつ？抽選・限定品の買い方まとめ（プレバン・ガンダムベース・再販会議）
    h1: ガンプラの再販・抽選・限定品の買い方
    desc: 品薄のガンプラを定価で買うための方法。プレミアムバンダイの抽選販売、ガンダムベースの事前抽選（バンダイ公式LINE）、ビルダーズノートの「ガンプラ再販会議」のしくみと、いま受付中のガンプラの抽選・予約をまとめています。
    intro: 人気のガンプラは、発売日や再販のたびにすぐ売り切れます。いまはメーカーのBANDAI SPIRITSが「抽選」で売ることが増えていて、どこで・どうやって申し込むかを知っているかどうかで、定価で買えるかが大きく変わります。このページでは主な買い方と、いま受付中のガンプラの抽選・予約（下の一覧・毎日更新）をまとめています。
    sections:
      - h: 主な買い方は4つ
        html: >-
          <ul>
          <li><b>家電量販店・模型店・通販の再販</b>：一般販売のキットは、各店に入荷したときに先着や抽選で売られます。お店ごとに日時がばらばらなので、入荷の告知を追うのが基本です。</li>
          <li><b>プレミアムバンダイ（プレバン）</b>：バンダイ公式の通販。プレバン限定キットのほか、人気キットを<b>抽選販売</b>することがあります。例えば2026年5月には「HG 1/144 アリュゼウス」「HG 1/144 Ξガンダム（キルケーの魔女）」など5商品が抽選販売になりました。</li>
          <li><b>ガンダムベース</b>：公式のガンプラ専門店。ガンダムベース限定品があり、注目の新商品は<b>バンダイ公式LINEを使った事前抽選</b>で売ることがあります（例：2026年1月発売の「PG UNLEASHED 1/60 νガンダム」は、ガンダムベース東京などで事前抽選のみの販売でした）。</li>
          <li><b>ビルダーズノート『ガンプラ再販会議』</b>：2026年5月12日に始まったガンプラ公式アプリの取り組み。作りたいキットに投票し、再販が決まると<b>アプリ内の抽選</b>で買えます。製作記録の投稿やミッションで「投票チケット」をもらい、そのキットに多く投じるほど当選確率が上がるしくみです。</li>
          </ul>
      - h: ガンダムベース渋谷（2026年11月20日オープン）
        html: >-
          <p>都内3店舗目の「THE GUNDAM BASE SHIBUYA」が、渋谷PARCO 5階に2026年11月20日にオープンしました（11時〜21時・入場無料）。オープンから<b>11月30日までは事前抽選による入店制限</b>があり、応募は11月9日〜15日でした。当選した本人だけが入店でき、同伴者は入れません。キャンセルが出た分は当日入店枠として開放される場合があります。</p>
      - h: 定価で買うためのコツ
        html: >-
          <ul>
          <li><b>アカウントを先に作っておく</b>：プレミアムバンダイの会員登録、バンダイ公式LINEの友だち登録、ビルダーズノートのアプリ。抽選の受付は短いことが多いので、受付が始まってから準備すると間に合わないことがあります。</li>
          <li><b>ビルダーズノートは「作った記録」が力になる</b>：再販会議の抽選は、投票チケットを多く投じたキットほど当たりやすくなります。ふだんから製作記録を投稿しておくと有利です。</li>
          <li><b>転売価格で買わない</b>：再販や抽選は定期的にあります。定価よりかなり高い出品は、少し待つと定価で買えることが多いです。</li>
          <li><b>受付の情報を受け取る</b>：このサイトでは、ガンプラの抽選・予約・再販の受付を見つけしだい下の一覧に載せ、X（@a9994aaa）でもお知らせしています。</li>
          </ul>
    faq:
      - ["ガンプラの再販はどこで知れますか？", "メーカーのBANDAI SPIRITSのホビーサイトやプレミアムバンダイ、ガンダムベースの公式サイト・公式LINE、ビルダーズノートのアプリで告知されます。このサイトでも、見つけたガンプラの抽選・予約・再販の受付を一覧にしています。"]
      - ["ガンプラ再販会議とは何ですか？", "ガンプラ公式アプリ「ビルダーズノート」で2026年5月12日に始まった取り組みです。作りたいキットに投票し、再販が決まったキットはアプリ内の抽選で購入できます。製作記録の投稿などでもらえる投票チケットを多く投じるほど、そのキットの当選確率が上がります。"]
      - ["ガンダムベースの限定品はどうやって買えますか？", "ガンダムベースの店頭で販売されますが、注目の商品はバンダイ公式LINEを使った事前抽選になることがあります。抽選になるかどうかは商品ごとに公式サイトで告知されます。"]
    sources:
      - ["PR TIMES（BANDAI SPIRITS）：ビルダーズノート『ガンプラ再販会議』開始", "https://prtimes.jp/main/html/rd/p/000000069.000028758.html"]
      - ["INSIDE：プレミアムバンダイで「HG アリュゼウス」など5商品が抽選販売（2026年5月）", "https://www.inside-games.jp/article/2026/05/15/181327.html"]
      - ["INSIDE：PG UNLEASHED νガンダムはガンダムベースで事前抽選（2026年1月）", "https://www.inside-games.jp/article/2026/01/10/176005.html"]
      - ["アニメ！アニメ！（エキサイト）：ガンダムベース渋谷の入店抽選", "https://www.excite.co.jp/news/article/Animeanime_104025/"]
