  - slug: onepiece-card-chusen
    name: ワンピースカードの抽選・予約
    game: onepiece
    store_re: "ワンピースカード|ONE PIECE CARD|ワンピカード"
    short: ワンピースカード新弾を定価で買う方法と発売日まとめ
    title: ワンピースカード新弾の抽選・予約・再販まとめ
    h1: ワンピースカードゲームの新弾を定価で買う方法（抽選・予約・再販）
    desc: ワンピースカードゲームのブースターパックは1パック240円（税込、OP-17以降）。プレミアムバンダイの抽選や通販の抽選予約、再販の受付、OP-18・EB-06・OP-19・PEB-01の発売日をまとめました。
    intro: ワンピースカードゲームの新しいブースターパックは人気が高く、抽選販売で受け付けることがよくあります。このページでは、定価で買うための主な方法、公式サイトに載っている希望小売価格、これからの発売日をまとめます（2026年11月25日時点）。
    sections:
      - h: 主な買い方
        html: >-
          <ul><li><b>プレミアムバンダイの抽選販売</b>：バンダイの公式通販です。たとえばOP-17「世界最強の戦士」は1BOX（24パック）を抽選で販売し、2026年10月14日〜20日には3次抽選が行われました（すでにプレミアムバンダイで購入した人は応募できません）。</li><li><b>通販サイトの抽選予約</b>：楽天ブックスやAmazonでも抽選で受け付けることがあります。OP-17の再販分は2026年10月に楽天ブックスとAmazonで抽選受付が行われました。</li><li><b>店頭での予約・抽選</b>：公式サイトの各商品ページから取り扱い店舗を探せます。受付のしかたはお店ごとに違うので、各店のお知らせを確認してください。</li></ul>
      - h: 定価（希望小売価格）
        html: >-
          <p>公式サイトの商品ページに載っている希望小売価格（税込）です。</p><div class="xtbl"><table><tr><th>種類</th><th>1パック</th></tr><tr><td>ブースターパック（OP-17・OP-18・OP-19）</td><td>240円</td></tr><tr><td>ブースターパック（OP-15・OP-16）</td><td>220円</td></tr><tr><td>エクストラブースター（EB-05・EB-06）</td><td>240円</td></tr><tr><td>プレミアムエクストラブースター（PEB-01）</td><td>440円</td></tr></table></div><p>OP-17「世界最強の戦士」は1BOX24パック入りで、プレミアムバンダイでは1BOX 5,760円（税込）で抽選販売されました。ブースターパックは1パック6枚入りで、カードはランダムに入っています。</p>
      - h: 最近・これからの発売
        html: >-
          <div class="xtbl"><table><tr><th>発売日</th><th>商品</th></tr><tr><td>2026年5月30日(土)</td><td>ブースターパック 決戦の刻【OP-16】</td></tr><tr><td>2026年8月22日(土)</td><td>ブースターパック 世界最強の戦士【OP-17】</td></tr><tr><td>2026年10月31日(土)</td><td>エクストラブースター ONE PIECE Heroines Edition vol.2【EB-05】</td></tr><tr><td>2026年11月21日(土)</td><td>ブースターパック 神の支配【OP-18】</td></tr><tr><td>2027年1月30日(土)</td><td>エクストラブースター EAST BLUE【EB-06】</td></tr><tr><td>2027年2月27日(土)</td><td>ブースターパック 応答せよ、世界【OP-19】</td></tr><tr><td>2027年4月24日(土)</td><td>プレミアムエクストラブースター 夢の一枚【PEB-01】</td></tr></table></div><p>発売日は公式サイトの商品ページ（2026年11月25日確認）によります。OP-18の商品ページには、抽選販売の応募受付期間（2026年11月6日〜11月12日）が載っていました。</p>
      - h: 定価で買うコツ
        html: >-
          <ul><li>抽選は1回で終わらないことがあります。OP-17はプレミアムバンダイで1次（2026年7月29日〜8月4日）のあとも、2次・3次と抽選が行われました。</li><li>発売後に抽選販売が行われることもあります。OP-16は発売（5月30日）のあと、6月25日〜7月2日にプレミアムバンダイの抽選が行われました。</li><li>人気の弾は再販されることがあります。OP-17は人気を受けて再販され、通販サイトで抽選受付が行われました。</li><li>応募の条件（過去に買った人は応募できない、など）は受付ごとに違うので、応募前に必ず確認しましょう。</li><li>このサイトでは、ワンピースカードの抽選・予約・再販の受付を見つけしだい下の一覧に載せ、X（@a9994aaa）でもお知らせしています。</li></ul>
    faq:
      - ["ワンピースカードのブースターパックの定価はいくらですか？", "公式サイトの希望小売価格は、OP-17以降のブースターパックが1パック240円（税込）です。OP-15とOP-16は220円（税込）でした。"]
      - ["次の新弾はいつ発売ですか？", "公式サイトによると、エクストラブースター EAST BLUE【EB-06】が2027年1月30日、ブースターパック 応答せよ、世界【OP-19】が2027年2月27日に発売予定です（2026年11月25日確認）。"]
      - ["抽選に外れたらもう買えませんか？", "2次・3次の抽選や再販の受付が行われることがあります。OP-17はプレミアムバンダイで3次抽選まで行われ、再販分も通販サイトで抽選受付がありました。"]
    sources:
      - ["ONE PIECEカードゲーム公式サイト PRODUCTS ブースター一覧（2026年11月25日確認）", "https://www.onepiece-cardgame.com/products/?subcategory=boosters"]
      - ["ブースターパック 神の支配【OP-18】公式商品ページ（2026年11月25日確認）", "https://www.onepiece-cardgame.com/products/op18.html"]
      - ["ブースターパック 応答せよ、世界【OP-19】公式商品ページ（2026年11月25日確認）", "https://www.onepiece-cardgame.com/products/op19.html"]
      - ["インサイド「世界最強の戦士」プレミアムバンダイ3次抽選（2026年10月14日）", "https://www.inside-games.jp/article/2026/10/14/189216.html"]
      - ["インサイド「世界最強の戦士」プレミアムバンダイ抽選（2026年8月2日）", "https://www.inside-games.jp/article/2026/08/02/185571.html"]
      - ["電撃オンライン「世界最強の戦士」再販 抽選受付（2026年10月15日）", "https://dengekionline.com/article/202610/91090"]
  - slug: ichibankuji-kaikata
    name: 一番くじの買い方
    game: ichibankuji
    store_re: "一番くじ"
    short: 一番くじのしくみ・値段・ONLINEのちがいまとめ
    title: 一番くじの買い方｜値段・ラストワン賞・ONLINE
    h1: 一番くじの買い方：発売日・取り扱い店・一番くじONLINE・ラストワン賞
    desc: BANDAI SPIRITSの一番くじはハズレなしのキャラクターくじ。1回750円・790円などの値段の例、ラストワン賞、一番くじONLINEの送料660円や1決済の上限、2026年11月〜12月の発売予定をまとめました。
    intro: 一番くじは、BANDAI SPIRITSが出している「ハズレなし」のキャラクターくじです。コンビニや書店、ホビーショップなどのお店で引けるほか、公式の「一番くじONLINE」でも引けます。このページでは、しくみと買い方、これからの発売予定をまとめます。
    sections:
      - h: しくみ（等賞・ラストワン賞・値段）
        html: >-
          <p>一番くじは<b>ハズレなし</b>のくじで、1回引くとA賞、B賞…のどれかの景品が必ずもらえます。値段は商品ごとにちがい、たとえば次のようになっています（どれも税込）。</p>
          <div class="xtbl"><table><tr><th>商品</th><th>1回の値段</th></tr><tr><td>一番くじ ワンピース～あにまる大集合！～</td><td>750円</td></tr><tr><td>一番くじ にゃんこ大戦争 ～みんなでペリペリするにゃ～（再販売）</td><td>750円</td></tr><tr><td>一番くじ Pokémon 30th ANNIVERSARY vol.1（再販）</td><td>750円</td></tr><tr><td>一番くじ ヱヴァンゲリヲン新劇場版：破</td><td>790円</td></tr></table></div>
          <p><b>ラストワン賞</b>は、くじの箱の<b>最後の1枚</b>を引いた人がもらえる特別な景品です。たとえば「ワンピース～あにまる大集合！～」ではカルーのビッグぬいぐるみ（約40cm）、「ヱヴァンゲリヲン新劇場版：破」ではエヴァンゲリオン2号機のフィギュアがラストワン賞です。商品によっては、抽選で景品が当たる「ダブルチャンスキャンペーン」もあります。</p>
      - h: 店頭と一番くじONLINEのちがい
        html: >-
          <p><b>店頭</b>：取り扱い店は商品ごとにちがいます。たとえば「ワンピース～あにまる大集合！～」はファミリーマートなど、「にゃんこ大戦争」再販売はローソンや書店など、「ヱヴァンゲリヲン新劇場版：破」はセブン‐イレブンなどで扱われます。発売日は「順次発売」となっていて、お店によって始まる日がちがうことがあります。</p>
          <p><b>一番くじONLINE</b>：スマホやパソコンから引ける公式サービスで、会員登録が必要です。主なルールは次のとおりです。</p>
          <ul>
          <li>くじの箱を選んで順番待ちをし、「購入」ボタンが出たら回数を決めて支払います。同時に複数の箱には並べません。</li>
          <li>1回の支払いで引ける回数の上限は商品ごとにちがいます（例：1決済20回まで）。</li>
          <li>送料は1決済660円（税込）。「一番くじちょこっと」は330円（税込）です（2026年4月時点の情報）。</li>
          <li>同じお届け先で、AM4:00から翌日AM3:59までに買った通常商品は「おまとめ配送」で送料1回分になります。予約商品との組み合わせは対象外です。</li>
          <li>発送は購入完了から約10営業日が目安とされています。海外発送はありません。</li>
          <li>ONLINEでも箱の最後の1枚を引くとラストワン賞がもらえます。</li>
          </ul>
      - h: これからの発売（2026年11月〜12月）
        html: >-
          <div class="xtbl"><table><tr><th>発売日</th><th>商品</th><th>1回</th><th>主な取り扱い</th></tr>
          <tr><td>2026年11月14日（土）から順次</td><td>一番くじ ワンピース～あにまる大集合！～</td><td>750円</td><td>ファミリーマート、麦わらストア、一番くじ公式ショップ、一番くじONLINEなど</td></tr>
          <tr><td>2026年11月20日から順次</td><td>一番くじ にゃんこ大戦争 ～みんなでペリペリするにゃ～（再販売）</td><td>750円</td><td>ローソン、書店、ホビーショップ、一番くじ公式ショップ、一番くじONLINEなど</td></tr>
          <tr><td>2026年12月5日</td><td>一番くじ ヱヴァンゲリヲン新劇場版：破</td><td>790円</td><td>セブン‐イレブン、イトーヨーカドー、ゆめタウン、EVANGELION STOREなど</td></tr>
          <tr><td>2026年12月14日から順次（再販）</td><td>一番くじ Pokémon 30th ANNIVERSARY vol.1</td><td>750円</td><td>書店、ホビーショップ、一部のドラッグストア、一番くじ公式ショップ、ポケモンセンターなど</td></tr>
          </table></div>
          <p>日付は各記事の掲載時点の予定です。変わることがあるので、公式サイト（1kuji.com）の商品ページでも確かめてください。</p>
      - h: 買うときのコツ
        html: >-
          <ul>
          <li>まず商品ごとの取り扱い店を確かめましょう。コンビニのチェーンも商品によってちがいます。</li>
          <li>「順次発売」の商品は、お店によって始まる日がちがうことがあります。</li>
          <li>一番くじONLINEは送料（1決済660円）がかかります。同じ日（AM4:00〜翌AM3:59）の通常商品はおまとめ配送で送料1回分になります。</li>
          <li>ONLINEは1決済の回数に上限があり、支払い後に回数は足せません。追加で引くときは並び直しになります。</li>
          <li>このサイトでは一番くじの発売情報を見つけしだい下の一覧に載せ、X（@a9994aaa）でもお知らせしています。</li>
          </ul>
    faq:
      - ["一番くじにハズレはありますか？", "ありません。1回引くとA賞などのどれかの景品が必ずもらえるハズレなしのくじです。"]
      - ["ラストワン賞とは何ですか？", "くじの箱の最後の1枚を引いた人がもらえる特別な景品です。一番くじONLINEでも、箱の最後の1枚を引くともらえます。"]
      - ["一番くじONLINEの送料はいくらですか？", "通常の一番くじは1決済660円（税込）、一番くじちょこっとは330円（税込）です（2026年4月時点）。同じお届け先でAM4:00から翌日AM3:59までに買った通常商品はおまとめ配送で送料1回分になります。"]
    sources:
      - ["一番くじ ヱヴァンゲリヲン新劇場版：破 12月5日発売（インサイド 2026年8月17日）", "https://www.inside-games.jp/article/2026/08/17/186283.html"]
      - ["『ポケモン』30周年一番くじ第1弾が12月14日より順次再販（インサイド 2026年8月5日）", "https://www.inside-games.jp/article/2026/08/05/185785.html"]
      - ["一番くじ ワンピース～あにまる大集合！～ 11月14日より順次発売（電撃オンライン 2026年10月19日）", "https://dengekionline.com/article/202610/91397"]
      - ["一番くじ にゃんこ大戦争 再販売 11月20日より順次（GAME Watch 2026年11月20日）", "https://game.watch.impress.co.jp/docs/news/2157479.html"]
      - ["一番くじONLINEで3商品のオンライン販売（電撃オンライン 2026年1月26日）", "https://dengekionline.com/article/202601/63864"]
      - ["一番くじオンラインの引き方・送料・ラストワン賞（ゲームエイト プレミアム 2026年11月23日更新）", "https://premium.gamepedia.jp/hobby/archives/1899"]
