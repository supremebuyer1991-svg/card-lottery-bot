  - slug: beyblade-x-saihan
    name: ベイブレードXの再販・抽選
    game: beyblade
    store_re: "タカラトミー|TAKARA|ベイブレード|BEYBLADE"
    short: 品薄が続くベイブレードXの再販・受注・予約のまとめ
    title: ベイブレードX再販はどこで買える？受注・予約まとめ
    h1: ベイブレードXを定価で買う方法（再販・受注生産・予約）
    desc: ベイブレードXは2026年春から品薄が続いています。タカラトミーは7月29日に増産を発表し、タカラトミーモールでCX-16など3商品の受注生産を行いました。主な買い方と最近の例をまとめます。
    intro: タカラトミーのベイブレードX（BEYBLADE X）は、2026年春ごろから日本などアジアで品薄が続いています。タカラトミーは2026年7月29日に増産を発表し、公式通販のタカラトミーモールで一部商品の受注生産も行いました。このページでは、定価で買うための主な方法と、確認できた最近の例をまとめます。
    sections:
      - h: 主な買い方
        html: >-
          <ul><li><b>タカラトミーモールの受注生産</b>：期間中に申し込めば、生産してから届きます。届くまでに数か月かかることがあります。</li><li><b>公式・コラボ先の予約受付</b>：限定品は、タカラトミーモールやコラボ先の公式ストアで予約を受け付けることがあります。</li><li><b>家電量販店・おもちゃ売り場の再販</b>：再販分が店頭や通販に並びますが、すぐ売り切れることがあります。店によっては抽選や購入数の制限があります。</li></ul><p>タカラトミーは、増産分を7月末から8月にかけて順次出し、その後も供給を増やすとしています。今後の限定商品についても、追加の受注販売や増産を行うとしています（2026年7月29日の発表）。</p>
      - h: 最近の例（2026年）
        html: >-
          <div class="xtbl"><table><tr><th>時期</th><th>内容</th></tr><tr><td>2026年3月21日〜</td><td>CX-00 エヴァンゲリオンデッキセット（7,500円・税込、8月29日発売）の予約受付。タカラトミーモール、EVANGELION STOREオンラインなど</td></tr><tr><td>2026年6月19日〜7月20日</td><td>UX-00 スターター サムライセイバー5-60K メタルコート：サムライブルー サッカー日本代表Ver.（2,500円・税込）をJFA STOREで受注生産。お届けは2026年11月下旬予定</td></tr><tr><td>2026年7月29日</td><td>タカラトミーが品薄へのおわびと増産を発表</td></tr><tr><td>2026年8月7日12時〜8月11日23時59分</td><td>タカラトミーモールで受注生産：CX-16 スタートダッシュセットC、UX-20 スターター グローリーワルキューレLF、UX-21 ヘルズネザーデッキセット。各商品1人・1世帯につき1個まで。発送は2027年1月中旬ごろ予定</td></tr><tr><td>2026年11月</td><td>UX-20 スターター グローリーワルキューレLFの再販（メーカー希望小売価格2,700円・税込、ビックカメラ.com掲載）</td></tr></table></div>
      - h: 定価で買うコツ
        html: >-
          <ul><li>タカラトミーモールの受注生産は、申込期間が数日と短いことがあります。開始日時を前もって確認しましょう。</li><li>受注生産では、同じ名前・住所・メールアドレス・電話番号での重複申し込みは、すべて無効になることがあります。決まりを守って申し込みましょう。</li><li>限定品はコラボ先の公式ストアでも受け付けることがあるので、あわせて確認しましょう。</li><li>このサイトでは、ベイブレードXの再販・抽選・受注の受付を見つけしだい下の一覧に載せ、X（@a9994aaa）でもお知らせしています。</li></ul>
    faq:
      - ["ベイブレードXはなぜ品薄なのですか？", "タカラトミーによると、2026年春ごろから想定を大きく上回る反響があり、日本や香港、台湾などで需要が急に増えたためです。6〜8月に出た新商品も十分に届けられていないとしています。"]
      - ["タカラトミーモールの受注生産には何個まで申し込めますか？", "2026年8月の受注生産では、各商品1人・1世帯につき合計1個までで、重複した申し込みはすべて無効になることがあるとされていました。"]
      - ["受注生産で申し込んだ商品はいつ届きますか？", "2026年8月7日から11日の受注生産分は、2027年1月中旬ごろの発送予定と発表されています。"]
    sources:
      - ["ASCII.jp ベイブレードX 増産と受注生産の発表（2026年7月29日）", "https://ascii.jp/elem/000/004/423/4423217/"]
      - ["インサイド タカラトミーモールでBEYBLADE Xの受注生産販売（2026年7月29日）", "https://www.inside-games.jp/article/2026/07/29/185368.html"]
      - ["KAI-YOU BEYBLADE X 品薄でタカラトミーが増産を発表（2026年7月29日）", "https://kai-you.net/article/96104"]
      - ["電撃オンライン CX-00 エヴァンゲリオンデッキセット予約開始（2026年3月21日）", "https://dengekionline.com/article/202603/69415"]
      - ["インサイド サムライセイバー サッカー日本代表Ver.の受注生産（2026年6月17日）", "https://www.inside-games.jp/article/2026/06/17/183101.html"]
      - ["ビックカメラ.com 【再販】UX-20 スターター グローリーワルキューレLF（2026年11月確認）", "https://www.biccamera.com/bc/item/15201349/"]
  - slug: pokeca-chusen
    name: ポケカの抽選・予約
    game: pokemon
    store_re: "ポケモンカード|ポケカ|ポケモンセンター"
    short: ポケカ新弾を定価で買う抽選・予約のしくみ
    title: ポケカ新弾を定価で買う方法｜抽選・予約・どこで買える
    h1: ポケモンカードの新弾を定価で買う方法（抽選・予約・売っている店）
    desc: ポケカ新弾のBOXは、ポケモンセンターオンラインや家電量販店などの抽選で売られることが多いです。応募の条件、1パック・1BOXの定価、ハドウシーカー（2026年11月27日発売）などの発売日をまとめました。
    intro: ポケモンカードの新しい拡張パックのBOXは、発売前に抽選で売られることが多いです。このページでは、主な買い方と応募の条件、最近の弾の定価と発売日を公式情報をもとにまとめました。条件はお店や弾ごとに変わるので、応募の前に各お店の案内を確認してください。
    sections:
      - h: 主な買い方
        html: >-
          <p>新弾のBOXは、おもに次の方法で売られます。</p>
          <ul>
          <li><b>ポケモンセンターオンラインの抽選</b>：応募は1つの商品につき1人1回までで、先着ではありません。「プレイヤーズクラブ：本人認証済み枠」と「本人未認証枠」の2つの枠があり、当選の多くは本人認証済み枠に割り当てられます。本人認証済み枠に応募するには、プレイヤーズクラブでマイナンバーカードによる本人認証をすませ、ポケモンセンターオンラインと同じメールアドレスにしておく必要があります。違う枠に応募すると落選になります。当選した権利は人にゆずれません。</li>
          <li><b>家電量販店などの抽選</b>：たとえばヨドバシ・ドット・コムのハドウシーカー抽選は、2026年11月10日11:00～11月11日10:59に受け付けました。応募には会員登録と、2024年11月6日～2026年11月5日のあいだの購入履歴が必要でした。ほかのお店でも、会員登録や過去の購入履歴を条件にすることがよくあります。</li>
          <li><b>Amazon</b>：商品ページの「招待をリクエストする」から申し込みます。在庫に応じて招待メールが届いた人が買えます。</li>
          <li><b>カードショップ・コンビニ</b>：店頭、Web、SNSなどで抽選をするお店があります。受付期間や方法はお店ごとに違います。</li>
          </ul>
          <p>お店によっては、BOXのシュリンク（外側のフィルム）を外して渡したり、1人1点までと決めたりしています。</p>
      - h: 定価（1パック・1BOX）
        html: >-
          <div class="xtbl"><table>
          <tr><th>商品</th><th>発売日</th><th>1パック</th><th>1BOX</th></tr>
          <tr><td>MEGA 拡張パック「ハドウシーカー」</td><td>2026年11月27日</td><td>200円（5枚入り）</td><td>6,000円（30パック）</td></tr>
          <tr><td>MEGA 拡張パック「30th CELEBRATION」</td><td>2026年9月16日</td><td>360円（6枚入り）</td><td>7,200円（20パック）</td></tr>
          <tr><td>MEGA 拡張パック「ストームエメラルダ」</td><td>2026年7月31日</td><td>200円（5枚入り）</td><td>30パック入り</td></tr>
          </table></div>
          <p>価格はすべて税込みのメーカー希望小売価格です。1BOXの価格はポケモンセンターオンラインの抽選販売ページの価格です。</p>
      - h: 最近・これからの発売
        html: >-
          <ul>
          <li><b>2026年11月27日（金）</b>：MEGA 拡張パック「ハドウシーカー」。ポケモンセンターオンラインの抽選は11月6日～11月10日に受け付け、当選した人は12月1日～12月18日に発送される予定です。</li>
          <li><b>2026年11月13日（金）</b>：スペシャルデッキセットMEGA メガオーダイル・メガカイリュー・メガゲンガー（税込5,500円）。</li>
          <li><b>2026年9月16日（水）</b>：MEGA 拡張パック「30th CELEBRATION」。一部の地域をのぞき、世界で同時に発売されました。</li>
          <li><b>12月ごろ（予定）</b>：ポケモンセンターオンラインは、30th CELEBRATIONの拡張パックBOX、プレミアムデッキセット（イーブイ／ブラッキー）、FUTURISTIC BOXの追加抽選を予定しています（2026年9月29日のお知らせ。くわしい内容はあとで発表）。</li>
          </ul>
      - h: 定価で買うコツ
        html: >-
          <ul>
          <li>ポケモンセンターオンラインの本人認証済み枠に応募できるように、プレイヤーズクラブの本人認証とメールアドレスの登録を早めにすませておく。</li>
          <li>家電量販店の抽選は、決められた期間の購入履歴が条件になることが多いので、ふだん使うお店の会員登録をしておく。</li>
          <li>受付期間は1日ほどと短いことがあります。当選後の購入期限や支払い期限をすぎると、買う権利がなくなります。</li>
          <li>アカウントを複数使っての応募は、失格になることがあります。</li>
          <li>このサイトでは、ポケモンカードの抽選・予約の受付を見つけしだい下の一覧に載せ、X（@a9994aaa）でもお知らせしています。</li>
          </ul>
    faq:
      - ["ポケモンセンターオンラインの抽選は何回応募できますか？", "1つの商品につき1人1回までです。先着ではなく抽選で、落選した人は買えません。"]
      - ["本人認証済み枠と未認証枠はどう違いますか？", "本人認証済み枠は、プレイヤーズクラブでマイナンバーカードによる本人認証をすませた人が応募できる枠で、当選の多くはこちらに割り当てられます。未認証枠では、ポケモンセンターオンラインでの電話番号認証が必要です。"]
      - ["ハドウシーカーの定価はいくらですか？", "1パック200円（税込・5枚入り）です。ポケモンセンターオンラインでは1BOX（30パック）6,000円（税込）でした。"]
    sources:
