    group: console
    name: PS5（PlayStation 5）本体・PS5 Pro
    short: PS5
    slug: ps5
    hashtags: "#PS5 #PS5Pro #PS5抽選"
    hints: "PS5|PlayStation ?5|プレステ5|プレイステーション ?5|DualSense|デュアルセンス"
    strip_words: "本体|同梱版|同梱|セット|通常版|デジタル・?エディション|Digital ?Edition|CFI-\\w+"
    aff_keywords: ["PS5 本体", "PS5 コントローラー"]
    color: "#1b4965"
    kinds: [lottery, invite, preorder, restock, first_come, release]
    enabled: true

