# ゲーム・ホビー入荷速報：カテゴリの一覧（カテゴリを増やす＝ここに1ブロック足す ＋ sources.yaml に情報元を足す）
#
# groups   … 上のタブのまとまり（ゲーム機／ゲーム関連の限定品／ホビー・おもちゃ）
# categories の各項目：
#   id          … プログラム内の名前（英数字。抽選データの game に入る）
#   group       … 上の groups のどれか
#   name        … 正式名（AIへの指示・ページの説明文に使う）
#   short       … 短い名前（タブ・カードのラベル）
#   slug        … ページのアドレス（/ps5/ のように）
#   hashtags    … Xの下書きに付けるハッシュタグ
#   hints       … 商品名からこのカテゴリと分かる言葉（正規表現。別カテゴリに入ってしまった抽選を直すのに使う）
#   strip_words … 重複をまとめる時に無視する共通の言葉（正規表現。「本体」「同梱版」など）
#   aff_keywords… 関連商品（Amazon・楽天の検索リンク）に使う言葉
#   color       … カテゴリの色（カードのラベル・共有画像）
#   kinds       … このカテゴリで出てくる種類（lottery=抽選 / invite=招待 / preorder=予約 / restock=再入荷 / first_come=先着 / fukubukuro=福袋 / release=発売日・再販日）
#   enabled     … false にすると集めない・ページも作らない（情報元を用意するまで）

groups:
  console: ゲーム機
  game_goods: ゲーム関連の限定品
  hobby: ホビー・おもちゃ
  liquor: お酒
  kaden: 家電・カメラ

