    short: PS5
    slug: ps5
    hashtags: "#PS5 #PS5Pro #PS5抽選"
    hints: "PS5|PlayStation ?5|プレステ5|プレイステーション ?5|DualSense|デュアルセンス|PlayStation ?Portal|リモートプレーヤー|PULSE ?(3D|Elite|Explore)|PS ?VR2|PlayStation ?VR2|VR2 CFIJ|CFIJ-\\d|CFI-[A-Z0-9]"
    strip_words: "本体|同梱版|同梱|セット|通常版|デジタル・?エディション|Digital ?Edition|CFI-\\w+"
    aff_keywords: ["PS5 本体", "PS5 コントローラー"]
    color: "#1b4965"
    kinds: [lottery, invite, preorder, restock, first_come, release]
    enabled: true
    subgenres:   # カテゴリの中のジャンル分け（11/14 ユーザー：スイッチなら本体・コントローラー・ゲームソフト）。上から順に当てはめ、re の無いものは残り全部
