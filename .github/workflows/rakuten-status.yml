name: rakuten-status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
        run: |
          B=https://rakuten-watch.supreme-buyer-1991.workers.dev
          echo "== status"; curl -s -m 20 $B/status | head -c 3000; echo
          echo "== push key"; curl -s -m 20 $B/push/key; echo
          echo "== push stats"; curl -s -m 20 $B/push/stats; echo
          echo "== push bad sub"; curl -s -m 20 -X POST -H "Content-Type: application/json" -d '{"sub":{"endpoint":"https://evil.example/x"}}' $B/push/sub; echo
          ADMIN=$(printf '%s' "$X_API_KEY$RAKUTEN_APP_ID" | sha256sum | cut -c1-24)
          echo "== dry"; curl -s -m 60 "$B/dry?k=$ADMIN" | python3 -c "import sys,json;d=json.load(sys.stdin);d.pop('out',None);print(json.dumps(d,ensure_ascii=False)[:2000])"
          echo "== dry-amazon"; curl -s -m 60 "$B/dry-amazon?k=$ADMIN" | head -c 3000; echo
