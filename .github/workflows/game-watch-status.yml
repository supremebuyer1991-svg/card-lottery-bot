name: game-watch-status
# 見張り（game-watch）の速報の記録（投稿した・見送った）を見る（読むだけ）
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
        run: |
          ADMIN=$(printf '%s' "${X_API_KEY}game-watch" | sha256sum | cut -c1-24)
          curl -sS "https://game-watch.supreme-buyer-1991.workers.dev/?k=${ADMIN}" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for w in ('rk','az'):
              print('=== posts',w)
              for p in d['posts'][w][:15]: print(p.get('t'),p.get('cur'),p.get('n'),p.get('tid'))
              print('=== skips',w)
              for p in d['skips'][w][:30]: print(p.get('t'),p.get('cur'),p.get('n'),'|',p.get('why'))
              print('last',w,d.get(w))
          "
