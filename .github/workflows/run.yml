name: card-lottery-bot

on:
  schedule:
    # 日本時間 7・9・10・11・12・13・15・17・18・20・21・23時の17分（UTCで記述）。GitHubの無料枠に収めるため1日12回
    #   7時＝今日締切・12時/17時＝新着・20時＝まもなく締切・21時＝Amazon招待と夜の相場（スレッズのまとめの時刻）を含める
    - cron: "17 22,1,4,8,10,13 * * *"  # 日本時間 7:17・10:17・13:17・17:17・19:17・22:17（6回）。Xの予約投稿の前に新しいデータ。GitHubの無料枠に収めるため（11/8）
  workflow_dispatch:      # 手動実行ボタン
  issues:
    types: [labeled]      # 承認ラベルを付けたら即投稿

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    timeout-minutes: 20
    steps:
      - name: remember the start time (keeps each run under 5 billed minutes)
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: keep the site-upload tool (wrangler) between runs
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-wrangler4-${{ runner.os }}
      - name: keep the share-image cache between runs (saves build time)
        uses: actions/cache@v4
        with:
          path: .cache
          key: ogcache-${{ github.run_id }}
          restore-keys: ogcache-
      - name: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          AUTO_APPROVE: ${{ vars.AUTO_APPROVE }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          GA_ID: ${{ vars.GA_ID }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ vars.RAKUTEN_AFFILIATE_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            python src/main.py publish
          else
            python src/main.py all
          fi
      # 姉妹サイト「ゲーム・ホビー入荷速報」（game-nyuka.com）。同じ実行の中で続けて作る（Actions の時間を節約）。
      # 失敗してもトレカ側には影響しない（|| true）。4分で打ち切り
      - name: run game & hobby site (SITE=game)
        if: github.event_name != 'issues'
        env:
          SITE: game
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL_GAME: ${{ vars.SITE_URL_GAME }}
          AMAZON_TAG_GAME: ${{ vars.AMAZON_TAG_GAME }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          # 写真の無い商品の写真をAmazonから（Creators API。見張りと同じ鍵。11/14）
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_CREDENTIAL_VERSION: ${{ secrets.AMAZON_CREDENTIAL_VERSION }}
          # 楽天ブックスの商品写真・商品ページ（トレカと同じ鍵。Referer は楽天に登録してあるトレカのサイトのURL）
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ vars.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_AFFILIATE_ID_GAME: ${{ vars.RAKUTEN_AFFILIATE_ID_GAME }}
          RAKUTEN_REFERER: ${{ vars.SITE_URL }}
          GA_ID_GAME: ${{ vars.GA_ID_GAME }}
          # Xの速報（@a9994aaa）：アプリの鍵はトレカと同じ、アカウントの鍵はゲーム用
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_GAME_ACCESS_TOKEN: ${{ secrets.X_GAME_ACCESS_TOKEN }}
          X_GAME_ACCESS_SECRET: ${{ secrets.X_GAME_ACCESS_SECRET }}
          # 日本の買取店を読む中継（Cloudflare Worker jp-fetch）の鍵の元
          JPFETCH_SEED: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: |
          timeout 300 python src/main.py all || echo "ゲームサイト 失敗または時間切れ（トレカ側には影響なし）"
      - name: deploy site (Cloudflare Pages)
        if: env.HAS_CF == 'true' && hashFiles('site/index.html') != '' && (hashFiles('site/.changed') != '' || github.event_name == 'workflow_dispatch')
        env:
          CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PROJECT || 'toreca-chusen-navi' }}
        run: |
          # サイトに変化がなく作り直していない時は、公開しない（手動実行のときにここで止まって状態が保存されなかったため）
          if [ ! -f site/index.html ]; then echo "サイトに変化なし：公開をスキップ"; exit 0; fi
          # 貼り付け時に混ざった空白・改行・「Bearer」などを取り除く
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN_RAW" | sed 's/.*Bearer //' | tr -d '[:space:]"')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_RAW" | tr -d '[:space:]"')"
          echo "トークンの文字数: ${#CLOUDFLARE_API_TOKEN}（通常40前後） / アカウントIDの文字数: ${#CLOUDFLARE_ACCOUNT_ID}（通常32）"
          # サイトの置き場所はもう作ってあるので、作り直しの確認は手動実行のときだけ（毎回やると時間のむだ）
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main || true
          fi
          npx --yes wrangler@4 pages deploy site --project-name="$PROJECT" --branch=main --commit-dirty=true
      - name: deploy game & hobby site (Cloudflare Pages)
        # GitHub の Variable「CF_PROJECT_GAME」（Cloudflare Pages のプロジェクト名。例 game-nyuka）を入れるまでは何もしない
        if: env.HAS_CF == 'true' && vars.CF_PROJECT_GAME != '' && hashFiles('site_game/index.html') != '' && (hashFiles('site_game/.changed') != '' || github.event_name == 'workflow_dispatch')
        env:
          CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PROJECT_GAME }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN_RAW" | sed 's/.*Bearer //' | tr -d '[:space:]"')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_RAW" | tr -d '[:space:]"')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main || true
          fi
          npx --yes wrangler@4 pages deploy site_game --project-name="$PROJECT" --branch=main --commit-dirty=true || echo "ゲームサイトの公開に失敗（トレカ側には影響なし）"
      - name: post to Threads (after the site is published)
        if: github.event_name != 'issues'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python src/threads.py || true
      - name: notify search engines (IndexNow)
        if: hashFiles('site/.changed') != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python src/indexnow.py || true
      - name: notify search engines about the game & hobby site (IndexNow)
        if: vars.CF_PROJECT_GAME != '' && hashFiles('site_game/.changed') != ''
        env:
          SITE: game
        run: python src/indexnow.py --dir site_game || true
      - name: announce new sets on X (only when a new set was found)
        if: github.event_name != 'issues'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python src/announce.py || true
      - name: send new lotteries to Discord (copy-paste drafts for X)
        if: github.event_name != 'issues'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python src/notify.py || true
      - name: save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/   # state/game/ もこの中（姉妹サイトの状態）
          git diff --cached --quiet && exit 0
          git commit -m "update state"
          # 実行中に別の変更（プログラムの更新など）が入っていても保存できるよう、取り込んでから送る
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
