name: card-lottery-bot

on:
  schedule:
    # 日本時間 7:00〜24:59 の30分ごと（UTCで記述）
    - cron: "*/30 0-15,22-23 * * *"
  workflow_dispatch:      # 手動実行ボタン
  issues:
    types: [labeled]      # 承認ラベルを付けたら即投稿

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          AUTO_APPROVE: ${{ vars.AUTO_APPROVE }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          AMAZON_TAG: ${{ vars.AMAZON_TAG }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ vars.RAKUTEN_AFFILIATE_ID }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            python src/main.py publish
          else
            python src/main.py all
          fi
      - name: deploy site (Cloudflare Pages)
        if: env.HAS_CF == 'true' && (hashFiles('site/.changed') != '' || github.event_name == 'workflow_dispatch')
        env:
          CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PROJECT || 'toreca-chusen-navi' }}
        run: |
          # 貼り付け時に混ざった空白・改行・「Bearer」などを取り除く
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN_RAW" | sed 's/.*Bearer //' | tr -d '[:space:]"')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_RAW" | tr -d '[:space:]"')"
          echo "トークンの文字数: ${#CLOUDFLARE_API_TOKEN}（通常40前後） / アカウントIDの文字数: ${#CLOUDFLARE_ACCOUNT_ID}（通常32）"
          # 初回だけサイトの置き場所を自動で作る（2回目以降は「もうある」で何もしない）
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main || true
          npx --yes wrangler@4 pages deploy site --project-name="$PROJECT" --branch=main
      - name: notify search engines (IndexNow)
        if: hashFiles('site/.changed') != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python src/indexnow.py || true
      - name: announce new sets on X (only when a new set was found)
        if: github.event_name != 'issues'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python src/announce.py || true
      - name: send new lotteries to Discord (copy-paste drafts for X)
        if: github.event_name != 'issues'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python src/notify.py || true
      - name: save state
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "update state"
          # 実行中に別の変更（プログラムの更新など）が入っていても保存できるよう、取り込んでから送る
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
