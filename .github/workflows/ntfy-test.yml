name: ntfy-test
# スマホ通知（ntfy）のテスト
on: workflow_dispatch
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          curl -sS -H "Content-Type: application/json" -d '{"topic":"game-nyuka-58ac664db7d2","title":"テスト通知（届いたらOK）","message":"ゲーム・ホビー入荷速報の通知テストです。押すとXの投稿画面が開きます（テストなので投稿はしないでね）","priority":5,"click":"https://x.com/intent/post?text=%E3%83%86%E3%82%B9%E3%83%88"}' https://ntfy.sh/
