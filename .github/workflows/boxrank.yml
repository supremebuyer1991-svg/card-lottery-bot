name: box-rank-video

# BOX相場の上昇・下落ランキング動画をつくって Discord に送る（水・金・土・日は YouTube にも1本ずつ予約投稿）
on:
  schedule:
    # 水・金・土・日の 17:17（日本時間）にその日の1本をつくって、YouTube に19時の予約投稿＋ Discord に送る
    #   水＝ワンピ下落 / 金＝ポケカ上昇 / 土＝ワンピ上昇 / 日＝ポケカ下落
    - cron: "17 8 * * 0,3,5,6"
  workflow_dispatch:
    inputs:
      span:
        description: "week（今週）か day（今日）"
        default: "week"
      args:
        description: "追加の指定（例: --theme=light,dark,game --only=pokemon-up）"
        default: ""

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: make video
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          ARGS="${{ github.event.inputs.args }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="--theme=light --youtube --weekly-slot"; fi
          cd src && python boxrank.py ../video "${{ github.event.inputs.span || 'week' }}" --send $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: box-rank-video
          path: video/*.mp4
          retention-days: 3
