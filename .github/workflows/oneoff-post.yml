name: oneoff-post
on:
  workflow_dispatch:
    inputs:
      post_at:
        description: "投稿時刻（日本時間 例 2026-11-06T13:40）"
        required: false
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt requests_oauthlib
      - env:
          POST_AT: ${{ inputs.post_at }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python tools/oneoff_post.py
