name: rakuten-watch-deploy

# 楽天ブックスの見張り（Cloudflare Worker）を公開する。worker/rakuten-watch を変えたとき・手動で
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/rakuten-watch/**", ".github/workflows/rakuten-watch.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: deploy
        env:
          CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFF: ${{ vars.RAKUTEN_AFFILIATE_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN_RAW" | sed 's/.*Bearer //' | tr -d '[:space:]"')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT_RAW" | tr -d '[:space:]"')"
          [ -n "$RAKUTEN_AFF" ] || RAKUTEN_AFF="0f60e3a0.0ec21e9a.0f60e3a1.23a40abb"
          cd worker/rakuten-watch
          # 前の状態を置く場所（KV）。なければ作る
          ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100" | python3 -c "import sys,json;j=json.load(sys.stdin);print(j.get('errors') and ('ERR '+str(j['errors'])) or next((n['id'] for n in j['result'] if n['title']=='rakuten-watch-state'),''))")
          echo "KV: $ID"
          if [ -z "$ID" ]; then
            ID=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"title":"rakuten-watch-state"}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" | python3 -c "import sys,json;j=json.load(sys.stdin);print(j['result']['id'] if j.get('success') else 'ERR '+str(j.get('errors')))")
            echo "KV作成: $ID"
          fi
          case "$ID" in ERR*) echo "::error::CloudflareのKVを作れません（トークンに Workers KV Storage の編集権限が必要）"; exit 1;; esac
          cat > wrangler.toml <<TOML
          name = "rakuten-watch"
          main = "index.js"
          compatibility_date = "2026-10-01"
          workers_dev = true
          [triggers]
          crons = ["*/2 * * * *"]
          [[kv_namespaces]]
          binding = "STATE"
          id = "$ID"
          TOML
          sed -i 's/^          //' wrangler.toml
          npx --yes wrangler@4 deploy
          ADMIN=$(printf '%s' "$X_API_KEY$RAKUTEN_APP_ID" | sha256sum | cut -c1-24)
          for k in RAKUTEN_APP_ID RAKUTEN_ACCESS_KEY RAKUTEN_AFF X_API_KEY X_API_SECRET X_ACCESS_TOKEN X_ACCESS_SECRET; do
            printf '%s' "${!k}" | tr -d '[:space:]' | npx --yes wrangler@4 secret put "$k" >/dev/null
          done
          printf '%s' "$ADMIN" | npx --yes wrangler@4 secret put ADMIN_KEY >/dev/null
          echo "公開しました"
