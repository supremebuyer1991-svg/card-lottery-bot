name: gacha-tiktok

# ガチャプラネット（gachapla.com）の毎日のリール動画（音なし版）を、ガチャ用 TikTok アカウントの受信箱（下書き）に送る。
# 投稿はユーザーが TikTok アプリで曲をのせて行う。動画はガチャサイトの公開のたびに作られる（gacha-site の src/reel.js）。
on:
  schedule:
    - cron: "47 3 * * *"   # 日本時間 12:47
  workflow_dispatch:

concurrency:
  group: gacha-tiktok
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 動画を受け取って TikTok の下書きに送る
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCOUNT: gacha
        run: |
          D=$(TZ=Asia/Tokyo date +%F)
          mkdir -p video
          if ! curl -fsSL -o video/gacha.mp4 "https://gachapla.com/images/social/reel-$D-silent.mp4"; then
            echo "今日のガチャの動画がまだありません（$D）"; exit 0
          fi
          cd src && python tiktok.py test ../video/gacha.mp4
      - name: save state
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "update state (gacha tiktok)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
